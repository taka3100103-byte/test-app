<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中1 国語 2学期末テスト対策 重要語句フラッシュカード</title>
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-light: #eef2ff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --ok: #16a34a;
    --ok-bg: #f0fdf4;
    --retry: #ea580c;
    --retry-bg: #fff7ed;
    --point-bg: #fefce8;
    --point-border: #eab308;
    --radius: 16px;
    --shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 18px 14px 56px;
  }
  .container {
    max-width: 760px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 16px;
  }
  header h1 {
    font-size: 1.38rem;
    margin: 0 0 4px;
    color: var(--text);
  }
  header p {
    margin: 0;
    font-size: 0.86rem;
    color: var(--muted);
  }

  /* Mode Tabs */
  .tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
  }
  .tab-btn {
    padding: 8px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--muted);
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }
  .tab-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* Unit Filter Bar */
  .panel {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .unit-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 12px;
  }
  .pill {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    color: #334155;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.12s ease;
  }
  .pill:hover {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .pill.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 0.84rem;
  }
  .toolbar-left, .toolbar-right {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .mini-btn {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #f8fafc;
    color: #334155;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .mini-btn:hover { background: #e2e8f0; }
  .mini-btn.accent {
    background: var(--retry-bg);
    color: var(--retry);
    border-color: #fdba74;
  }

  /* Progress */
  .progress-wrap {
    margin-bottom: 14px;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.84rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .progress-track {
    height: 8px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.25s ease;
  }

  /* 3D Flip Card */
  .scene {
    perspective: 1200px;
    margin-bottom: 16px;
  }
  .flashcard {
    position: relative;
    width: 100%;
    min-height: 310px;
    transform-style: preserve-3d;
    transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    cursor: pointer;
  }
  .flashcard.is-flipped {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .face-back {
    transform: rotateY(180deg);
    background: #ffffff;
    cursor: default;
  }
  .face-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.76rem;
    font-weight: 700;
    background: var(--primary-light);
    color: var(--primary);
  }
  .side-tag {
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .front-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18px 8px;
  }
  .q-prompt {
    font-size: 1.24rem;
    font-weight: 800;
    color: var(--text);
    white-space: pre-line;
    margin: 0;
  }
  .tap-hint {
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .back-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    padding: 12px 0;
  }
  .answer-box {
    text-align: center;
    padding: 12px 14px;
    background: var(--primary-light);
    border-radius: 12px;
  }
  .answer-label {
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 2px;
  }
  .answer-text {
    font-size: 1.3rem;
    font-weight: 800;
    color: #1e1b4b;
    margin: 0;
    white-space: pre-line;
  }
  .point-box {
    padding: 12px 14px;
    background: var(--point-bg);
    border-left: 4px solid var(--point-border);
    border-radius: 8px;
    font-size: 0.92rem;
    color: #334155;
  }
  .point-label {
    font-weight: 800;
    font-size: 0.8rem;
    color: #a16207;
    margin-bottom: 2px;
  }

  /* Action Buttons */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .act-btn {
    padding: 13px 16px;
    border-radius: 12px;
    border: 2px solid transparent;
    font-size: 0.98rem;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .act-btn:active { transform: scale(0.98); }
  .act-retry {
    background: var(--retry-bg);
    color: var(--retry);
    border-color: #fdba74;
  }
  .act-ok {
    background: var(--ok-bg);
    color: var(--ok);
    border-color: #86efac;
  }
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .flip-btn {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 1rem;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
  }
  .flip-btn:hover { background: var(--primary-hover); }

  /* Complete View */
  .done-card {
    text-align: center;
    padding: 30px 20px;
  }
  .done-title {
    font-size: 1.4rem;
    font-weight: 800;
    margin: 0 0 8px;
  }
  .done-sub {
    color: var(--muted);
    margin: 0 0 20px;
    font-size: 0.94rem;
  }
  .done-btns {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .btn-main {
    padding: 11px 20px;
    border-radius: 10px;
    border: none;
    background: var(--primary);
    color: #fff;
    font-weight: 700;
    font-size: 0.92rem;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-sub {
    padding: 11px 20px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--text);
    font-weight: 700;
    font-size: 0.92rem;
    cursor: pointer;
    font-family: inherit;
  }

  /* List Mode (Red-Sheet Style) */
  .list-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .list-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .list-q {
    font-weight: 700;
    font-size: 0.96rem;
    margin: 6px 0 8px;
    white-space: pre-line;
  }
  .list-ans {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    background: var(--primary-light);
    color: #1e1b4b;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .list-ans.masked {
    background: #ef4444;
    color: transparent;
    user-select: none;
  }
  .list-point {
    margin-top: 8px;
    font-size: 0.85rem;
    color: #475569;
  }

  .hidden { display: none !important; }
  @media (max-width: 540px) {
    .flashcard { min-height: 330px; }
    .q-prompt { font-size: 1.1rem; }
    .answer-text { font-size: 1.15rem; }
    .kbd-hint { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>中1 国語 2学期末テスト 重要語句フラッシュカード</h1>
    <p>全66枚｜表面で用語を思い出し、裏面で「答え＋狙われやすい一言ポイント」を確認</p>
  </header>

  <div class="tabs">
    <button id="tab-card" class="tab-btn active">カードで復習</button>
    <button id="tab-list" class="tab-btn">一覧・赤シートモード</button>
  </div>

  <div class="panel">
    <div id="unit-pills" class="unit-pills"></div>
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="shuffle-btn" class="mini-btn">順番をシャッフル</button>
        <button id="only-retry-btn" class="mini-btn accent hidden">要復習のみ（<span id="retry-count-badge">0</span>）</button>
      </div>
      <div class="toolbar-right">
        <span id="deck-info" style="color:var(--muted); font-weight:700;"></span>
      </div>
    </div>
  </div>

  <!-- Card Mode -->
  <div id="card-mode">
    <div id="play-area">
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="card-pos">1 / 66</span>
          <span id="mastered-info">覚えた：0枚 ／ 要復習：0枚</span>
        </div>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <div class="scene">
        <div id="flashcard" class="flashcard">
          <div class="face face-front">
            <div class="face-top">
              <span id="front-unit" class="badge"></span>
              <span class="side-tag">問題（表面）</span>
            </div>
            <div class="front-body">
              <p id="front-q" class="q-prompt"></p>
            </div>
            <div class="tap-hint">カードをタップ（または Spaceキー）で裏返す</div>
          </div>

          <div class="face face-back">
            <div class="face-top">
              <span id="back-unit" class="badge"></span>
              <span class="side-tag">答え＆ポイント（裏面）</span>
            </div>
            <div class="back-body">
              <div class="answer-box">
                <div class="answer-label">答え</div>
                <p id="back-a" class="answer-text"></p>
              </div>
              <div class="point-box">
                <div class="point-label">テストで狙われやすい一言ポイント</div>
                <div id="back-p"></div>
              </div>
            </div>
            <div class="tap-hint">下のボタンで仕分けして次へ進もう</div>
          </div>
        </div>
      </div>

      <div id="front-action">
        <button id="flip-btn" class="flip-btn">答えを見る（裏返す）</button>
      </div>
      <div id="back-action" class="actions hidden">
        <button id="btn-retry" class="act-btn act-retry">もう一度（要復習）</button>
        <button id="btn-ok" class="act-btn act-ok">覚えた！（OK）</button>
      </div>

      <div class="nav-row">
        <button id="prev-btn" class="mini-btn">← 前のカード</button>
        <span class="kbd-hint">Space：裏返す ／ ←：要復習 ／ →：覚えた</span>
        <button id="reset-deck-btn" class="mini-btn">最初からやり直す</button>
      </div>
    </div>

    <div id="done-area" class="panel done-card hidden">
      <h2 class="done-title">このセットを1周しました！</h2>
      <p id="done-summary" class="done-sub"></p>
      <div class="done-btns">
        <button id="done-retry-btn" class="btn-main hidden">「要復習」だけもう1周する</button>
        <button id="done-restart-btn" class="btn-sub">全枚数を最初から</button>
      </div>
    </div>
  </div>

  <!-- List Mode -->
  <div id="list-mode" class="hidden">
    <div class="list-controls">
      <span style="font-size:0.85rem; color:var(--muted);">赤い部分をタップすると答えが見えます</span>
      <button id="toggle-mask-btn" class="mini-btn">すべての答えを隠す／表示</button>
    </div>
    <div id="list-container"></div>
  </div>
</div>

<script>
const CARDS = [
  // === 1. シジュウカラ ===
  {
    unit: "シジュウカラ",
    q: "シジュウカラの胸から腹にかけてある特徴的な模様は、何に例えられるか。",
    a: "ネクタイ（のような黒い模様）",
    p: "大きさは「スズメほど（約15cm）」、黒い頭に白い頬、ネクタイ模様。カラスやハトとのひっかけに注意。"
  },
  {
    unit: "シジュウカラ",
    q: "筆者がシジュウカラを研究する「転機」となった出来事（2008年6月）は何か。",
    a: "アオダイショウ（ヘビ）が巣箱に迫り、親鳥が「ジャージャー」と鳴いたこと",
    p: "ヘビに対してだけ、タカなど他の天敵とは違う鳴き声を出したことに着目した。"
  },
  {
    unit: "シジュウカラ",
    q: "シジュウカラの「ジャージャー」という鳴き声は、何を意味する「単語」だと考えられたか。",
    a: "ヘビ",
    p: "「逃げろ」や「エサがある」ではなく、天敵の種類そのもの（ヘビ）を表す単語。"
  },
  {
    unit: "シジュウカラ",
    q: "シジュウカラが周囲を警戒するときに出す鳴き声はどれか。",
    a: "ピーツピ",
    p: "「ピーツピ」を聞かせると首を左右に振って周囲を警戒する。地面や巣箱をのぞくのは「ジャージャー」。"
  },
  {
    unit: "シジュウカラ",
    q: "【検証1】ヘビの姿を見せずに、録音した音声だけを聞かせたのはなぜか。",
    a: "ヘビを見た「恐怖心」で鳴いたのか、鳴き声自体が意味をもつのかを区別するため",
    p: "記述頻出！「ヘビがいない状態で音声だけを聞かせる」理由を言えるようにしよう。"
  },
  {
    unit: "シジュウカラ",
    q: "【検証2】音声実験に加えて、ヘビに似た動きをする「小枝」を見せた理由は何か。",
    a: "「地面や巣箱を確認しろ」という命令である可能性を排除し、ヘビの姿を思い浮かべているか確かめるため",
    p: "検証1だけでは「命令」という別の解釈が残るため、視覚と組み合わせて1つの解釈に絞った。"
  },
  {
    unit: "シジュウカラ",
    q: "筆者が20年以上の研究から導いた結論で、シジュウカラは異なる単語をどうする能力をもつとされるか。",
    a: "複数の「単語」を組み合わせる能力",
    p: "単語を使い分けるだけでなく、組み合わせてより複雑なメッセージを伝えることができる。"
  },
  {
    unit: "シジュウカラ",
    q: "コラム「生きる知恵としての言葉」で、カラ類3種を力が強い順に並べると？",
    a: "ゴジュウカラ → シジュウカラ → コガラ",
    p: "一番小さいコガラは「タカが来た！」という言葉を巧みに使ってエサにありつく。"
  },
  {
    unit: "シジュウカラ",
    q: "【重要語句】仮に立てた考えのことを何というか。",
    a: "仮説（かせつ）",
    p: "「分析（細かな要素に分ける）」「検証（実際に調べて確かめる）」「定義（意味をはっきり決める）」と区別！"
  },
  {
    unit: "シジュウカラ",
    q: "【重要語句】驚くような高い大きな音があがる様子を表す言葉は？",

    p: "ほかに「いち早く（まっ先に）」「転機（別の状態に変わるきっかけ）」もテストで狙われやすい。"

  // === 2. 集中力・案内文 ===

    unit: "集中力・案内文",

  {
    unit: "集中力・案内文",

    a: "40分",
    p: "脳の部位は「前頭葉（ぜんとうよう）」。集中力が続くのは40分ほどとされる。"
  },
  {
    unit: "集中力・案内文",
    q: "筆者がおすすめする「ノマド（遊牧民）のような勉強法」とはどのような方法か。",
    a: "家の中に複数の勉強スペースを用意し、移動しながら勉強する方法",

  },
  {
    unit: "集中力・案内文",
    q: "「10月4日」発行の中学校演劇祭の案内文に入れる、季節の挨拶として適切な言葉は？",

  },
  {
    unit: "集中力・案内文",
    q: "案内文「当日は、南側の門よりお入りください。」の横に添えると親切な資料は何か。",

    p: "イベントの写真やイラストではなく、「保護者が迷わず会場に着くための地図」が正解。"
  },
  {
    unit: "集中力・案内文",
    q: "「車での来校するのはだめです」を保護者向けの丁寧な案内文に直すとどうなるか。",
    a: "車での来校はひかえてください。",
    p: "「だめです」などの口語を敬語に直し、注意事項は「箇条書き」にすると読みやすい。"
  },
  {
    unit: "集中力・案内文",
    q: "案内文で日時・場所・持ち物などを整理して見やすくする工夫を何というか。",
    a: "箇条書き（かじょうがき）",
    p: "文章でだらだら書かず、項目ごとに箇条書きにすることで必要な情報がすぐ伝わる。"
  },

const UNIT_ORDER = [
  "すべて",
  "シジュウカラ",
  "集中力・案内文",
  "方言と共通語",
  "文法（文の組み立て）",
  "いろは歌",
  "歴史的仮名遣い",
  "竹取物語",
  "漢字・語句"
];

let selectedUnit = "すべて";
let onlyRetryMode = false;
let isShuffled = false;
let activeDeck = [];
let currentIdx = 0;
let isFlipped = false;
let okSet = new Set();
let retrySet = new Set();
let listMasked = false;

// Assign stable IDs
CARDS.forEach((c, i) => { c.id = i; });

const unitPills = document.getElementById("unit-pills");
const flashcard = document.getElementById("flashcard");
const frontAction = document.getElementById("front-action");
const backAction = document.getElementById("back-action");
const playArea = document.getElementById("play-area");
const doneArea = document.getElementById("done-area");
const onlyRetryBtn = document.getElementById("only-retry-btn");
const retryCountBadge = document.getElementById("retry-count-badge");

function initPills() {
  unitPills.innerHTML = "";
  UNIT_ORDER.forEach(u => {
    const count = u === "すべて" ? CARDS.length : CARDS.filter(c => c.unit === u).length;
    const btn = document.createElement("button");
    btn.className = "pill" + (u === selectedUnit ? " active" : "");
    btn.textContent = `${u} (${count})`;
    btn.addEventListener("click", () => {
      selectedUnit = u;
      onlyRetryMode = false;
      initPills();
      buildDeck();
    });
    unitPills.appendChild(btn);
  });
}

function shuffleArr(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function buildDeck() {
  let list = selectedUnit === "すべて"
    ? [...CARDS]
    : CARDS.filter(c => c.unit === selectedUnit);

  if (onlyRetryMode) {
    const filtered = list.filter(c => retrySet.has(c.id));
    if (filtered.length > 0) list = filtered;
    else onlyRetryMode = false;
  }
  if (isShuffled) list = shuffleArr(list);

  activeDeck = list;
  currentIdx = 0;
  isFlipped = false;

  playArea.classList.remove("hidden");
  doneArea.classList.add("hidden");
  document.getElementById("deck-info").textContent =
    (onlyRetryMode ? "要復習モード：" : "") + `全 ${activeDeck.length} 枚`;

  renderCard();
  renderList();
}

function updateRetryBadge() {
  retryCountBadge.textContent = retrySet.size;
  if (retrySet.size > 0) {
    onlyRetryBtn.classList.remove("hidden");
  } else {
    onlyRetryBtn.classList.add("hidden");
  }
}

function renderCard() {
  if (currentIdx >= activeDeck.length) {
    showDone();
    return;
  }
  const c = activeDeck[currentIdx];
  isFlipped = false;
  flashcard.classList.remove("is-flipped");
  frontAction.classList.remove("hidden");
  backAction.classList.add("hidden");

  document.getElementById("front-unit").textContent = c.unit;
  document.getElementById("back-unit").textContent = c.unit;
  document.getElementById("front-q").textContent = c.q;
  document.getElementById("back-a").textContent = c.a;
  document.getElementById("back-p").textContent = c.p;

  document.getElementById("card-pos").textContent = `${currentIdx + 1} / ${activeDeck.length} 枚目`;
  document.getElementById("mastered-info").textContent = `覚えた：${okSet.size}枚 ／ 要復習：${retrySet.size}枚`;
  document.getElementById("progress-fill").style.width = `${(currentIdx / activeDeck.length) * 100}%`;
  updateRetryBadge();
}

function flipCard() {
  isFlipped = !isFlipped;
  flashcard.classList.toggle("is-flipped", isFlipped);
  if (isFlipped) {
    frontAction.classList.add("hidden");
    backAction.classList.remove("hidden");
  } else {
    frontAction.classList.remove("hidden");
    backAction.classList.add("hidden");
  }
}

function markCard(isOk) {
  const c = activeDeck[currentIdx];
  if (isOk) {
    okSet.add(c.id);
    retrySet.delete(c.id);
  } else {
    retrySet.add(c.id);
    okSet.delete(c.id);
  }
  currentIdx += 1;
  renderCard();
}

function showDone() {
  playArea.classList.add("hidden");
  doneArea.classList.remove("hidden");
  updateRetryBadge();

  const unitRetryCount = activeDeck.filter(c => retrySet.has(c.id)).length;
  document.getElementById("done-summary").textContent =
    unitRetryCount === 0
      ? `この範囲の ${activeDeck.length} 枚をすべて「覚えた！」にしました。完璧です！`
      : `${activeDeck.length} 枚中、要復習が ${unitRetryCount} 枚あります。もう1周して定着させよう！`;

  const doneRetryBtn = document.getElementById("done-retry-btn");
  if (unitRetryCount > 0) {
    doneRetryBtn.classList.remove("hidden");
    doneRetryBtn.textContent = `「要復習（${unitRetryCount}枚）」だけもう1周する`;
  } else {
    doneRetryBtn.classList.add("hidden");
  }
}

function renderList() {
  const container = document.getElementById("list-container");
  container.innerHTML = "";
  activeDeck.forEach((c, idx) => {
    const div = document.createElement("div");
    div.className = "list-item";
    div.innerHTML = `
      <span class="badge">${c.unit} #${idx + 1}</span>
      <div class="list-q">${c.q}</div>
      <div><span class="list-ans ${listMasked ? "masked" : ""}">${c.a}</span></div>
      <div class="list-point">💡 ${c.p}</div>
    `;
    const ansEl = div.querySelector(".list-ans");
    ansEl.addEventListener("click", () => ansEl.classList.toggle("masked"));
    container.appendChild(div);
  });
}

// Events
flashcard.addEventListener("click", (e) => {
  if (e.target.closest(".face-back") && window.getSelection().toString()) return;
  flipCard();
});
document.getElementById("flip-btn").addEventListener("click", flipCard);
document.getElementById("btn-ok").addEventListener("click", () => markCard(true));
document.getElementById("btn-retry").addEventListener("click", () => markCard(false));
document.getElementById("prev-btn").addEventListener("click", () => {
  if (currentIdx > 0) {
    currentIdx -= 1;
    renderCard();
  }
});
document.getElementById("reset-deck-btn").addEventListener("click", () => {
  onlyRetryMode = false;
  buildDeck();
});
document.getElementById("shuffle-btn").addEventListener("click", () => {
  isShuffled = !isShuffled;
  document.getElementById("shuffle-btn").textContent = isShuffled ? "順番を元に戻す" : "順番をシャッフル";
  buildDeck();
});
onlyRetryBtn.addEventListener("click", () => {
  onlyRetryMode = !onlyRetryMode;
  buildDeck();
});
document.getElementById("done-retry-btn").addEventListener("click", () => {
  onlyRetryMode = true;
  buildDeck();
});
document.getElementById("done-restart-btn").addEventListener("click", () => {
  onlyRetryMode = false;
  buildDeck();
});

document.getElementById("tab-card").addEventListener("click", () => {
  document.getElementById("tab-card").classList.add("active");
  document.getElementById("tab-list").classList.remove("active");
  document.getElementById("card-mode").classList.remove("hidden");
  document.getElementById("list-mode").classList.add("hidden");
});
document.getElementById("tab-list").addEventListener("click", () => {
  document.getElementById("tab-list").classList.add("active");
  document.getElementById("tab-card").classList.remove("active");
  document.getElementById("list-mode").classList.remove("hidden");
  document.getElementById("card-mode").classList.add("hidden");
});
document.getElementById("toggle-mask-btn").addEventListener("click", () => {
  listMasked = !listMasked;
  document.querySelectorAll(".list-ans").forEach(el => {
    el.classList.toggle("masked", listMasked);
  });
});

document.addEventListener("keydown", (e) => {
  if (document.getElementById("card-mode").classList.contains("hidden")) return;
  if (!doneArea.classList.contains("hidden")) return;
  if (e.code === "Space") {
    e.preventDefault();
    flipCard();
  } else if (e.key === "ArrowRight" && isFlipped) {
    markCard(true);
  } else if (e.key === "ArrowLeft" && isFlipped) {
    markCard(false);
  }
});

initPills();
buildDeck();
</script>
</body>
</html>
