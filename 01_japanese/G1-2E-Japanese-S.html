<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中1 国語 2学期末テスト対策 4択一問一答</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --correct: #16a34a;
    --correct-bg: #f0fdf4;
    --wrong: #dc2626;
    --wrong-bg: #fef2f2;
    --accent: #f59e0b;
    --radius: 14px;
    --shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    padding: 20px 14px 60px;
  }
  .container {
    max-width: 780px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 1.45rem;
    margin: 0 0 6px;
    color: #0f172a;
  }
  header p {
    margin: 0;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
  }
  /* Start / Filter Screen */
  .unit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 10px;
    margin: 16px 0 20px;
  }
  .unit-btn {
    text-align: left;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .unit-btn:hover {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .unit-btn.active {
    border-color: var(--primary);
    background: var(--primary-light);
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
  }
  .unit-btn .u-title {
    display: block;
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--text);
  }
  .unit-btn .u-count {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .toggle-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    user-select: none;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 11px 22px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.08s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: var(--primary);
    color: #fff;
  }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary {
    background: #e2e8f0;
    color: #334155;
  }
  .btn-secondary:hover { background: #cbd5e1; }
  .btn-outline {
    background: #fff;
    color: var(--primary);
    border: 1.5px solid var(--primary);
  }
  .btn-outline:hover { background: var(--primary-light); }

  /* Quiz Screen */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 700;
    background: var(--primary-light);
    color: var(--primary);
  }
  .progress-info {
    font-size: 0.88rem;
    color: var(--muted);
    font-weight: 600;
  }
  .progress-track {
    width: 100%;
    height: 8px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.25s ease;
  }
  .q-text {
    font-size: 1.1rem;
    font-weight: 700;
    margin: 0 0 18px;
    color: #0f172a;
    white-space: pre-line;
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .choice-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 13px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #fff;
    font-size: 0.98rem;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .choice-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .choice-btn:disabled { cursor: default; }
  .choice-label {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #f1f5f9;
    color: #475569;
    font-weight: 700;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .choice-btn.correct {
    border-color: var(--correct);
    background: var(--correct-bg);
  }
  .choice-btn.correct .choice-label {
    background: var(--correct);
    color: #fff;
  }
  .choice-btn.wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
  }
  .choice-btn.wrong .choice-label {
    background: var(--wrong);
    color: #fff;
  }
  .choice-btn.dimmed { opacity: 0.6; }

  /* Explanation Box */
  .feedback-box {
    margin-top: 20px;
    padding: 16px 18px;
    border-radius: 10px;
    border-left: 5px solid var(--primary);
    background: #f8fafc;
    display: none;
  }
  .feedback-box.show { display: block; animation: fadeIn 0.18s ease; }
  .feedback-box.is-correct {
    border-left-color: var(--correct);
    background: var(--correct-bg);
  }
  .feedback-box.is-wrong {
    border-left-color: var(--wrong);
    background: var(--wrong-bg);
  }
  .feedback-title {
    font-weight: 800;
    font-size: 1.05rem;
    margin: 0 0 6px;
  }
  .feedback-box.is-correct .feedback-title { color: var(--correct); }
  .feedback-box.is-wrong .feedback-title { color: var(--wrong); }
  .feedback-exp {
    margin: 0;
    font-size: 0.94rem;
    color: #1e293b;
  }
  .next-row {
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .kbd-hint {
    font-size: 0.78rem;
    color: var(--muted);
  }

  /* Result Screen */
  .score-hero {
    text-align: center;
    padding: 16px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .score-num {
    font-size: 2.5rem;
    font-weight: 800;
    color: var(--primary);
    line-height: 1.2;
  }
  .score-sub {
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 4px;
  }
  .breakdown-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 22px;
  }
  .breakdown-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: #f8fafc;
    border-radius: 8px;
    font-size: 0.9rem;
  }
  .breakdown-bar-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mini-bar {
    width: 90px;
    height: 7px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
  }
  .mini-fill {
    height: 100%;
    background: var(--correct);
  }
  .hidden { display: none !important; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 540px) {
    .card { padding: 18px 15px; }
    .q-text { font-size: 1.02rem; }
    .kbd-hint { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>中1 国語 2学期末テスト対策 4択一問一答</h1>
    <p>全60問で出題範囲を完全網羅｜1問ごとに答え合わせ＆解説</p>
  </header>

  <!-- Start Screen -->
  <section id="start-screen" class="card">
    <h2 style="margin:0 0 6px; font-size:1.1rem;">出題単元を選ぶ</h2>
    <p style="margin:0; font-size:0.86rem; color:var(--muted);">「全範囲」でテスト本番の総仕上げ、または苦手な単元だけ集中演習ができます。</p>
    <div id="unit-grid" class="unit-grid"></div>
    <div class="controls-row">
      <label class="toggle-label">
        <input type="checkbox" id="shuffle-toggle">
        <span>出題順をシャッフルする</span>
      </label>
      <button id="start-btn" class="btn btn-primary">テストを開始する</button>
    </div>
  </section>

  <!-- Quiz Screen -->
  <section id="quiz-screen" class="card hidden">
    <div class="top-bar">
      <span id="q-unit-badge" class="badge"></span>
      <span id="q-progress-text" class="progress-info"></span>
    </div>
    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <p id="q-text" class="q-text"></p>
    <div id="choices-container" class="choices"></div>

    <div id="feedback-box" class="feedback-box">
      <div id="feedback-title" class="feedback-title"></div>
      <p id="feedback-exp" class="feedback-exp"></p>
      <div class="next-row">
        <span class="kbd-hint">Enterキーでも次へ進めます</span>
        <button id="next-btn" class="btn btn-primary">次の問題へ</button>
      </div>
    </div>

    <div style="margin-top:16px; display:flex; justify-content:space-between; align-items:center;">
      <button id="quit-btn" class="btn btn-secondary" style="padding:7px 14px; font-size:0.82rem;">単元選択に戻る</button>
      <span id="live-score" class="progress-info"></span>
    </div>
  </section>

  <!-- Result Screen -->
  <section id="result-screen" class="card hidden">
    <div class="score-hero">
      <div id="final-score" class="score-num"></div>
      <div id="final-sub" class="score-sub"></div>
    </div>
    <h3 style="margin:0 0 10px; font-size:1rem;">単元別の正答率</h3>
    <div id="breakdown-list" class="breakdown-list"></div>
    <div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center;">
      <button id="retry-wrong-btn" class="btn btn-primary hidden">間違えた問題だけ復習する</button>
      <button id="retry-all-btn" class="btn btn-outline">同じ範囲をもう一度</button>
      <button id="back-home-btn" class="btn btn-secondary">単元選択に戻る</button>
    </div>
  </section>
</div>

<script>
const QUESTIONS = [
  // === 1. 「言葉」をもつ鳥、シジュウカラ（鈴木俊貴） ===
  {
    unit: "シジュウカラ",
    q: "『「言葉」をもつ鳥、シジュウカラ』について、シジュウカラの特徴として正しいものはどれか。",
    choices: [
      "カラスほどの大きさで、主に北海道にのみ生息する。",
      "スズメほどの大きさで、胸から腹にかけてネクタイのような黒い模様がある。",
      "ハトほどの大きさで、白い頭に黒い頬をしている。",
      "スズメより小さく、本州の山地のみに分布している。"
    ],
    answer: 1,
    exp: "シジュウカラはスズメほどの大きさ（体長約15cm）で、黒い頭に白い頬、胸から腹にかけてネクタイのような模様があります。北海道から沖縄まで日本列島に広く分布しています。"
  },
  {
    unit: "シジュウカラ",
    q: "筆者がシジュウカラの鳴き声について本格的に研究する「転機」となった出来事は何か。",
    choices: [
      "シジュウカラがタカを見て「ヒーヒー」と鳴いたのを目撃したこと。",
      "2008年6月、アオダイショウ（ヘビ）が巣箱に迫ったとき、親鳥が「ジャージャー」と鳴いたこと。",
      "シジュウカラがコガラとエサを奪い合っていたのを観察したこと。",
      "巣箱の中でヒナが「ピーツピ」と鳴いているのを録音したこと。"
    ],
    answer: 1,
    exp: "2008年6月のある日、アオダイショウ（ヘビ）が巣箱に迫った際、親鳥がヘビを威嚇しながら「ジャージャー」と鳴いていたことが研究の転機となりました。"
  },
  {
    unit: "シジュウカラ",
    q: "筆者が立てた仮説では、シジュウカラの「ジャージャー」という鳴き声は何だと考えられたか。",
    choices: [
      "「エサを見つけた」という喜びの合図",
      "「ヒナにエサを与えろ」という命令",
      "「ヘビ」を意味する「単語」",
      "「早く逃げろ」という一般的な警告"
    ],
    answer: 2,
    exp: "ヘビに対してだけ他の天敵と違う鳴き声を発していることに着目し、筆者は「ジャージャー」という鳴き声が「ヘビ」を意味する「単語」なのではないかという仮説を立てました。"
  },
  {
    unit: "シジュウカラ",
    q: "【仮説に対する検証1】ヘビがいない状況で、あえて録音した音声だけを聞かせたのはなぜか。",
    choices: [
      "生きたヘビを捕まえるのが難しかったから。",
      "「ジャージャー」という鳴き声はヘビを見た恐怖心から発したものかもしれず、姿を見せずに鳴き声だけ聞かせる必要があったから。",
      "親鳥が巣箱に戻る時間を正確に測るため。",
      "シジュウカラの聴力がどれほど優れているかを調べるため。"
    ],
    answer: 1,
    exp: "ヘビがいる状態では、ヘビを見た恐怖心で鳴いたのか、本当に鳴き声が意味をもっているのか区別できないため、姿を見せずに音声だけを聞かせる実験を行いました。"
  },
  {
    unit: "シジュウカラ",
    q: "【検証1の結果】「ジャージャー」という鳴き声を聞かせたとき、シジュウカラはどのような行動をとったか。",
    choices: [
      "首を左右に振り、周囲を警戒するだけだった。",
      "地面を確認し、巣箱の穴をのぞきこんだ。",
      "警戒行動をまったく示さなかった。",
      "一目散にしげみの中へ逃げ込んだ。"
    ],
    answer: 1,
    exp: "「ジャージャー」を聞かせると地面を確認し巣箱の穴をのぞき、「ピーツピ」では首を左右に振って周囲を警戒するだけ、鳴き声なしでは警戒行動を示しませんでした。"
  },
  {
    unit: "シジュウカラ",
    q: "【検証2】筆者が音声のみの検証1に加えて、小枝を使った検証2を行った理由は何か。",
    choices: [
      "「ジャージャー」が「地面や巣箱を確認しろ」という命令である可能性を排除し、ヘビの姿を思い浮かべているか確かめるため。",
      "シジュウカラが木の枝とヘビの色の違いを識別できるか調べるため。",
      "検証1の実験回数が少なすぎてデータが足りなかったため。",
      "ヘビが木を登る速さと小枝の動く速さを比べるため。"
    ],
    answer: 0,
    exp: "「ジャージャー」が「地面や巣箱を確認しろ」という命令かもしれないという別の解釈を検証するため、ヘビに似た動きをする小枝と似ていない動きの小枝を見せる実験を行いました。"
  },
  {
    unit: "シジュウカラ",
    q: "【検証2の結果】「ジャージャー」を聞かせながら、ヘビに似た動きをする小枝を見せたとき、シジュウカラはどうしたか。",
    choices: [
      "小枝にはほとんど接近しなかった。",
      "「ピーツピ」と鳴きながら飛び去った。",
      "木の幹に沿ってヘビのように動く小枝に近づいて確認した。",
      "小枝をくわえて巣箱に運ぼうとした。"
    ],
    answer: 2,
    exp: "「ジャージャー」を聞かせてヘビに似た動きをさせると小枝に近づきましたが、「ジャージャー」以外の鳴き声や、ヘビに似ていない動きの小枝にはほとんど接近しませんでした。"
  },
  {
    unit: "シジュウカラ",
    q: "筆者が20年以上の野外研究から導き出した、シジュウカラの能力についての結論はどれか。",
    choices: [
      "シジュウカラは人間と同じように文字を書いて伝えることができる。",
      "「ジャージャー」はヘビを意味する単語であり、さらに異なる「単語」を組み合わせてより複雑なメッセージを伝える能力ももつ。",
      "シジュウカラの鳴き声はすべて本能的な感情の表れにすぎない。",
      "シジュウカラはヘビ以外の天敵に対しては鳴き声を使い分けられない。"
    ],
    answer: 1,
    exp: "「ジャージャー」がヘビを意味する単語であると同時に、シジュウカラは異なる「単語」を使い分けるだけでなく、複数の「単語」を組み合わせる能力ももつことがわかりました。"
  },
  {
    unit: "シジュウカラ",
    q: "コラム「生きる知恵としての言葉」によると、カラ類の中で力が強い順として正しいものはどれか。",
    choices: [
      "コガラ → シジュウカラ → ゴジュウカラ",
      "シジュウカラ → ゴジュウカラ → コガラ",
      "ゴジュウカラ → シジュウカラ → コガラ",
      "ゴジュウカラ → コガラ → シジュウカラ"
    ],
    answer: 2,
    exp: "カラ類の中で体が大きく力があるのは、強い順に「ゴジュウカラ → シジュウカラ → コガラ」です。体の小さいコガラは「タカが来た！」という言葉を巧みに使ってエサにありつく知恵をもっています。"
  },
  {
    unit: "シジュウカラ",
    q: "『「言葉」をもつ鳥、シジュウカラ』の文章が説得力をもっている理由として、最も適切なものはどれか。",
    choices: [
      "シジュウカラの可愛らしい写真だけをたくさん載せているから。",
      "複数の解釈が生まれる場合に1つの解釈に絞るためさらに検証を加え、目的と方法を明確にした実験結果を根拠としているから。",
      "筆者の個人的な感想や予想だけを中心に物語のように書かれているから。",
      "他の研究者の意見を一切紹介せず、自分の主張だけを繰り返しているから。"
    ],
    answer: 1,
    exp: "仮説を検証し、別の解釈（命令かもしれない）が生まれた際にさらに検証2を行って根拠を示している点や、目的・方法を明確にしている点が説得力につながっています。"
  },
  {
    unit: "シジュウカラ",
    q: "次の語句の意味として正しいものはどれか。\n【 検証 】",
    choices: [
      "仮に立てた考えのこと。",
      "細かな要素に分け、性質や内容を明らかにすること。",
      "仮説が正しいかどうか、実際に調べて確かめること。",
      "物事の意味や内容をはっきりと決めること。"
    ],
    answer: 2,
    exp: "「検証」は実際に調べて確かめること。「仮説」は仮に立てた考え、「分析」は細かな要素に分けて明らかにすること、「定義」は意味や内容をはっきり決めることです。"
  },
  {
    unit: "シジュウカラ",
    q: "次の語句の意味として正しいものはどれか。\n【 けたたましい 】",
    choices: [

const LABELS = ["ア", "イ", "ウ", "エ"];
const UNIT_ORDER = [
  "すべて（全範囲）",
  "シジュウカラ",
  "集中力・案内文",
  "方言と共通語",
  "文法（文の組み立て）",
  "いろは歌",
  "歴史的仮名遣い",
  "竹取物語",
  "漢字・語句"
];

let selectedUnit = "すべて（全範囲）";
let activeList = [];
let currentIndex = 0;
let score = 0;
let answered = false;
let wrongItems = [];
let unitStats = {};

const startScreen = document.getElementById("start-screen");
const quizScreen = document.getElementById("quiz-screen");
const resultScreen = document.getElementById("result-screen");
const unitGrid = document.getElementById("unit-grid");
const shuffleToggle = document.getElementById("shuffle-toggle");

function initUnitGrid() {
  unitGrid.innerHTML = "";
  UNIT_ORDER.forEach(u => {
    const count = u === "すべて（全範囲）"
      ? QUESTIONS.length
      : QUESTIONS.filter(q => q.unit === u).length;
    const btn = document.createElement("button");
    btn.className = "unit-btn" + (u === selectedUnit ? " active" : "");
    btn.innerHTML = `<span class="u-title">${u}</span><span class="u-count">${count}問</span>`;
    btn.addEventListener("click", () => {
      selectedUnit = u;
      document.querySelectorAll(".unit-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    });
    unitGrid.appendChild(btn);
  });
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startQuiz(customList = null) {
  let base = customList
    ? [...customList]
    : (selectedUnit === "すべて（全範囲）"
        ? [...QUESTIONS]
        : QUESTIONS.filter(q => q.unit === selectedUnit));

  if (shuffleToggle.checked && !customList) {
    base = shuffleArray(base);
  }
  activeList = base;
  currentIndex = 0;
  score = 0;
  wrongItems = [];
  unitStats = {};

  startScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const item = activeList[currentIndex];
  document.getElementById("q-unit-badge").textContent = item.unit;
  document.getElementById("q-progress-text").textContent = `第 ${currentIndex + 1} 問 / 全 ${activeList.length} 問`;
  document.getElementById("progress-fill").style.width = `${((currentIndex) / activeList.length) * 100}%`;
  document.getElementById("live-score").textContent = `現在の正解数：${score}問`;
  document.getElementById("q-text").textContent = item.q;

  const feedbackBox = document.getElementById("feedback-box");
  feedbackBox.className = "feedback-box";

  const container = document.getElementById("choices-container");
  container.innerHTML = "";
  item.choices.forEach((choiceText, idx) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span class="choice-label">${LABELS[idx]}</span><span>${choiceText}</span>`;
    btn.addEventListener("click", () => selectAnswer(idx));
    container.appendChild(btn);
  });

  const nextBtn = document.getElementById("next-btn");
  nextBtn.textContent = (currentIndex === activeList.length - 1) ? "結果を見る" : "次の問題へ";
}

function selectAnswer(chosenIdx) {
  if (answered) return;
  answered = true;
  const item = activeList[currentIndex];
  const isCorrect = (chosenIdx === item.answer);

  if (!unitStats[item.unit]) unitStats[item.unit] = { total: 0, correct: 0 };
  unitStats[item.unit].total += 1;
  if (isCorrect) {
    score += 1;
    unitStats[item.unit].correct += 1;
  } else {
    wrongItems.push(item);
  }

  const btns = document.querySelectorAll(".choice-btn");
  btns.forEach((btn, idx) => {
    btn.disabled = true;
    if (idx === item.answer) {
      btn.classList.add("correct");
    } else if (idx === chosenIdx && !isCorrect) {
      btn.classList.add("wrong");
    } else {
      btn.classList.add("dimmed");
    }
  });

  document.getElementById("progress-fill").style.width = `${((currentIndex + 1) / activeList.length) * 100}%`;
  document.getElementById("live-score").textContent = `現在の正解数：${score}問`;

  const feedbackBox = document.getElementById("feedback-box");
  const feedbackTitle = document.getElementById("feedback-title");
  const feedbackExp = document.getElementById("feedback-exp");
  feedbackBox.className = "feedback-box show " + (isCorrect ? "is-correct" : "is-wrong");
  feedbackTitle.textContent = isCorrect
    ? `正解！（${LABELS[item.answer]}）`
    : `不正解… 正解は「${LABELS[item.answer]}」`;
  feedbackExp.textContent = item.exp;
}

function nextQuestion() {
  if (!answered) return;
  if (currentIndex < activeList.length - 1) {
    currentIndex += 1;
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  quizScreen.classList.add("hidden");
  resultScreen.classList.remove("hidden");
  const total = activeList.length;
  const pct = Math.round((score / total) * 100);
  document.getElementById("final-score").textContent = `${score} / ${total} 問正解（${pct}%）`;
  document.getElementById("final-sub").textContent =
    pct === 100 ? "全問正解！テスト本番も自信をもって臨めます。"
    : pct >= 80 ? "よくできました！間違えた問題を復習して完璧にしよう。"
    : "間違えた問題の解説を確認して、もう一度チャレンジしよう！";

  const list = document.getElementById("breakdown-list");
  list.innerHTML = "";
  Object.keys(unitStats).forEach(u => {
    const st = unitStats[u];
    const upct = Math.round((st.correct / st.total) * 100);
    const row = document.createElement("div");
    row.className = "breakdown-item";
    row.innerHTML = `
      <strong>${u}</strong>
      <div class="breakdown-bar-wrap">
        <span>${st.correct}/${st.total} (${upct}%)</span>
        <div class="mini-bar"><div class="mini-fill" style="width:${upct}%"></div></div>
      </div>
    `;
    list.appendChild(row);
  });

  const retryWrongBtn = document.getElementById("retry-wrong-btn");
  if (wrongItems.length > 0) {
    retryWrongBtn.classList.remove("hidden");
    retryWrongBtn.textContent = `間違えた問題だけ復習する（${wrongItems.length}問）`;
  } else {
    retryWrongBtn.classList.add("hidden");
  }
}

document.getElementById("start-btn").addEventListener("click", () => startQuiz());
document.getElementById("next-btn").addEventListener("click", nextQuestion);
document.getElementById("quit-btn").addEventListener("click", () => {
  quizScreen.classList.add("hidden");
  startScreen.classList.remove("hidden");
});
document.getElementById("back-home-btn").addEventListener("click", () => {
  resultScreen.classList.add("hidden");
  startScreen.classList.remove("hidden");
});
document.getElementById("retry-all-btn").addEventListener("click", () => startQuiz());
document.getElementById("retry-wrong-btn").addEventListener("click", () => startQuiz(wrongItems));

document.addEventListener("keydown", (e) => {
  if (quizScreen.classList.contains("hidden")) return;
  if (!answered && ["1", "2", "3", "4"].includes(e.key)) {
    selectAnswer(parseInt(e.key, 10) - 1);
  } else if (answered && e.key === "Enter") {
    nextQuestion();
  }
});

initUnitGrid();
