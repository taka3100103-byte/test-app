<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中1 国語 2学期末テスト対策 総合演習アプリ（読解・古典・文法・漢字）</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --primary: #0f766e;
    --primary-hover: #0d5f59;
    --primary-light: #f0fdfa;
    --blue: #2563eb;
    --blue-light: #eff6ff;
    --purple: #7c3aed;
    --purple-light: #f5f3ff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --correct: #16a34a;
    --correct-bg: #f0fdf4;
    --correct-border: #86efac;
    --wrong: #dc2626;
    --wrong-bg: #fef2f2;
    --wrong-border: #fca5a5;
    --accent: #d97706;
    --accent-bg: #fffbeb;
    --accent-border: #fde68a;
    --radius: 14px;
    --shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    padding: 18px 14px 60px;
  }
  .container {
    max-width: 820px;
    margin: 0 auto;
  }
  header {
    background: linear-gradient(135deg, #0f766e, #1e40af);
    color: #fff;
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  header h1 {
    font-size: 1.35rem;
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 0;
    font-size: 0.88rem;
    opacity: 0.92;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
  }
  .hidden { display: none !important; }

  /* Section Tabs on Home */
  .main-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  @media (max-width: 600px) {
    .main-tabs { grid-template-columns: repeat(2, 1fr); }
  }
  .tab-btn {
    padding: 12px 10px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--text);
    transition: all 0.15s ease;
    text-align: center;
  }
  .tab-btn:hover {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .tab-btn.active {
    border-color: var(--primary);
    background: var(--primary);
    color: #fff;
    box-shadow: 0 3px 10px rgba(15, 118, 110, 0.22);
  }
  .tab-sub {
    display: block;
    font-size: 0.74rem;
    font-weight: 500;
    opacity: 0.85;
    margin-top: 2px;
  }

  /* Unit Grid */
  .unit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
    margin: 14px 0 18px;
  }
  .unit-btn {
    text-align: left;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .unit-btn:hover {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .unit-btn.active {
    border-color: var(--primary);
    background: var(--primary-light);
    box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.18);
  }
  .unit-btn.all-unit {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, #f0fdfa, #eff6ff);
    border-color: #99f6e4;
  }
  .unit-btn .u-title {
    display: block;
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--text);
  }
  .unit-btn .u-count {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
    padding: 10px 12px;
    background: #f8fafc;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .filter-bar label {
    font-size: 0.84rem;
    font-weight: 700;
    color: var(--muted);
  }
  .filter-bar select {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: 0.88rem;
    background: #fff;
  }

  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .toggle-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 11px 20px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.08s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn-secondary { background: #e2e8f0; color: #334155; }
  .btn-secondary:hover:not(:disabled) { background: #cbd5e1; }
  .btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
  .btn-outline:hover:not(:disabled) { background: var(--primary-light); }
  .btn-correct { background: var(--correct); color: #fff; }
  .btn-correct:hover { background: #15803d; }
  .btn-wrong { background: var(--wrong); color: #fff; }
  .btn-wrong:hover { background: #b91c1c; }

  /* Quiz Screen */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .badge-group {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 700;
    background: var(--primary-light);
    color: var(--primary);
  }
  .badge-sec { background: var(--blue-light); color: var(--blue); }
  .badge-type { background: #f1f5f9; color: #475569; }
  .badge-tricky { background: #fee2e2; color: #b91c1c; }
  .progress-info {
    font-size: 0.88rem;
    color: var(--muted);
    font-weight: 700;
  }
  .progress-track {
    width: 100%;
    height: 8px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--blue));
    width: 0%;
    transition: width 0.25s ease;
  }

  .q-instruction {
    font-size: 0.94rem;
    font-weight: 700;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .q-text {
    font-size: 1.12rem;
    font-weight: 700;
    margin: 0 0 14px;
    color: #0f172a;
    line-height: 1.85;
    white-space: pre-line;
  }
  .q-box {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 1.18rem;
    line-height: 1.95;
    margin-bottom: 14px;
    letter-spacing: 0.02em;
  }
  .q-box u.ul {
    text-decoration: none;
    border-bottom: 3px solid var(--blue);
    padding-bottom: 2px;
    font-weight: 700;
    color: #1e3a8a;
  }
  .blank-box {
    display: inline-block;
    min-width: 72px;
    padding: 1px 10px;
    margin: 0 3px;
    border: 2px dashed var(--primary);
    border-radius: 6px;
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 800;
    text-align: center;
  }
  .kanji-blank {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    margin: 0 4px;
    padding: 2px 12px 3px;
    border-bottom: 3px solid var(--primary);
    background: var(--primary-light);
    border-radius: 6px 6px 0 0;
    min-width: 68px;
    text-align: center;
  }
  .kanji-blank .kb-space {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: 0.1em;
  }
  .kanji-blank .kb-hint {
    font-size: 0.78rem;
    font-weight: 700;
    color: #0f766e;
    line-height: 1.2;
  }
  .yomi-target {
    display: inline-block;
    background: #fef3c7;
    color: #92400e;
    padding: 0 8px;
    border-radius: 6px;
    border-bottom: 3px solid #f59e0b;
    margin: 0 3px;
  }
  .q-prefix-tag {
    display: inline-block;
    font-size: 0.82rem;
    font-weight: 700;
    color: #6b21a8;
    background: #f3e8ff;
    padding: 2px 10px;
    border-radius: 8px;
    margin-right: 8px;
    vertical-align: middle;
  }
  .q-meaning-note {
    display: block;
    margin-top: 6px;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--muted);
  }

  .input-area {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .answer-input {
    width: 100%;
    padding: 13px 15px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 1.05rem;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    transition: border-color 0.15s ease;
  }
  .answer-input:focus {
    outline: none;
    border-color: var(--primary);
  }
  .answer-input:disabled {
    background: #f8fafc;
    color: #475569;
  }
  textarea.answer-input {
    min-height: 84px;
    resize: vertical;
    line-height: 1.55;
  }
  .action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .hint-box {
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    color: #92400e;
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 0.88rem;
  }

  /* Feedback Box */
  .feedback-box {
    margin-top: 18px;
    padding: 16px 18px;
    border-radius: 12px;
    border-left: 5px solid var(--primary);
    background: #f8fafc;
    display: none;
  }
  .feedback-box.show { display: block; animation: fadeIn 0.18s ease; }
  .feedback-box.is-correct {
    border-left-color: var(--correct);
    background: var(--correct-bg);
  }
  .feedback-box.is-wrong {
    border-left-color: var(--wrong);
    background: var(--wrong-bg);
  }
  .feedback-box.is-self {
    border-left-color: var(--accent);
    background: var(--accent-bg);
  }
  .feedback-title {
    font-weight: 800;
    font-size: 1.05rem;
    margin: 0 0 8px;
  }
  .feedback-box.is-correct .feedback-title { color: var(--correct); }
  .feedback-box.is-wrong .feedback-title { color: var(--wrong); }
  .feedback-box.is-self .feedback-title { color: var(--accent); }
  .model-answer {
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(15, 23, 42, 0.1);
    border-radius: 8px;
    padding: 10px 13px;
    margin-bottom: 10px;
    font-size: 0.98rem;
  }
  .feedback-exp {
    margin: 0;
    font-size: 0.93rem;
    color: #1e293b;
  }
  .self-judge-row {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed rgba(15, 23, 42, 0.15);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .next-row {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .kbd-hint {
    font-size: 0.78rem;
    color: var(--muted);
  }

  /* Result Screen */
  .score-hero {
    text-align: center;
    padding: 16px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .score-num {
    font-size: 2.3rem;
    font-weight: 800;
    color: var(--primary);
    line-height: 1.2;
  }
  .score-sub {
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 4px;
  }
  .breakdown-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }
  .breakdown-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 14px;
    background: #f8fafc;
    border-radius: 8px;
    font-size: 0.88rem;
  }
  .breakdown-bar-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mini-bar {
    width: 84px;
    height: 7px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
  }
  .mini-fill {
    height: 100%;
    background: var(--correct);
  }
  .wrong-review-list {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .wrong-review-item {
    border: 1px solid var(--wrong-border);
    border-left: 5px solid var(--wrong);
    background: #fff;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.9rem;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 540px) {
    .card { padding: 18px 15px; }
    .q-text { font-size: 1.02rem; }
    .kbd-hint { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>中1 国語 2学期末テスト対策 総合演習（全291問）</h1>
    <p>読解・古典・文法・漢字を1つに統合｜自分で考えて答える記述・穴埋め一問一答</p>
  </header>

  <!-- Start Screen -->
  <section id="start-screen" class="card">
    <h2 style="margin:0 0 10px; font-size:1.08rem;">1. 分野を選ぶ</h2>
    <div class="main-tabs" id="main-tabs">
      <button class="tab-btn active" data-sec="all">
        総合（すべて）
        <span class="tab-sub" id="count-tab-all">全291問</span>
      </button>
      <button class="tab-btn" data-sec="reading">
        読解・古典・基礎
        <span class="tab-sub" id="count-tab-reading">60問</span>
      </button>
      <button class="tab-btn" data-sec="grammar">
        国語文法（文の成分）
        <span class="tab-sub" id="count-tab-grammar">30問</span>
      </button>
      <button class="tab-btn" data-sec="kanji">
        漢字（P.34〜45）
        <span class="tab-sub" id="count-tab-kanji">201問</span>
      </button>
    </div>

    <h2 style="margin:14px 0 6px; font-size:1.08rem;">2. 単元を選ぶ</h2>
    <div id="unit-grid" class="unit-grid"></div>

    <div id="kanji-filter-bar" class="filter-bar hidden">
      <label for="kanji-type-select">漢字の出題タイプ：</label>
      <select id="kanji-type-select">
        <option value="all">すべて（読み・書き穴埋め・知識）</option>
        <option value="kaki">漢字の書き・穴埋めのみ</option>
        <option value="yomi">漢字の読みのみ</option>
        <option value="special">書き分け・部首・ことわざ・音読み</option>
        <option value="tricky">要注意・間違いやすい問題のみ</option>
      </select>
    </div>

    <div class="controls-row">
      <label class="toggle-label">
        <input type="checkbox" id="shuffle-toggle">
        <span>出題順をシャッフルする</span>
      </label>
      <button id="start-btn" class="btn btn-primary">テストを開始する</button>
    </div>
  </section>

  <!-- Quiz Screen -->
  <section id="quiz-screen" class="card hidden">
    <div class="top-bar">
      <div class="badge-group">
        <span id="q-sec-badge" class="badge badge-sec"></span>
        <span id="q-unit-badge" class="badge"></span>
        <span id="q-type-badge" class="badge badge-type"></span>
        <span id="q-tricky-badge" class="badge badge-tricky hidden">要注意</span>
      </div>
      <span id="q-progress-text" class="progress-info"></span>
    </div>
    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <div id="q-instruction" class="q-instruction hidden"></div>
    <div id="q-body"></div>

    <div class="input-area">
      <div id="input-wrap"></div>
      <div class="action-row" id="check-actions">
        <button id="check-btn" class="btn btn-primary">答え合わせ</button>
        <button id="hint-btn" class="btn btn-outline hidden">💡 ヒント</button>
        <button id="giveup-btn" class="btn btn-outline">答えを見る</button>
      </div>
      <div id="hint-box" class="hint-box hidden"></div>
    </div>

    <div id="feedback-box" class="feedback-box">
      <div id="feedback-title" class="feedback-title"></div>
      <div id="model-answer" class="model-answer"></div>
      <div id="feedback-exp" class="feedback-exp"></div>

      <div id="self-judge-row" class="self-judge-row hidden">
        <span style="font-size:0.88rem; font-weight:700;">自己採点して次へ：</span>
        <button id="self-ok-btn" class="btn btn-correct" style="padding:8px 16px; font-size:0.88rem;">○ 合っていた</button>
        <button id="self-ng-btn" class="btn btn-wrong" style="padding:8px 16px; font-size:0.88rem;">× 間違えた・復習する</button>
      </div>

      <div id="next-row" class="next-row hidden">
        <span class="kbd-hint">Enterキーでも次へ進めます</span>
        <button id="next-btn" class="btn btn-primary">次の問題へ →</button>
      </div>
    </div>

    <div style="margin-top:16px; display:flex; justify-content:space-between; align-items:center;">
      <button id="quit-btn" class="btn btn-secondary" style="padding:7px 14px; font-size:0.82rem;">メニューに戻る</button>
      <span id="live-score" class="progress-info"></span>
    </div>
  </section>

  <!-- Result Screen -->
  <section id="result-screen" class="card hidden">
    <div class="score-hero">
      <div id="final-score" class="score-num"></div>
      <div id="final-sub" class="score-sub"></div>
    </div>
    <h3 style="margin:0 0 10px; font-size:1rem;">単元別の正答率</h3>
    <div id="breakdown-list" class="breakdown-list"></div>
    <div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center;">
      <button id="retry-wrong-btn" class="btn btn-primary hidden">間違えた問題だけ復習する</button>
      <button id="retry-all-btn" class="btn btn-outline">同じ範囲をもう一度</button>
      <button id="back-home-btn" class="btn btn-secondary">メニューに戻る</button>
    </div>
    <div id="wrong-review-section" class="hidden">
      <h3 style="margin:22px 0 8px; font-size:1rem;">間違えた問題の一覧</h3>
      <div id="wrong-review-list" class="wrong-review-list"></div>
    </div>
  </section>
</div>

<script>
const RAW_W1 = [
  // === 1. 「言葉」をもつ鳥、シジュウカラ（鈴木俊貴） ===
  {
    unit: "シジュウカラ",
    mode: "exact",
    typeLabel: "穴埋め",
    q: "シジュウカラは［　　］ほどの大きさ（体長約15cm）で、胸から腹にかけて［　　］のような黒い模様がある。最初の空欄に入る鳥の名をカタカナで答えなさい。",
    hint: "例：スズメ、カラス など",
    answers: ["スズメ", "すずめ"],
    displayAnswer: "スズメ（ちなみに2つ目の空欄は「ネクタイ」）",
    exp: "シジュウカラはスズメほどの大きさで、黒い頭に白い頬、胸から腹にかけてネクタイのような黒い模様があるのが特徴です。"
  },
  {
    unit: "シジュウカラ",
    mode: "exact",
    typeLabel: "穴埋め",
    q: "2008年6月のある日、［　　］（ヘビ）が巣箱に迫ったとき、親鳥が威嚇しながら「ジャージャー」と鳴いていたことが筆者の研究の転機となった。空欄に入るヘビの種類をカタカナで答えなさい。",
    hint: "教科書に出てくるヘビの名前です。",

P.34-35 方言と共通語・音訓", "type": "yomi", "tricky": true, "q": "城を【築】く。", "ans": "きず", "accepted": ["きず"], "exp": "「築く（きずく）」＝土や石を積み上げて造る。「ず」なので「きづ」と誤らないよう注意！"}, {"id": 33, "unit": 1, "unitName": "P.34-35 方言と共通語・音訓", "type": "yomi", "tricky": false, "q": "歴代の【天皇】。", "ans": "てんのう", "accepted": ["てんのう"], "exp": "「天皇（てんのう）」。「皇」は連声（れんじょう）で「のう」と読みます。"}, {"id": 34, "unit": 1, "unitName": "P.34-35 方言と共通語・音訓", "type": "kaki", "tricky": false, "q": "会社の【そしき】。", "ans": "組織", "accepted": ["組織"], "exp": "「組織（そしき）」＝共通の目的のために集まって作られたまとまり。"}, {"id": 35, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "special", "tricky": false, "q": "【同じ部首（辶）の漢字】意見を【の】べる。", "ans": "述", "accepted": ["述", "述べる"], "exp": "「意見や考えを言い表す」は「述べる（しんにょう：辶）」です。"}, {"id": 36, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "special", "tricky": false, "q": "【同じ部首（辶）の漢字】流れに【さか】らう。", "ans": "逆", "accepted": ["逆", "逆らう"], "exp": "「流れにさからう」は「逆らう（しんにょう：辶）」です。"}, {"id": 37, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "special", "tricky": false, "q": "【同じ部首（辶）の漢字】道に【まよ】う。", "ans": "迷", "accepted": ["迷", "迷う"], "exp": "「道にまよう」は「迷う（しんにょう：辶）」です。"}, {"id": 38, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "優勝旗の【へんかん】。", "ans": "返還", "accepted": ["返還"], "exp": "「返還（へんかん）」＝借りていたものなどを元の持ち主に返すこと。「還」はしんにょう（辶）です。"}, {"id": 39, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "野球の【にるいしゅ】。", "ans": "二塁手", "accepted": ["二塁手"], "exp": "「二塁手（にるいしゅ）」。「塁」は「田」の下に「乚」ではなく「土」と「厶」ではありません（上の「田」の下に「土」が並ばず、田＋ム＋ム＋土＝塁、または略字ではなく正字に注意）。"}, {"id": 40, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "【おおわざ】を決める。", "ans": "大技", "accepted": ["大技"], "exp": "「大技（おおわざ）」＝スポーツなどで大きく見事な技。"}, {"id": 41, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "【かっさい】を浴びる。（声を上げたり手をたたいたりしてほめること）", "ans": "喝采", "accepted": ["喝采"], "exp": "「喝采（かっさい）」＝「喝（大声を出す）」＋「采（ほめる・拍手する）」。「彩」と間違えやすいので注意！"}, {"id": 42, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "【ほうがん】投げ。", "ans": "砲丸", "accepted": ["砲丸"], "exp": "「砲丸（ほうがん）」＝陸上競技で投げる鉄の玉。「砲」は石へんに「包」です。"}, {"id": 43, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "yomi", "tricky": false, "q": "時間を【割】く。（一部分を他のことに使う）", "ans": "さ", "accepted": ["さ"], "exp": "「割く（さく）」＝時間や手間などの一部分を他のことのためにあてること。"}, {"id": 44, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "yomi", "tricky": false, "q": "【弓道】の的。", "ans": "きゅうどう", "accepted": ["きゅうどう"], "exp": "「弓道（きゅうどう）」。「弓」の音読みは「キュウ」です。"}, {"id": 45, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "公平な【しんぱん】。", "ans": "審判", "accepted": ["審判"], "exp": "「審判（しんぱん）」＝試合のルールに従って勝敗や反則を判定すること・人。「審」はうかんむり（宀）に「番」です。"}, {"id": 46, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "【さんれんぱ】する。", "ans": "三連覇", "accepted": ["三連覇"], "exp": "「三連覇（さんれんぱ）」＝3回連続で優勝すること。「覇」は「西（要の上）」の下に「革」と「月」です。"}, {"id": 47, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "記録の【こうしん】。", "ans": "更新", "accepted": ["更新"], "exp": "「更新（こうしん）」＝これまでの記録をぬりかえて新しくすること。「更」は「サラに・フける」とも読みます。"}, {"id": 48, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "【かいひん】公園。", "ans": "海浜", "accepted": ["海浜"], "exp": "「海浜（かいひん）」＝海辺、海岸。「浜」の音読みは「ヒン」、訓読みは「はま」です。"}, {"id": 49, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "yomi", "tricky": true, "q": "プロに【匹敵】する。（同じくらいのこと）", "ans": "ひってき", "accepted": ["ひってき"], "exp": "「匹敵（ひってき）」＝能力や価値などが相手と同じくらいであること。「匹」は「ヒツ」と読み、促音化して「ひってき」になります。"}, {"id": 50, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": true, "q": "自信の【そうしつ】。（失うこと）", "ans": "喪失", "accepted": ["喪失"], "exp": "「喪失（そうしつ）」＝大切なものを失うこと。「喪」の書き順・形（上に「十」、中に口が2つ、下に長い横棒と衣の下部）に注意！"}, {"id": 51, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "yomi", "tricky": false, "q": "【酢酸】の濃度。", "ans": "さくさん", "accepted": ["さくさん"], "exp": "「酢酸（さくさん）」。「酢」の音読みは「サク」、訓読みは「す」です。"}, {"id": 52, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "yomi", "tricky": false, "q": "【光沢】のある葉。（光を受けた面のつや）", "ans": "こうたく", "accepted": ["こうたく"], "exp": "「光沢（こうたく）」＝物の表面のつや・輝き。「沢」の音読みは「タク」です。"}, {"id": 53, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": true, "q": "【どんてん】の空模様。（くもり空）", "ans": "曇天", "accepted": ["曇天"], "exp": "「曇天（どんてん）」＝くもり空。「曇」は「日」の下に「雲」を書きます。「雲」と間違えないように注意！"}, {"id": 54, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "yomi", "tricky": false, "q": "【神宮】に参る。", "ans": "じんぐう", "accepted": ["じんぐう"], "exp": "「神宮（じんぐう）」＝皇室にゆかりの深い神社などのこと。"}, {"id": 55, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "yomi", "tricky": false, "q": "【更地】を買う。（空き地）", "ans": "さらち", "accepted": ["さらち"], "exp": "「更地（さらち）」＝建物などが建っていない空き地のこと。「更」は「さら（新しい）」と読みます。"}, {"id": 56, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "【はまべ】を歩く。", "ans": "浜辺", "accepted": ["浜辺"], "exp": "「浜辺（はまべ）」＝砂浜のあたり、海辺。「浜」はさんずい（氵）に「兵」です。"}, {"id": 57, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "yomi", "tricky": false, "q": "【三匹】の犬。", "ans": "さんびき", "accepted": ["さんびき"], "exp": "「三匹（さんびき）」。3のあとに「匹」がつくと濁って「びき」になります。"}, {"id": 58, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "yomi", "tricky": false, "q": "【喪中】のはがき。（家族の死後、交際をひかえる期間）", "ans": "もちゅう", "accepted": ["もちゅう"], "exp": "「喪中（もちゅう）」。「喪」を「モ」と読む特別な読み方に注意！"}, {"id": 59, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "【くろず】を飲む。", "ans": "黒酢", "accepted": ["黒酢"], "exp": "「黒酢（くろず）」＝米などを発酵させて作った黒い色の酢。「酢」はとりへん（酉）に「乍」です。"}, {"id": 60, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "【さわのぼ】りをする。", "ans": "沢登", "accepted": ["沢登"], "exp": "「沢登り（さわのぼり）」＝山の谷や川（沢）を登っていくこと。"}, {"id": 61, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "yomi", "tricky": false, "q": "【花曇】りの候。（桜が咲くころのくもり空）", "ans": "はなぐも", "accepted": ["はなぐも"], "exp": "「花曇り（はなぐもり）」＝桜の咲くころのうす曇りの空。連濁して「ぐも」になります。"}, {"id": 62, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "【さんせい】の意見。", "ans": "賛成", "accepted": ["賛成"], "exp": "「賛成（さんせい）」＝他の人の意見や計画に同意すること。"}, {"id": 63, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "【こきゅう】をする。", "ans": "呼吸", "accepted": ["呼吸"], "exp": "「呼吸（こきゅう）」＝息を吐く（呼）ことと、吸う（吸）こと。"}, {"id": 64, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "【はい】を検査する。", "ans": "肺", "accepted": ["肺"], "exp": "「肺（はい）」＝呼吸をつかさどる器官。月（にくづき）に「市」と書きます。"}, {"id": 65, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "yomi", "tricky": true, "q": "【留守番】電話。", "ans": "るすばん", "accepted": ["るすばん"], "exp": "「留守番（るすばん）」＝家の人がいない間、家を守ること。「留」を「ル」と読みます。"}, {"id": 66, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "【ぶし】の力。", "ans": "武士", "accepted": ["武士"], "exp": "「武士（ぶし）」。「武」の中に「止」と「弋」が入ります（点をつけないよう注意）。"}, {"id": 67, "unit": 2, "unitName": "P.36-37 漢字に親しもう2", "type": "kaki", "tricky": false, "q": "【きけん】な道。", "ans": "危険", "accepted": ["危険"], "exp": "「危険（きけん）」。「険」はこざとへん（阝）に「僉（人＋一＋口×2＋人）」です。"}, {"id": 68, "unit": 3, "unitName": "P.38-39 シジュウカラ①", "type": "special", "tricky": false, "q": "敵が【せま】る。（距離などが近くなる）", "ans": "迫", "accepted": ["迫"], "exp": "「距離や時間が近くなる」は「迫る（せまる）」を使います。"}, {"id": 69, "unit": 3, "unitName": "P.38-39 シジュウカラ①", "type": "special", "tricky": false, "q": "【きんぱく】した試合。（事情が差しせまること）", "ans": "緊迫", "accepted": ["緊迫"], "exp": "「緊迫（きんぱく）」＝事情が差しせまって緊張が高まること。"}, {"id": 70, "unit": 3, "unitName": "P.38-39 シジュウカラ①", "type": "yomi", "tricky": false, "q": "【心地】よい風。", "ans": "ここち", "accepted": ["ここち"], "exp": "「心地（ここち）」＝気持ち、気分。熟字訓的な読み方に注意！"}, {"id": 71, "unit": 3, "unitName": "P.38-39 シジュウカラ①", "type": "kaki", "tricky": false, "q": "大輪の花が【さ】く。", "ans": "咲", "accepted": ["咲"], "exp": "「咲く（さく）」＝くちへん（口）に「关（ソ＋大ではなく、天の上のツ＋大）」。"}, {"id": 72, "unit": 3, "unitName": "P.38-39 シジュウカラ①", "type": "yomi", "tricky": false, "q": "若い【頃】の写真。", "ans": "ころ", "accepted": ["ころ"], "exp": "「頃（ころ）」＝その時分、時期。音読みは「ケイ」です。"}, {"id": 73, "unit": 3, "unitName": "P.38-39 シジュウカラ①", "type": "kaki", "tricky": false, "q": "歌声が【ひび】く。", "ans": "響", "accepted": ["響"], "exp": "「響く（ひびく）」＝「郷」の下に「音」を書きます。"}, {"id": 74, "unit": 3, "unitName": "P.38-39 シジュウカラ①", "type": "yomi", "tricky": false, "q": "【頬】を赤らめる。", "ans": "ほお", "accepted": ["ほお"], "exp": "「頬（ほお）」＝顔の左右のふくらんだ部分。「ほほ」とも読みますがワークの解答は「ほお」です。"}, {"id": 75, "unit": 3, "unitName": "P.38-39 シジュウカラ①", "type": "kaki", "tricky": false, "q": "【むね】を張る。", "ans": "胸", "accepted": ["胸"], "exp": "「胸（むね）」。月（にくづき）に「匈」を書きます。"}, {"id": 76, "unit": 3, "unitName": "P.38-39 シジュウカラ①", "type": "kaki", "tricky": true, "q": "鳥の【はんしょくき】。（動物や植物が産まれ育ってふえる時期）", "ans": "繁殖期", "accepted": ["繁殖期"], "exp": "「繁殖期（はんしょくき）」。「殖」は「ふえる（歹＋直）」。植物の「植（木へん）」と混同しないよう注意！"}, {"id": 77, "unit": 3, "unitName": "P.38-39 シジュウカラ①", "type": "yomi", "tricky": false, "q": "猫に【餌】を与える。", "ans": "えさ", "accepted": ["えさ"], "exp": "「餌（えさ）」＝動物の食べ物。「餌付け」のときは「え」と読みます。"}, {"id": 78, "unit": 3, "unitName": "P.38-39 シジュウカラ①", "type": "yomi", "tricky": false, "q": "台風が【迫】る。", "ans": "せま", "accepted": ["せま"], "exp": "「迫る（せまる）」＝近づいてくること。"}, {"id": 79, "unit": 3, "unitName": "P.38-39 シジュウカラ①", "type": "kaki", "tricky": true, "q": "敵を【いかく】する。（相手がこわがるようにおどすこと）", "ans": "威嚇", "accepted": ["威嚇"], "exp": "「威嚇（いかく）」。「嚇」は口へん（口）に「赫（赤＋赤）」を書きます。画数が多いのでしっかり練習しましょう。"}, {"id": 80, "unit": 3, "unitName": "P.38-39 シジュウカラ①", "type": "kaki", "tricky": false, "q": "データの【ぶんせき】。", "ans": "分析", "accepted": ["分析"], "exp": "「分析（ぶんせき）」＝物事を細かく分けて調べること。「析」は木へんに「斤」です（手へんの「折」と間違えないように！）。"}, {"id": 81, "unit": 3, "unitName": "P.38-39 シジュウカラ①", "type": "yomi", "tricky": false, "q": "雪を【警戒】する。（用心すること）", "ans": "けいかい", "accepted": ["けいかい"], "exp": "「警戒（けいかい）」＝危険や悪いことが起きないように気をつけて用心すること。"}, {"id": 82, "unit": 3, "unitName": "P.38-39 シジュウカラ①", "type": "kaki", "tricky": false, "q": "有利な【じょうきょう】。", "ans": "状況", "accepted": ["状況"], "exp": "「状況（じょうきょう）」＝その時のありさま、様子。「況」はさんずい（氵）に「兄」です。"}, {"id": 83, "unit": 3, "unitName": "P.38-39 シジュウカラ①", "type": "yomi", "tricky": false, "q": "陽気に振る【舞】う。", "ans": "ま P.42-43 漢字に親しもう3", "type": "kaki", "tricky": true, "q": "土の中の【さいきん】。", "ans": "細菌", "accepted": ["細菌"], "exp": "「細菌（さいきん）」＝バクテリアなどの小さな微生物。「菌」はくさかんむり（艹）＋「囗」の中に「禾」です（米ではないので注意！）。"}, {"id": 146, "unit": 5, "unitName": "P.42-43 漢字に親しもう3", "type": "kaki", "tricky": false, "q": "【にじ】が七色に輝く。", "ans": "虹", "accepted": ["虹"], "exp": "「虹（にじ）」。虫へん（虫）に「工」を書きます。"}, {"id": 147, "unit": 5, "unitName": "P.42-43 漢字に親しもう3", "type": "yomi", "tricky": false, "q": "【納豆】を食べる。", "ans": "なっとう", "accepted": ["なっとう"], "exp": "「納豆（なっとう）」。「納」を「ナッ」と読みます。"}, {"id": 148, "unit": 5, "unitName": "P.42-43 漢字に親しもう3", "type": "kaki", "tricky": false, "q": "大豆の【はっこう】。", "ans": "発酵", "accepted": ["発酵"], "exp": "「発酵（はっこう）」＝菌などの働きで物質が変化すること。「酵」はとりへん（酉）に「孝」です。"}, {"id": 149, "unit": 5, "unitName": "P.42-43 漢字に親しもう3", "type": "kaki", "tricky": false, "q": "【がけ】を見上げる。", "ans": "崖", "accepted": ["崖"], "exp": "「崖（がけ）」。「山」の下に「厂（がんだれ）」＋「圭（土＋土）」を書きます。"}, {"id": 150, "unit": 5, "unitName": "P.42-43 漢字に親しもう3", "type": "kaki", "tricky": true, "q": "歌を【ひろう】する。（広く人に知らせたり、見せたりすること）", "ans": "披露", "accepted": ["披露"], "exp": "「披露（ひろう）」＝人前で公開して見せること。「披」はてへん（扌）に「皮」です（「被」と間違えないように！）。"}, {"id": 151, "unit": 5, "unitName": "P.42-43 漢字に親しもう3", "type": "kaki", "tricky": true, "q": "【まさつ】が生じる。（擦れ合うこと、もめごと）", "ans": "摩擦", "accepted": ["摩擦"], "exp": "「摩擦（まさつ）」。「摩」は「麻」の下に「手」です（「石」の「磨」と間違えないように！）。"}, {"id": 152, "unit": 5, "unitName": "P.42-43 漢字に親しもう3", "type": "kaki", "tricky": false, "q": "論説文の【ようし】。（文章の中心的な内容）", "ans": "要旨", "accepted": ["要旨"], "exp": "「要旨（ようし）」＝話や文章の大事な中心内容。「旨」は「ヒ」の下に「日」です。"}, {"id": 153, "unit": 5, "unitName": "P.42-43 漢字に親しもう3", "type": "yomi", "tricky": false, "q": "【黄砂】が飛ぶ。", "ans": "こうさ", "accepted": ["こうさ"], "exp": "「黄砂（こうさ）」＝春ごろに大陸から飛んでくる黄色い砂。"}, {"id": 154, "unit": 5, "unitName": "P.42-43 漢字に親しもう3", "type": "kaki", "tricky": false, "q": "案を【こうてい】する。", "ans": "肯定", "accepted": ["肯定"], "exp": "「肯定（こうてい）」＝その通りだと認めること（反対は「否定」）。「肯」は「止」の下に「月」です。"}, {"id": 155, "unit": 5, "unitName": "P.42-43 漢字に親しもう3", "type" function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function normalizeGeneral(str) {
  return String(str || "")
    .trim()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
    .replace(/[\s　。「」、，．・（）()「」『』【】\[\]]/g, "")
    .toLowerCase();
}

function normalizeKanji(str) {
  let s = String(str || "").trim().replace(/[\s　]/g, "");
  s = s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  return s;
}

function getFilteredQuestions() {
  let list = UNIFIED_QUESTIONS;
  if (currentSection !== "all") {
    list = list.filter(q => q.section === currentSection);
  }
  if (!selectedUnit.startsWith("すべて")) {
    list = list.filter(q => q.unit === selectedUnit);
  }
  if (currentSection === "kanji") {
    const kt = kanjiTypeSelect.value;
    if (kt === "kaki") list = list.filter(q => q.kanjiType === "kaki");
    else if (kt === "yomi") list = list.filter(q => q.kanjiType === "yomi");
    else if (kt === "special") list = list.filter(q => q.kanjiType === "special");
    else if (kt === "tricky") list = list.filter(q => q.tricky);
  }
  return list;
}

function renderUnitGrid() {
  unitGrid.innerHTML = "";
  const units = SECTION_UNITS[currentSection];
  if (!units.includes(selectedUnit)) {
    selectedUnit = units[0];
  }

  if (currentSection === "kanji") {
    kanjiFilterBar.classList.remove("hidden");
  } else {
    kanjiFilterBar.classList.add("hidden");
  }

  units.forEach((u, idx) => {
    let count = 0;
    if (idx === 0) {
      if (currentSection === "all") count = UNIFIED_QUESTIONS.length;
      else count = UNIFIED_QUESTIONS.filter(q => q.section === currentSection).length;
    } else {
      count = UNIFIED_QUESTIONS.filter(q => q.section === currentSection && q.unit === u).length;
    }
    const btn = document.createElement("button");
    btn.className = "unit-btn" + (idx === 0 ? " all-unit" : "") + (u === selectedUnit ? " active" : "");
    btn.innerHTML = `<span class="u-title">${escapeHtml(u)}</span><span class="u-count">${count}問</span>`;
    btn.addEventListener("click", () => {
      selectedUnit = u;
      document.querySelectorAll(".unit-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    });
    unitGrid.appendChild(btn);
  });
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentSection = btn.dataset.sec;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedUnit = SECTION_UNITS[currentSection][0];
    renderUnitGrid();
  });
});

function formatW1Question(text) {
  const escaped = escapeHtml(text);
  return escaped.replace(/［　　］/g, '<span class="blank-box">　　</span>');
}

function formatW3Question(q) {
  let raw = q.q;
  let prefixTag = "";
  let meaningNote = "";

  const prefixMatch = raw.match(/^(【(?:同じ部首|同じ音読み|ことわざ|書きこなそう)[^】]*】)/);
  if (prefixMatch) {
    prefixTag = `<span class="q-prefix-tag">${escapeHtml(prefixMatch[1].slice(1, -1))}</span>`;
    raw = raw.slice(prefixMatch[1].length);
  }

  const noteMatch = raw.match(/（([^）]+)）$/);
  if (noteMatch) {
    meaningNote = `<span class="q-meaning-note">意味ヒント：${escapeHtml(noteMatch[1])}</span>`;
    raw = raw.slice(0, raw.length - noteMatch[0].length);
  }

  if (q.kanjiType === "yomi") {
    const formatted = escapeHtml(raw).replace(/【([^】]+)】/g, '<span class="yomi-target">$1</span>');
    return prefixTag + formatted + meaningNote;
  } else {
    const formatted = escapeHtml(raw).replace(/【([^】]+)】/g, (_, hint) => {
      return `<span class="kanji-blank"><span class="kb-space">＿＿＿</span><span class="kb-hint">${hint}</span></span>`;
    });
    return prefixTag + formatted + meaningNote;
  }
}

function startQuiz(customList = null) {
  let base = customList ? [...customList] : getFilteredQuestions();
  if (base.length === 0) {
    alert("該当する問題がありません。条件を変更してください。");
    return;
  }
  if (shuffleToggle.checked && !customList) {
    base = shuffleArray(base);
  }
  activeList = base;
  currentIndex = 0;
  score = 0;
  wrongRecords = [];
  unitStats = {};

  startScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const item = activeList[currentIndex];

  document.getElementById("q-sec-badge").textContent = item.sectionLabel;
  document.getElementById("q-unit-badge").textContent = item.unit;
  document.getElementById("q-type-badge").textContent = item.typeLabel;
  const trickyBadge = document.getElementById("q-tricky-badge");
  if (item.tricky) trickyBadge.classList.remove("hidden");
  else trickyBadge.classList.add("hidden");

  document.getElementById("q-progress-text").textContent = `第 ${currentIndex + 1} 問 / 全 ${activeList.length} 問`;
  document.getElementById("progress-fill").style.width = `${(currentIndex / activeList.length) * 100}%`;
  document.getElementById("live-score").textContent = `現在の正解数：${score}問`;

  const instEl = document.getElementById("q-instruction");
  const bodyEl = document.getElementById("q-body");
  instEl.classList.add("hidden");
  bodyEl.innerHTML = "";

  if (item.renderStyle === "w1") {
    bodyEl.innerHTML = `<p class="q-text">${formatW1Question(item.q)}</p>`;
  } else if (item.renderStyle === "w2") {
    instEl.textContent = item.instruction;
    instEl.classList.remove("hidden");
    let html = `<div class="q-box">${item.sentence}</div>`;
    if (item.note) {
      html += `<p class="q-meaning-note" style="margin:-6px 0 12px;">${escapeHtml(item.note)}</p>`;
    }
    bodyEl.innerHTML = html;
  } else if (item.renderStyle === "w3") {
    instEl.textContent = item.kanjiType === "yomi"
      ? "ハイライトされた漢字の「読み」をひらがなで答えよう"
      : "空欄（＿＿＿）に入る「漢字」を答えよう（空欄のまま「答えを見る」で自己採点も可）";
    instEl.classList.remove("hidden");
    bodyEl.innerHTML = `<div class="q-box">${formatW3Question(item)}</div>`;
  }

  const inputWrap = document.getElementById("input-wrap");
  inputWrap.innerHTML = "";
  let inputEl;
  if (item.mode === "self") {
    inputEl = document.createElement("textarea");
    inputEl.placeholder = "自分の答えを入力してください（頭の中で考えて「答えを見る」こともできます）";
  } else {
    inputEl = document.createElement("input");
    inputEl.type = "text";
    inputEl.placeholder = item.renderStyle === "w3"
      ? (item.kanjiType === "yomi" ? "ひらがなで入力..." : "漢字を入力（空欄のまま「答えを見る」もOK）")
      : "答えを入力してください...";
  }
  inputEl.id = "user-answer-input";
  inputEl.className = "answer-input";
  inputEl.autocomplete = "off";
  inputWrap.appendChild(inputEl);

  const hintBtn = document.getElementById("hint-btn");
  const hintBox = document.getElementById("hint-box");
  hintBox.classList.add("hidden");
  if (item.hint) {
    hintBtn.classList.remove("hidden");
    hintBox.textContent = "💡 ヒント：" + item.hint;
  } else {
    hintBtn.classList.add("hidden");
  }

  document.getElementById("check-actions").classList.remove("hidden");
  const feedbackBox = document.getElementById("feedback-box");
  feedbackBox.className = "feedback-box";
  document.getElementById("self-judge-row").classList.add("hidden");
  document.getElementById("next-row").classList.add("hidden");

  const nextBtn = document.getElementById("next-btn");
  nextBtn.textContent = (currentIndex === activeList.length - 1) ? "結果を見る →" : "次の問題へ →";

  setTimeout(() => inputEl.focus(), 30);
}

function recordResult(item, isCorrect, userAns) {
  if (!unitStats[item.unit]) unitStats[item.unit] = { total: 0, correct: 0 };
  unitStats[item.unit].total += 1;
  if (isCorrect) {
    score += 1;
    unitStats[item.unit].correct += 1;
  } else {
    wrongRecords.push({ item, userAns: userAns || "（未入力・パス）" });
  }
  document.getElementById("progress-fill").style.width = `${((currentIndex + 1) / activeList.length) * 100}%`;
  document.getElementById("live-score").textContent = `現在の正解数：${score}問`;
}

function checkAnswer(giveUp = false) {
  if (answered) return;
  const item = activeList[currentIndex];
  const inputEl = document.getElementById("user-answer-input");
  const rawVal = inputEl ? inputEl.value : "";

  // 漢字モードまたは記述モードでは未入力でも「答えを見る（自己採点）」へ進める
  if (!giveUp && rawVal.trim() === "" && item.mode !== "kanji" && item.mode !== "self") {
    inputEl.focus();
    return;
  }

  answered = true;
  if (inputEl) inputEl.disabled = true;
  document.getElementById("check-actions").classList.add("hidden");
  document.getElementById("hint-box").classList.add("hidden");

  const feedbackBox = document.getElementById("feedback-box");
  const feedbackTitle = document.getElementById("feedback-title");
  const modelAnswer = document.getElementById("model-answer");
  const feedbackExp = document.getElementById("feedback-exp");
  const selfJudgeRow = document.getElementById("self-judge-row");
  const nextRow = document.getElementById("next-row");

  modelAnswer.innerHTML = `<strong>模範解答：</strong><span style="white-space:pre-line;">${escapeHtml(item.displayAnswer)}</span>`;
  feedbackExp.innerHTML = item.exp;

  if (item.mode === "self") {
    if (giveUp || rawVal.trim() === "") {
      recordResult(item, false, rawVal);
      feedbackBox.className = "feedback-box show is-wrong";
      feedbackTitle.textContent = "模範解答とポイントを確認しよう";
      selfJudgeRow.classList.add("hidden");
      nextRow.classList.remove("hidden");
    } else {
      feedbackBox.className = "feedback-box show is-self";
      feedbackTitle.textContent = "模範解答と見比べて自己採点しよう";
      selfJudgeRow.classList.remove("hidden");
      nextRow.classList.add("hidden");
    }
    return;
  }

  if (item.mode === "kanji" && !giveUp && rawVal.trim() === "") {
    // ノート演習用の自己採点モード
    feedbackBox.className = "feedback-box show is-self";
    feedbackTitle.textContent = "答えと解説を確認しよう（自己採点）";
    selfJudgeRow.classList.remove("hidden");
    nextRow.classList.add("hidden");
    return;
  }

  const normFn = item.mode === "kanji" ? normalizeKanji : normalizeGeneral;
  const normUser = normFn(rawVal);
  const isCorrect = !giveUp && item.answers.some(ans => normFn(ans) === normUser);

  if (item.mode === "open_blank" && !giveUp && !isCorrect) {
    feedbackBox.className = "feedback-box show is-self";
    feedbackTitle.textContent = `解答例とくらべて自己採点しよう（あなたの入力：${rawVal}）`;
    selfJudgeRow.classList.remove("hidden");
    nextRow.classList.add("hidden");
    return;
  }

  recordResult(item, isCorrect, giveUp ? "（パス）" : rawVal);
  feedbackBox.className = "feedback-box show " + (isCorrect ? "is-correct" : "is-wrong");
  feedbackTitle.textContent = isCorrect
    ? "⭕ 正解！"
    : (giveUp ? "📘 解答と解説" : `❌ 不正解…（あなたの入力：${rawVal}）`);
  selfJudgeRow.classList.add("hidden");
  nextRow.classList.remove("hidden");
}

function judgeSelf(isCorrect) {
  const item = activeList[currentIndex];
  const rawVal = document.getElementById("user-answer-input")?.value || "";
  recordResult(item, isCorrect, rawVal);
  nextQuestion();
}

function nextQuestion() {
  if (!answered) return;
  if (currentIndex < activeList.length - 1) {
    currentIndex += 1;
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  quizScreen.classList.add("hidden");
  resultScreen.classList.remove("hidden");
  const total = activeList.length;
  const pct = Math.round((score / total) * 100);
  document.getElementById("final-score").textContent = `${score} / ${total} 問正解（${pct}%）`;
  document.getElementById("final-sub").textContent =
    pct === 100 ? "全問正解！2学期末テスト対策も万全です。"
    : pct >= 80 ? "よくできました！間違えた問題を復習してテスト本番に備えよう。"
    : "間違えた問題の模範解答と解説を確認して、もう一度チャレンジしよう！";

  const list = document.getElementById("breakdown-list");
  list.innerHTML = "";
  Object.keys(unitStats).forEach(u => {
    const st = unitStats[u];
    const upct = Math.round((st.correct / st.total) * 100);
    const row = document.createElement("div");
    row.className = "breakdown-item";
    row.innerHTML = `
      <strong>${escapeHtml(u)}</strong>
      <div class="breakdown-bar-wrap">
        <span>${st.correct}/${st.total} (${upct}%)</span>
        <div class="mini-bar"><div class="mini-fill" style="width:${upct}%"></div></div>
      </div>
    `;
    list.appendChild(row);
  });

  const retryWrongBtn = document.getElementById("retry-wrong-btn");
  const wrongSec = document.getElementById("wrong-review-section");
  const wrongListEl = document.getElementById("wrong-review-list");
  if (wrongRecords.length > 0) {
    retryWrongBtn.classList.remove("hidden");
    retryWrongBtn.textContent = `間違えた問題だけ復習する（${wrongRecords.length}問）`;
    wrongSec.classList.remove("hidden");
    wrongListEl.innerHTML = wrongRecords.map(r => {
      const qPreview = r.item.q || r.item.sentence || "";
      return `
        <div class="wrong-review-item">
          <div style="font-size:0.8rem; color:var(--muted); font-weight:700;">[${escapeHtml(r.item.unit)}]</div>
          <div style="font-weight:700; margin:4px 0;">${qPreview}</div>
          <div style="font-size:0.86rem;">
            <span style="color:var(--wrong);">あなたの答え：${escapeHtml(r.userAns)}</span> ／
            <span style="color:var(--correct); font-weight:700;">正解：${escapeHtml(r.item.displayAnswer)}</span>
          </div>
        </div>
      `;
    }).join("");
  } else {
    retryWrongBtn.classList.add("hidden");
    wrongSec.classList.add("hidden");
  }
}

document.getElementById("start-btn").addEventListener("click", () => startQuiz());
document.getElementById("check-btn").addEventListener("click", () => checkAnswer(false));
document.getElementById("giveup-btn").addEventListener("click", () => checkAnswer(true));
document.getElementById("hint-btn").addEventListener("click", () => {
  document.getElementById("hint-box").classList.remove("hidden");
});
document.getElementById("self-ok-btn").addEventListener("click", () => judgeSelf(true));
document.getElementById("self-ng-btn").addEventListener("click", () => judgeSelf(false));
document.getElementById("next-btn").addEventListener("click", nextQuestion);

document.getElementById("quit-btn").addEventListener("click", () => {
  quizScreen.classList.add("hidden");
  startScreen.classList.remove("hidden");
});
document.getElementById("back-home-btn").addEventListener("click", () => {
  resultScreen.classList.add("hidden");
  startScreen.classList.remove("hidden");
});
document.getElementById("retry-all-btn").addEventListener("click", () => startQuiz());
document.getElementById("retry-wrong-btn").addEventListener("click", () => {
  startQuiz(wrongRecords.map(r => r.item));
});

document.addEventListener("keydown", (e) => {
  if (quizScreen.classList.contains("hidden")) return;
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === "Enter") {
    const activeEl = document.activeElement;
    if (!answered) {
      if (activeEl && activeEl.tagName === "TEXTAREA" && !e.shiftKey) return;
      e.preventDefault();
      checkAnswer(false);
    } else if (!document.getElementById("next-row").classList.contains("hidden")) {
      e.preventDefault();
      nextQuestion();
    }
  }
});

renderUnitGrid();
</script>
</body>
</html>
