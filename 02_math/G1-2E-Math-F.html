<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中1数学 2学期末テスト対策：比例と反比例 フラッシュカード</title>
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --primary: #2563eb;
    --primary-light: #eff6ff;
    --primary-dark: #1d4ed8;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --warn: #d97706;
    --warn-bg: #fffbeb;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 18px 16px 48px;
  }
  header {
    background: linear-gradient(135deg, #1e40af, #3b82f6);
    color: #fff;
    border-radius: 16px;
    padding: 18px 22px;
    margin-bottom: 14px;
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.18);
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.3rem;
    font-weight: 700;
  }
  header p {
    margin: 0;
    font-size: 0.88rem;
    opacity: 0.92;
  }
  .mode-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 12px;
  }
  .mode-btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .mode-btn:hover { border-color: var(--primary); color: var(--primary); }
  .mode-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 14px;
  }
  .toolbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.88rem;
    font-weight: 700;
  }
  .toolbar-right {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tool-btn {
    background: #f8fafc;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 11px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .tool-btn:hover { background: #eff6ff; border-color: var(--primary); color: var(--primary); }
  .tool-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .progress-bar-bg {
    width: 100%;
    height: 7px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #2563eb, #38bdf8);
    width: 0%;
    transition: width 0.25s ease;
  }

  /* Flashcard 3D Flip */
  .card-stage {
    perspective: 1100px;
    margin-bottom: 16px;
  }
  .flashcard {
    position: relative;
    width: 100%;
    min-height: 310px;
    transform-style: preserve-3d;
    transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    cursor: pointer;
  }
  .flashcard.flipped {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 24px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .card-back {
    transform: rotateY(180deg);
    background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    border-color: #bfdbfe;
  }
  .face-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.76rem;
    font-weight: 700;
  }
  .badge-cat { background: var(--primary-light); color: var(--primary-dark); }
  .badge-side { background: #f1f5f9; color: var(--muted); }
  .badge-side.back { background: #dbeafe; color: var(--primary-dark); }

  .front-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 16px 8px;
  }
  .q-prompt {
    font-size: 1.22rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.65;
  }
  .tap-hint {
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .back-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    padding: 12px 4px;
  }
  .ans-box {
    text-align: center;
    padding: 12px 14px;
    background: var(--primary-light);
    border: 1.5px solid #93c5fd;
    border-radius: 12px;
  }
  .ans-label {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 2px;
  }
  .ans-text {
    font-size: 1.35rem;
    font-weight: 800;
    color: #1e3a8a;
  }
  .point-box {
    background: var(--warn-bg);
    border: 1px solid #fde68a;
    border-left: 4px solid #f59e0b;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.92rem;
    color: #1e293b;
  }
  .point-title {
    font-weight: 700;
    font-size: 0.82rem;
    color: #b45309;
    margin-bottom: 3px;
  }

  .action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .btn-again, .btn-know {
    border: none;
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
  }
  .btn-again:active, .btn-know:active { transform: scale(0.98); }
  .btn-again {
    background: #fef3c7;
    color: #b45309;
    border: 1.5px solid #fcd34d;
  }
  .btn-know {
    background: var(--success);
    color: #fff;
  }
  .nav-sub {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .nav-link {
    background: none;
    border: none;
    color: var(--primary);
    font-weight: 600;
    cursor: pointer;
    font-size: 0.86rem;
    padding: 4px 8px;
  }
  .nav-link:disabled { color: #cbd5e1; cursor: default; }

  .summary-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
  }
  .score-big {
    font-size: 2.1rem;
    font-weight: 800;
    color: var(--primary);
    margin: 8px 0;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-secondary {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
  }

  /* List View */
  .list-view {
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .list-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .list-q { font-weight: 700; margin-bottom: 6px; font-size: 0.98rem; }
  .list-a { font-weight: 800; color: var(--primary-dark); margin-bottom: 6px; font-size: 1rem; }
  .list-p { font-size: 0.88rem; color: #475569; background: #fffbeb; padding: 7px 10px; border-radius: 8px; border-left: 3px solid #f59e0b; }

  .frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    margin: 0 2px;
    font-size: 0.88em;
    line-height: 1.05;
  }
  .frac .num { border-bottom: 1.5px solid currentColor; padding: 0 3px 1px; }
  .frac .den { padding: 1px 3px 0; }
  .kbd {
    display: inline-block;
    padding: 1px 6px;
    font-size: 0.74rem;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    color: #475569;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>中1数学 2学期末テスト対策：重要語句フラッシュカード</h1>
    <p>全28枚・出題範囲完全網羅（表面：用語を問う短い問題 ／ 裏面：答えとテストで狙われやすい一言ポイント）</p>
  </header>

  <div class="mode-bar" id="modeBar">
    <button class="mode-btn active" data-cat="all">すべて（28枚）</button>
    <button class="mode-btn" data-cat="1. 関数と変域">1. 関数と変域</button>
    <button class="mode-btn" data-cat="2. 比例の式と性質">2. 比例の式・性質</button>
    <button class="mode-btn" data-cat="3. 座標と比例のグラフ">3. 座標・比例グラフ</button>
    <button class="mode-btn" data-cat="4. 反比例の式と性質">4. 反比例の式・性質</button>
    <button class="mode-btn" data-cat="5. 反比例のグラフと応用">5. 反比例グラフ・応用</button>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <span id="counterLabel">1 / 28 枚目</span>
      <span id="statusLabel" style="color:var(--success);">おぼえた：0</span>
    </div>
    <div class="toolbar-right">
      <button class="tool-btn" id="shuffleBtn" onclick="shuffleCards()">🔀 シャッフル</button>
      <button class="tool-btn" id="listToggleBtn" onclick="toggleListView()">📋 一覧表示</button>
      <button class="tool-btn" onclick="resetDeck()">🔄 リセット</button>
    </div>
  </div>

  <div class="progress-bar-bg" id="progressWrap">
    <div class="progress-bar-fill" id="progressFill"></div>
  </div>

  <div id="studyArea"></div>
  <div class="list-view" id="listView"></div>
</div>

<script>
const frac = (n, d) => `<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`;

const CARDS = [
  // 1. 関数と変域 (6枚)
  {
    id: 1,
    cat: "1. 関数と変域",
    q: "ともなって変わる2つの変数 <i>x</i>, <i>y</i> があり、<i>x</i> の値を決めると <i>y</i> の値が<b>ただ1つ決まる</b>とき、<i>y</i> は <i>x</i> の何といいますか？",
    a: "関数（<i>y</i> は <i>x</i> の関数である）",
    point: "「ただ1つ決まる」が記述問題の必須キーワード！最低気温と最高気温、身長と体重のように値が1つに定まらないものは関数とはいえません。"
  },
  {
    id: 2,
    cat: "1. 関数と変域",
    q: "いろいろな値をとることができる文字（<i>x</i> や <i>y</i> など）を何といいますか？",
    a: "変数",
    point: "対になる言葉は「定数（決まった数）」。文章題では何が変数で何が定数（比例定数）かを整理すると立式しやすくなります。"
  },
  {
    id: 3,
    cat: "1. 関数と変域",
    q: "変数のとりうる値の範囲のことを何といいますか？",
    a: "変域",
    point: "線香が燃えつきる時間や、水そうの水の量などの文章題では「0 ≦ <i>x</i> ≦ 〜」のように0以上や上限がつく点に注意！"
  },
  {
    id: 4,
    cat: "1. 関数と変域",
    q: "不等号 <b>＜</b>、<b>＞</b>（より大きい・より小さい・未満）を数直線に表すとき、端の点はどう描きますか？",
    a: "白丸（○）",
    point: "「その数を含まない」のが白丸○。「未満」や「より大きい／小さい」は白丸○と不等号 ＜（または ＞）を使います。"
  },
  {
    id: 5,
    cat: "1. 関数と変域",
    q: "不等号 <b>≦</b>、<b>≧</b>（以上・以下）を数直線に表すとき、端の点はどう描きますか？",
    a: "黒丸（●）",
    point: "「その数を含む」のが黒丸●。変域を書くときは必ず「小さい数 ＜ <i>x</i> ≦ 大きい数」の順（左が小、右が大）に並べます。"
  },
  {
    id: 6,
    cat: "1. 関数と変域",
    q: "「1000 mL の牛乳から <i>x</i> mL 飲んだ残りは <i>y</i> mL」は比例・反比例・その他の関数のどれですか？",
    a: "関数ではあるが、比例でも反比例でもない",
    point: "式にすると <i>y</i> = 1000 − <i>x</i>。<i>x</i> を決めれば <i>y</i> がただ1つ決まるので関数ですが、<i>y</i> = <i>ax</i> や <i>y</i> = a/x の形にならないので比例・反比例ではありません（ひっかけ頻出！）。"
  },

  // 2. 比例の式と性質 (5枚)
  {
    id: 7,
    cat: "2. 比例の式と性質",
    q: "<i>y</i> が <i>x</i> に比例するとき、<i>y</i> を <i>x</i> の式で表す基本の形は何ですか？",
    a: "<i>y</i> = <i>ax</i>（<i>a</i> は定数で <i>a</i> ≠ 0）",
    point: "<i>y</i> = <i>ax</i> + 5 のように後ろに定数がつく式や、<i>y</i> = <i>ax</i>² は比例ではありません。"
  },
  {
    id: 8,
    cat: "2. 比例の式と性質",
    q: "比例の式 <i>y</i> = <i>ax</i> における決まった数 <i>a</i> のことを何といいますか？",
    a: "比例定数",
    point: "文章題では「1 L あたり」「1 枚あたり」「1 分あたり」などの単位量（変化の割合）を表します。負の数や分数になることもあります。"
  },
  {
    id: 9,
    cat: "2. 比例の式と性質",
    q: "<i>y</i> が <i>x</i> に比例するとき、<i>x</i> の値が 2倍、3倍…になると、対応する <i>y</i> の値はどうなりますか？",
    a: "2倍、3倍…になる",
    point: "比例定数 <i>a</i> が負の数（例：<i>y</i> = −6<i>x</i>）でも、<i>x</i> が負の数でも、<i>x</i> が2倍になれば <i>y</i> も2倍になります！「−2倍になる」とひっかからないように注意。"
  },
  {
    id: 10,
    cat: "2. 比例の式と性質",
    q: "<i>y</i> が <i>x</i> に比例するとき、<i>x</i> ≠ 0 において商 <b>${frac('<i>y</i>', '<i>x</i>')}</b> の値はどうなりますか？",
    a: "つねに一定（比例定数 <i>a</i> に等しい）",
    point: "表や座標から比例定数 <i>a</i> を素早く求めるときは <i>a</i> = <i>y</i> ÷ <i>x</i> が便利！ただし <i>x</i> = 0 のときは使えません。"
  },
  {
    id: 11,
    cat: "2. 比例の式と性質",
    q: "比例 <i>y</i> = <i>ax</i> で、<i>x</i> の値が <b>1 増える</b>ごとに、<i>y</i> の値はどれだけ変化しますか？",
    a: "<i>a</i> だけ増える（<i>a</i> ＜ 0 なら |<i>a</i>| 減る）",
    point: "表で <i>x</i> が 3 増えたとき <i>y</i> が −9 増えたら、<i>a</i> = −9 ÷ 3 = −3 と求められます。"
  },

  // 3. 座標と比例のグラフ (6枚)
  {
    id: 12,
    cat: "3. 座標と比例のグラフ",
    q: "座標平面で、横の数直線を（　①　）、縦の数直線を（　②　）といい、合わせて（　③　）といいます。",
    a: "① <i>x</i> 軸（横軸）　② <i>y</i> 軸（縦軸）　③ 座標軸",
    point: "座標軸が交わる点 (0, 0) を<b>原点</b>といい、アルファベットの <b>O</b> で表します。"
  },
  {
    id: 13,
    cat: "3. 座標と比例のグラフ",
    q: "座標平面上の点 P の位置を表す (3, −2) について、3 を（　①　）、−2 を（　②　）といいます。",
    a: "① <i>x</i> 座標　② <i>y</i> 座標",
    point: "必ず「(横 <i>x</i>, 縦 <i>y</i>)」の順番！<i>x</i> 軸上の点は <i>y</i> 座標が 0、<i>y</i> 軸上の点は <i>x</i> 座標が 0 になります。"
  },
  {
    id: 14,
    cat: "3. 座標と比例のグラフ",
    q: "点 (<i>p</i>, <i>q</i>) について、① <i>x</i> 軸対称、② <i>y</i> 軸対称、③ 原点対称 な点の座標はそれぞれどうなりますか？",
    a: "① (<i>p</i>, −<i>q</i>)　② (−<i>p</i>, <i>q</i>)　③ (−<i>p</i>, −<i>q</i>)",
    point: "テスト最頻出！「<i>x</i> 軸対称なら <i>y</i> の符号が逆」「<i>y</i> 軸対称なら <i>x</i> の符号が逆」「原点対称なら両方逆」と覚えよう。"
  },
  {
    id: 15,
    cat: "3. 座標と比例のグラフ",
    q: "比例 <i>y</i> = <i>ax</i> のグラフは、どのような図形になりますか？",
    a: "原点を通る直線",
    point: "直線は2点が決まれば引けるので、比例のグラフをかくときは「原点 (0, 0)」と「整数になるもう1点（例：<i>y</i> = −${frac(2,3)}<i>x</i> なら (3, −2)）」をとって結びます。"
  },
  {
    id: 16,
    cat: "3. 座標と比例のグラフ",
    q: "比例 <i>y</i> = <i>ax</i> のグラフで、<i>a</i> ＞ 0 のときと <i>a</i> ＜ 0 のとき、グラフの向きはそれぞれどうなりますか？",
    a: "<i>a</i> ＞ 0：右上がり ／ <i>a</i> ＜ 0：右下がり",
    point: "<i>a</i> ＞ 0 のときは <i>x</i> が増えると <i>y</i> も増加し、<i>a</i> ＜ 0 のときは <i>x</i> が増えると <i>y</i> は減少します。"
  },
  {
    id: 17,
    cat: "3. 座標と比例のグラフ",
    q: "座標平面上で、斜めの辺ばかりの三角形の面積を求めるときの基本テクニックは何ですか？",
    a: "軸に平行な長方形（または台形）で囲み、まわりの直角三角形を引く",
    point: "座標の1目もりが何cmかの指定（例：1目もり1cm）を見落とさないこと！横の長さは「右の<i>x</i> − 左の<i>x</i>」、縦の長さは「上の<i>y</i> − 下の<i>y</i>」で求めます。"
  },

  // 4. 反比例の式と性質 (5枚)
  {
    id: 18,
    cat: "4. 反比例の式と性質",
    q: "<i>y</i> が <i>x</i> に反比例するとき、<i>y</i> を <i>x</i> の式で表す基本の形は何ですか？",
    a: `<i>y</i> = ${frac('<i>a</i>', '<i>x</i>')}（<i>a</i> は定数で <i>a</i> ≠ 0）`,

    point: "正の約数（1, 2, 3, 4, 6, 12 の6個）だけでなく、<b>負の整数</b>（−1, −2, −3, −4, −6, −12 の6個）を忘れないのが鉄則！"

let activeCat = "all";
let deck = [...CARDS];
let idx = 0;
let isFlipped = false;
let isListView = false;
let knownIds = new Set();
let againIds = new Set();

function filterCat(cat) {
  activeCat = cat;
  deck = cat === "all" ? [...CARDS] : CARDS.filter(c => c.cat === cat);
  idx = 0;
  isFlipped = false;
  knownIds.clear();
  againIds.clear();
  render();
}

function shuffleCards() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0;
  isFlipped = false;
  render();
}

function resetDeck() {
  filterCat(activeCat);
}

function toggleListView() {
  isListView = !isListView;
  const btn = document.getElementById("listToggleBtn");
  btn.classList.toggle("active", isListView);
  btn.textContent = isListView ? "🃏 カードに戻る" : "📋 一覧表示";
  render();
}

function flipCard() {
  isFlipped = !isFlipped;
  const el = document.getElementById("flashcardEl");
  if (el) el.classList.toggle("flipped", isFlipped);
}

function markCard(known) {
  const card = deck[idx];
  if (known) {
    knownIds.add(card.id);
    againIds.delete(card.id);
  } else {
    againIds.add(card.id);
    knownIds.delete(card.id);
  }
  idx++;
  isFlipped = false;
  render();
}

function moveCard(delta) {
  const next = idx + delta;
  if (next < 0 || next >= deck.length) return;
  idx = next;
  isFlipped = false;
  render();
}

function retryAgain() {
  const retryList = CARDS.filter(c => againIds.has(c.id));
  if (retryList.length === 0) return;
  deck = retryList;
  idx = 0;
  isFlipped = false;
  againIds.clear();
  render();
}

function render() {
  const studyArea = document.getElementById("studyArea");
  const listView = document.getElementById("listView");
  const progressWrap = document.getElementById("progressWrap");

  document.getElementById("statusLabel").textContent = `おぼえた：${knownIds.size} ／ もう一回：${againIds.size}`;

  if (isListView) {
    studyArea.style.display = "none";
    progressWrap.style.display = "none";
    listView.style.display = "flex";
    document.getElementById("counterLabel").textContent = `全 ${deck.length} 枚（一覧）`;
    listView.innerHTML = deck.map((c, i) => `
      <div class="list-item">
        <div style="margin-bottom:4px;"><span class="badge badge-cat">${c.cat}</span> <span style="font-size:0.8rem;color:var(--muted);">No.${i + 1}</span></div>
        <div class="list-q">Q. ${c.q}</div>
        <div class="list-a">A. ${c.a}</div>
        <div class="list-p"><b>💡 狙われやすいポイント：</b>${c.point}</div>
      </div>
    `).join("");
    return;
  }

  studyArea.style.display = "block";
  listView.style.display = "none";
  progressWrap.style.display = "block";

  if (idx >= deck.length) {
    document.getElementById("counterLabel").textContent = `完了（${deck.length} 枚）`;
    document.getElementById("progressFill").style.width = "100%";
    const againCount = againIds.size;
    studyArea.innerHTML = `
      <div class="summary-card">
        <div style="font-size:1.1rem;font-weight:700;">1周お疲れさまでした！</div>
        <div class="score-big">おぼえた：${knownIds.size} / ${deck.length} 枚</div>
        <p style="color:var(--muted);margin-bottom:18px;">
          ${againCount === 0 ? "すべて「おぼえた」になりました！テスト本番もこの調子でバッチリです。" : `「もう一回」が ${againCount} 枚あります。スキマ時間にもう一度確認しましょう！`}
        </p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
          ${againCount > 0 ? `<button class="btn-primary" onclick="retryAgain()">「もう一回」の ${againCount} 枚だけ復習する</button>` : ""}
          <button class="btn-secondary" onclick="resetDeck()">最初からやり直す</button>
        </div>
      </div>
    `;
    return;
  }

  const c = deck[idx];
  document.getElementById("counterLabel").textContent = `${idx + 1} / ${deck.length} 枚目`;
  document.getElementById("progressFill").style.width = `${(idx / deck.length) * 100}%`;

  studyArea.innerHTML = `
    <div class="card-stage">
      <div class="flashcard ${isFlipped ? "flipped" : ""}" id="flashcardEl" onclick="flipCard()">
        <div class="card-face card-front">
          <div class="face-top">
            <span class="badge badge-cat">${c.cat}</span>
            <span class="badge badge-side">表面：問題</span>
          </div>
          <div class="front-body">
            <div class="q-prompt">${c.q}</div>
          </div>
          <div class="tap-hint">タップ（または <span class="kbd">Space</span>）で答えとポイントを見る</div>
        </div>
        <div class="card-face card-back">
          <div class="face-top">
            <span class="badge badge-cat">${c.cat}</span>
            <span class="badge badge-side back">裏面：答え＆ポイント</span>
          </div>
          <div class="back-body">
            <div class="ans-box">
              <div class="ans-label">答え</div>
              <div class="ans-text">${c.a}</div>
            </div>
            <div class="point-box">
              <div class="point-title">💡 テストで狙われやすい一言ポイント</div>
              <div>${c.point}</div>
            </div>
          </div>
          <div class="tap-hint">もう一度タップで表面に戻る</div>
        </div>
      </div>
    </div>

    <div class="action-row">
      <button class="btn-again" onclick="markCard(false)">🔁 もう一回（<span class="kbd">1</span>）</button>
      <button class="btn-know" onclick="markCard(true)">⭕ おぼえた！（<span class="kbd">2</span>）</button>
    </div>

    <div class="nav-sub">
      <button class="nav-link" onclick="moveCard(-1)" ${idx === 0 ? "disabled" : ""}>← 前のカード</button>
      <span>キーボード：<span class="kbd">Space</span> めくる ／ <span class="kbd">1</span><span class="kbd">2</span> 判定</span>
      <button class="nav-link" onclick="moveCard(1)" ${idx >= deck.length - 1 ? "disabled" : ""}>次のカード →</button>
    </div>
  `;
}

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    filterCat(btn.dataset.cat);
  });
});

document.addEventListener("keydown", e => {
  if (isListView || idx >= deck.length) return;
  if (e.code === "Space") {
    e.preventDefault();
    flipCard();
  } else if (e.key === "1") {
    markCard(false);
  } else if (e.key === "2") {
    markCard(true);
  } else if (e.key === "ArrowLeft") {
    moveCard(-1);
  } else if (e.key === "ArrowRight") {
    moveCard(1);
  }
});

render();
</script>
