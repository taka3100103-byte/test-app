<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中1数学 2学期末テスト対策：比例と反比例 記述・穴埋めテスト</title>
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --primary: #0f766e;
    --primary-light: #f0fdfa;
    --primary-dark: #115e59;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --accent: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
  }
  .container {
    max-width: 840px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }
  header {
    background: linear-gradient(135deg, #115e59, #0d9488);
    color: #fff;
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 18px;
    box-shadow: 0 6px 18px rgba(15, 118, 110, 0.18);
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 1.35rem;
    font-weight: 700;
  }
  header p {
    margin: 0;
    font-size: 0.9rem;
    opacity: 0.94;
  }
  .mode-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .mode-btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .mode-btn:hover { border-color: var(--primary); color: var(--primary); }
  .mode-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .progress-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .progress-bar-bg {
    width: 100%;
    height: 8px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #0f766e, #2dd4bf);
    width: 0%;
    transition: width 0.3s ease;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
  }
  .badge-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 700;
  }
  .badge-cat { background: var(--primary-light); color: var(--primary-dark); }
  .badge-lvl { background: #fef3c7; color: #b45309; }
  .badge-type { background: #ede9fe; color: #5b21b6; }
  .q-text {
    font-size: 1.06rem;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .q-visual {
    margin: 14px 0 18px;
    display: flex;
    justify-content: center;
    overflow-x: auto;
  }
  table.math-table {
    border-collapse: collapse;
    margin: 6px auto;
    font-size: 0.95rem;
    background: #fff;
  }
  table.math-table th, table.math-table td {
    border: 1px solid #94a3b8;
    padding: 7px 14px;
    text-align: center;
    min-width: 50px;
  }
  table.math-table th {
    background: #f1f5f9;
    font-weight: 700;
  }
  .answer-area {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-top: 12px;
  }
  .answer-prompt {
    font-size: 0.98rem;
    line-height: 2.2;
  }
  .blank-input {
    display: inline-block;
    min-width: 72px;
    padding: 4px 10px;
    margin: 2px 4px;
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
    color: var(--text);
    background: #fff;
    border: 2px solid #94a3b8;
    border-radius: 8px;
    outline: none;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .blank-input.sm { width: 64px; min-width: 64px; }
  .blank-input.md { width: 110px; }
  .blank-input.lg { width: 170px; }
  .blank-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
  }
  .blank-input.correct {
    border-color: var(--success);
    background: var(--success-bg);
    color: #166534;
  }
  .blank-input.wrong {
    border-color: var(--danger);
    background: var(--danger-bg);
    color: #991b1b;
  }
  .ans-tag {
    display: inline-block;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--success);
    background: var(--success-bg);
    border: 1px solid #86efac;
    border-radius: 6px;
    padding: 1px 7px;
    margin-left: 4px;
    vertical-align: middle;
  }
  .helper-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed #cbd5e1;
  }
  .helper-label {
    font-size: 0.78rem;
    color: var(--muted);
    font-weight: 600;
    margin-right: 4px;
  }
  .sym-btn {
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    transition: all 0.12s;
  }
  .sym-btn:hover {
    border-color: var(--primary);
    background: var(--primary-light);
    color: var(--primary-dark);
  }
  .hint-note {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 8px;
  }
  .action-row {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .feedback {
    margin-top: 18px;
    border-radius: 12px;
    padding: 16px 18px;
    display: none;
    animation: fadeIn 0.2s ease;
  }
  .feedback.show { display: block; }
  .feedback.is-correct {
    background: var(--success-bg);
    border: 1px solid #86efac;
  }
  .feedback.is-wrong {
    background: var(--danger-bg);
    border: 1px solid #fca5a5;
  }
  .feedback-title {
    font-weight: 700;
    font-size: 1.05rem;
    margin-bottom: 6px;
  }
  .feedback.is-correct .feedback-title { color: var(--success); }
  .feedback.is-wrong .feedback-title { color: var(--danger); }
  .model-ans {
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 8px 12px;
    margin: 8px 0 10px;
    font-size: 0.95rem;
  }
  .explanation {
    font-size: 0.95rem;
    color: #1e293b;
  }
  .nav-row {
    margin-top: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 22px;
    font-size: 0.96rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .btn-secondary {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-secondary:hover { background: #f8fafc; }
  .frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    margin: 0 2px;
    font-size: 0.9em;
    line-height: 1.1;
  }
  .frac .num {
    border-bottom: 1.5px solid currentColor;
    padding: 0 3px 1px;
  }
  .frac .den {
    padding: 1px 3px 0;
  }
  .summary-card { text-align: center; }
  .score-big {
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--primary);
    margin: 8px 0;
  }
  .cat-breakdown {
    text-align: left;
    margin: 18px 0;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .cat-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 0.95rem;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>中1数学 2学期末テスト対策：比例と反比例</h1>
    <p>1問1答式 記述・穴埋めテスト（全25問・出題範囲完全網羅）</p>
  </header>

  <div class="mode-bar" id="modeBar">
    <button class="mode-btn active" data-cat="all">すべて（全25問）</button>
    <button class="mode-btn" data-cat="関数と変域">1. 関数と変域</button>
    <button class="mode-btn" data-cat="比例・反比例の基本">2. 基本と文章題</button>
    <button class="mode-btn" data-cat="比例の性質と座標">3. 比例の性質・座標</button>
    <button class="mode-btn" data-cat="比例のグラフ">4. 比例のグラフ</button>
    <button class="mode-btn" data-cat="反比例の性質・グラフ">5. 反比例と応用</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-top">
      <span id="progressLabel">第 1 問 / 25 問</span>
      <span id="scoreLabel">現在の正解数：0 問</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="card" id="quizCard"></div>
</div>

<script>
const frac = (n, d) => `<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`;

// 入力欄生成ヘルパー
const inp = (idx, size = "md", ph = "") =>
  `<input type="text" class="blank-input ${size}" id="blank-${idx}" data-bidx="${idx}" placeholder="${ph}" autocomplete="off" autocapitalize="off" spellcheck="false">`;

const QUESTIONS = [
  // ===== 1. 関数と変域 (5問) =====
  {
    id: 1,
    cat: "関数と変域",
    lvl: "基本",
    type: "穴埋め",
    q: "変数 <i>x</i> の変域が「<b>−4より大きく1以下</b>」であるとき、下の空欄に適切な数や不等号（＜、≦ など）を入れて <i>x</i> の変域を表しなさい。",
    visual: `<svg width="280" height="62" viewBox="0 0 280 62" aria-label="数直線">
      <line x1="15" y1="38" x2="265" y2="38" stroke="#334155" stroke-width="2"/>
      <polygon points="265,38 257,34 257,42" fill="#334155"/>
      <line x1="65" y1="33" x2="65" y2="43" stroke="#334155" stroke-width="1.5"/>
      <line x1="175" y1="33" x2="175" y2="43" stroke="#334155" stroke-width="1.5"/>
      <line x1="200" y1="33" x2="200" y2="43" stroke="#334155" stroke-width="1.5"/>
      <text x="65" y="57" font-size="12" text-anchor="middle" fill="#334155">-4</text>
      <text x="175" y="57" font-size="12" text-anchor="middle" fill="#334155">0</text>
      <text x="200" y="57" font-size="12" text-anchor="middle" fill="#334155">1</text>
      <polyline points="65,38 65,18 200,18 200,38" fill="none" stroke="#0f766e" stroke-width="2.5"/>
      <circle cx="65" cy="18" r="5" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
      <circle cx="200" cy="18" r="5" fill="#0f766e"/>
    </svg>`,
    prompt: `${inp(0, "sm")} ${inp(1, "sm", "不等号")} <i>x</i> ${inp(2, "sm", "不等号")} 1`,
    blanks: [
      { ans: ["-4"], label: "-4" },
      { ans: ["<"], label: "＜" },
      { ans: ["<=", "≦"], label: "≦" }
    ],
    syms: ["-", "<", "≦"],
    hint: "不等号は下のボタンからも入力できます。",
    model: "<b>−4 ＜ <i>x</i> ≦ 1</b>",
    exp: "「より大きい」「未満」はその数を含まないため <b>＜</b>（白丸 ○）を使い、「以上」「以下」はその数を含むため <b>≦</b>（黒丸 ●）を使います。"
  },
  {
    id: 2,
    cat: "関数と変域",
    lvl: "基本",
    type: "穴埋め・記述",
    q: "次の文の空欄にあてはまる語句と式を答えなさい。<br>「2つの変数 <i>x</i> と <i>y</i> があり、<i>x</i> の値を決めると <i>y</i> の値が [ ① ] 決まるとき、<i>y</i> は <i>x</i> の関数であるという。たとえば、1000 mL の牛乳から <i>x</i> mL 飲んだあとの残り <i>y</i> mL は、<i>y</i> = [ ② ] と表せるので関数である。」",
    visual: "",
    prompt: `① ${inp(0, "lg", "漢字・数字")}　　② <i>y</i> = ${inp(1, "md", "式")}`,
    blanks: [
      { ans: ["ただ1つ", "ただひとつ", "1つ", "ひとつ"], label: "ただ1つ" },
      { ans: ["1000-x", "-x+1000"], label: "1000 - x" }
    ],
    syms: ["x", "-", "+"],
    hint: "①は「ただ◯つ」の形、②は「y = 」の右辺だけを入力してください。",
    model: "① <b>ただ1つ</b>（1つ）　② <b>1000 − <i>x</i></b>",
    exp: "関数の定義「<i>x</i> の値を決めると <i>y</i> の値が<b>ただ1つ</b>決まる」は穴埋め問題の定番です。残りの量は全体の 1000 mL から飲んだ量 <i>x</i> mL を引いて <b><i>y</i> = 1000 − <i>x</i></b> となります。"
  },
  {
    id: 3,
    cat: "関数と変域",
    lvl: "標準",
    type: "記述・穴埋め",
    q: "一定の割合で燃える長さ 90 mm の線香がある。火をつけてから 3 分後に長さは 72 mm になった。火をつけてから <i>x</i> 分後の線香の長さを <i>y</i> mm とするとき、次の空欄を埋めなさい。",
    visual: "",
    prompt: `線香は 1 分間に ${inp(0, "sm")} mm ずつ燃えるので、長さが <b>30 mm</b> になるのは火をつけてから ${inp(1, "sm")} 分後である。<br>また、すべて燃えきるまでの <i>y</i> の変域は ${inp(2, "sm")} ≦ <i>y</i> ≦ ${inp(3, "sm")} である。`,
    blanks: [
      { ans: ["6"], label: "6" },
      { ans: ["10"], label: "10" },
      { ans: ["0"], label: "0" },
      { ans: ["90"], label: "90" }
    ],
    syms: [],
    hint: "半角数字で入力してください。",
    model: "1分間に <b>6</b> mm ／ <b>10</b> 分後 ／ <b>0</b> ≦ <i>y</i> ≦ <b>90</b>",
    exp: "3 分間で 90 − 72 = 18 mm 燃えたので、1 分間に 18 ÷ 3 = <b>6 mm</b> 燃えます。長さ 30 mm になるまでに燃える長さは 90 − 30 = 60 mm なので、60 ÷ 6 = <b>10 分後</b>です。線香の長さ <i>y</i> は 0 mm から 90 mm までなので <b>0 ≦ <i>y</i> ≦ 90</b> となります。"
  },
  {
    id: 4,
    cat: "関数と変域",
    lvl: "標準",
    type: "記述",
    q: "同じ種類のくぎが何本かある。このうち <b>25 本</b>の重さをはかったら <b>40 g</b> だった。くぎ全体の重さが <b>960 g</b> だったとき、くぎはおよそ何本ありますか。",
    visual: "",
    prompt: `およそ ${inp(0, "md", "整数")} 本`,
    blanks: [
      { ans: ["600"], label: "600" }
    ],
    syms: [],
    hint: "くぎ1本あたりの重さ、または全体の重さが何倍かを考えましょう。",
    model: "<b>600</b> 本",
    exp: "1 本あたりの重さは 40 ÷ 25 = 1.6 g です。よって全体の本数は 960 ÷ 1.6 = <b>600 本</b>となります。（別解：960 ÷ 40 = 24 倍より、25 × 24 = 600 本）"
  },
  {
    id: 5,
    cat: "関数と変域",
    lvl: "発展",
    type: "穴埋め",
    q: "下の表はある運送会社の荷物の重量と料金（25 kg まで）を表したものである。空欄を埋めて正しい説明を完成させなさい。",
    visual: `<table class="math-table">
      <tr><th>重量</th><td>2kg以内</td><td>5kg以内</td><td>10kg以内</td><td>15kg以内</td><td>20kg以内</td><td>25kg以内</td></tr>
      <tr><th>料金</th><td>850円</td><td>1000円</td><td>1300円</td><td>1600円</td><td>1800円</td><td>2000円</td></tr>
    </table>`,
    prompt: `料金は重量の関数と ${inp(0, "md", "いえる/いえない")} が、重量は料金の関数とは ${inp(1, "md", "いえる/いえない")}。<br>なぜなら、料金を 1000 円と決めても、重量が ${inp(2, "lg", "例：ただ1つ")} に決まらないからである。`,
    blanks: [
      { ans: ["いえる", "言える"], label: "いえる" },
      { ans: ["いえない", "言えない"], label: "いえない" },
      { ans: ["ただ1つ", "ただひとつ", "1つ", "ひとつ"], label: "ただ1つ" }
    ],
    syms: [],
    hint: "「いえる」「いえない」「ただ1つ」のようにひらがなで入力できます。",
    model: "<b>いえる</b> ／ <b>いえない</b> ／ <b>ただ1つ</b>",
    exp: "重量を決めれば料金は必ず1つに決まるので、料金は重量の関数と<b>いえる</b>。一方、料金（例：1000 円）を決めても、重量は 3 kg や 4 kg など複数考えられるため<b>ただ1つ</b>に決まらず、重量は料金の関数とは<b>いえない</b>。"
  },

  // ===== 2. 比例・反比例の基本と文章題 (5問) =====
  {
    id: 6,
    cat: "比例・反比例の基本",
    lvl: "基本",
    type: "記述・穴埋め",
    q: "1 L の燃料で 3 時間動く機械がある。この機械が <i>x</i> L の燃料で動く時間を <i>y</i> 時間とするとき、<i>y</i> を <i>x</i> の式で表し、比例定数が何を表しているか答えなさい。",
    visual: "",
    prompt: `式：<i>y</i> = ${inp(0, "md", "式")}<br>比例定数 ${inp(1, "sm")} は、「${inp(2, "sm")} L の燃料で動く時間」を表している。`,
    blanks: [
      { ans: ["3x"], label: "3x" },
      { ans: ["3"], label: "3" },
      { ans: ["1"], label: "1" }
    ],
    syms: ["x"],
    hint: "「y = 」の右辺だけを入力してください。",
    model: "<i>y</i> = <b>3<i>x</i></b> ／ 比例定数 <b>3</b> は <b>1</b> L の燃料で動く時間",
    exp: "燃料が <i>x</i> L なら動く時間は 3 × <i>x</i> 時間なので、<b><i>y</i> = 3<i>x</i></b> です。比例定数の 3 は「1 L の燃料で動く時間（3時間）」を表します。"
  },
  {
    id: 7,
    cat: "比例・反比例の基本",
    lvl: "基本",
    type: "記述・穴埋め",
    q: "20 km の道のりを時速 <i>x</i> km で進むときにかかる時間を <i>y</i> 時間とする。<i>y</i> を <i>x</i> の式で表し、空欄を埋めなさい。",
    visual: "",

let activeCat = "all";
let filtered = [...QUESTIONS];
let idx = 0;
let score = 0;
let answered = false;
let results = [];
let lastFocusedInput = null;

// 文字の正規化（全角→半角、空白除去、マイナス記号統一）
function normalize(str) {
  if (!str) return "";
  let s = str.trim();
  // 全角英数字・記号を半角に
  s = s.replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
  // 各種マイナス・ハイフン統一
  s = s.replace(/[−ー―‐–—]/g, "-");
  // 不等号の全角対応
  s = s.replace(/＜/g, "<").replace(/＞/g, ">").replace(/≦/g, "<=").replace(/≧/g, ">=");
  // 空白除去
  s = s.replace(/\s+/g, "");
  // y= や m= が誤って入力された場合の簡易除去（元の正解が y= を含まない場合）
  return s.toLowerCase();
}

function checkBlank(userRaw, acceptedList) {
  const u = normalize(userRaw);
  if (!u) return false;
  // y= や z= が付いていた場合も許容するバージョンもチェック
  const uNoEq = u.replace(/^[yzm]=/, "");
  return acceptedList.some(acc => {
    const a = normalize(acc);
    return u === a || uNoEq === a;
  });
}

function filterQuestions(cat) {
  activeCat = cat;
  filtered = cat === "all" ? [...QUESTIONS] : QUESTIONS.filter(q => q.cat === cat);
  idx = 0;
  score = 0;
  results = [];
  renderQuestion();
}

function renderQuestion() {
  const card = document.getElementById("quizCard");
  const progressWrap = document.getElementById("progressWrap");

  if (idx >= filtered.length) {
    renderSummary();
    return;
  }

  progressWrap.style.display = "block";
  const q = filtered[idx];
  answered = false;
  lastFocusedInput = null;

  document.getElementById("progressLabel").textContent = `第 ${idx + 1} 問 / ${filtered.length} 問`;
  document.getElementById("scoreLabel").textContent = `現在の正解数：${score} 問`;
  document.getElementById("progressFill").style.width = `${(idx / filtered.length) * 100}%`;

  const symButtonsHtml = (q.syms && q.syms.length > 0)
    ? `<div class="helper-bar">
        <span class="helper-label">入力補助：</span>
        ${q.syms.map(s => `<button type="button" class="sym-btn" onclick="insertSym('${s}')">${s}</button>`).join("")}
      </div>`
    : "";

  card.innerHTML = `
    <div class="badge-row">
      <span class="badge badge-cat">${q.cat}</span>
      <span class="badge badge-lvl">レベル：${q.lvl}</span>
      <span class="badge badge-type">${q.type}</span>
    </div>
    <div class="q-text">Q${idx + 1}. ${q.q}</div>
    ${q.visual ? `<div class="q-visual">${q.visual}</div>` : ""}
    <div class="answer-area">
      <div class="answer-prompt">${q.prompt}</div>
      ${symButtonsHtml}
      ${q.hint ? `<div class="hint-note">💡 ${q.hint}</div>` : ""}
    </div>
    <div class="action-row">
      <button class="btn-primary" id="checkBtn" onclick="checkAnswer()">答え合わせをする</button>
      <button class="btn-secondary" id="giveUpBtn" onclick="giveUp()">答えと解説を見る</button>
    </div>
    <div class="feedback" id="feedbackBox">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div class="model-ans" id="modelAnsBox"></div>
      <div class="explanation" id="feedbackExp"></div>
    </div>
    <div class="nav-row">
      <button class="btn-secondary" onclick="restartQuiz()">最初からやり直す</button>
      <button class="btn-primary" id="nextBtn" style="display:none;" onclick="nextQuestion()">
        ${idx + 1 < filtered.length ? "次の問題へ →" : "結果を見る →"}
      </button>
    </div>
  `;

  // 入力欄のイベント設定
  const inputs = card.querySelectorAll(".blank-input");
  if (inputs.length > 0) {
    lastFocusedInput = inputs[0];
    inputs[0].focus();
    inputs.forEach(el => {
      el.addEventListener("focus", () => { lastFocusedInput = el; });
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !answered) {
          e.preventDefault();
          checkAnswer();
        }
      });
    });
  }
}

function insertSym(sym) {
  if (answered) return;
  const target = lastFocusedInput || document.querySelector(".blank-input");
  if (!target || target.disabled) return;
  const start = target.selectionStart || target.value.length;
  const end = target.selectionEnd || target.value.length;
  const val = target.value;
  target.value = val.slice(0, start) + sym + val.slice(end);
  target.focus();
  target.setSelectionRange(start + sym.length, start + sym.length);
}

function checkAnswer(isGiveUp = false) {
  if (answered) return;
  const q = filtered[idx];
  const inputs = Array.from(document.querySelectorAll(".blank-input"));

  // 未入力チェック（ギブアップ時はスキップ）
  if (!isGiveUp && inputs.some(el => el.value.trim() === "")) {
    const emptyEl = inputs.find(el => el.value.trim() === "");
    emptyEl.focus();
    emptyEl.style.borderColor = "#f59e0b";
    return;
  }

  answered = true;
  let allCorrect = !isGiveUp;

  // Q25の②（順不同2つ）の特別処理：同じ答えを2回書いたら片方不正解にする
  const specialUniquePair = (q.id === 25);
  let usedPairVal = null;

  inputs.forEach((el, i) => {
    const b = q.blanks[i];
    let ok = false;
    if (!isGiveUp) {
      ok = checkBlank(el.value, b.ans);
      if (specialUniquePair && i >= 1 && ok) {
        const valNorm = normalize(el.value).replace(/^-/, "-");
        const absSame = (v) => (v === "1.5" ? "3/2" : v === "-1.5" ? "-3/2" : v);
        const cur = absSame(valNorm);
        if (i === 1) usedPairVal = cur;
        else if (i === 2 && cur === usedPairVal) ok = false;
      }
    }
    el.disabled = true;
    el.classList.add(ok ? "correct" : "wrong");
    if (!ok) {
      allCorrect = false;
      const tag = document.createElement("span");
      tag.className = "ans-tag";
      tag.textContent = `正: ${b.label}`;
      el.insertAdjacentElement("afterend", tag);
    }
  });

  if (allCorrect) score++;
  results.push({ id: q.id, cat: q.cat, correct: allCorrect, qObj: q });

  document.getElementById("checkBtn").disabled = true;
  document.getElementById("giveUpBtn").style.display = "none";

  const fb = document.getElementById("feedbackBox");
  const fbTitle = document.getElementById("feedbackTitle");
  const modelBox = document.getElementById("modelAnsBox");
  const fbExp = document.getElementById("feedbackExp");

  fb.classList.add("show", allCorrect ? "is-correct" : "is-wrong");
  fbTitle.textContent = allCorrect ? "⭕ 正解！" : (isGiveUp ? "💡 解答と解説" : "❌ 惜しい！もう一度確認しよう");
  modelBox.innerHTML = `<b>【模範解答】</b> ${q.model}`;
  fbExp.innerHTML = `<b>【解説】</b><br>${q.exp}`;

  document.getElementById("scoreLabel").textContent = `現在の正解数：${score} 問`;
  document.getElementById("progressFill").style.width = `${((idx + 1) / filtered.length) * 100}%`;
  document.getElementById("nextBtn").style.display = "inline-block";
}

function giveUp() {
  checkAnswer(true);
}

function nextQuestion() {
  idx++;
  renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function restartQuiz() {
  filterQuestions(activeCat);
}

function retryWrong() {
  const wrongList = results.filter(r => !r.correct).map(r => r.qObj);
  if (wrongList.length === 0) return;
  filtered = wrongList;
  idx = 0;
  score = 0;
  results = [];
  renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderSummary() {
  document.getElementById("progressWrap").style.display = "none";
  const pct = Math.round((score / filtered.length) * 100);
  const wrongCount = filtered.length - score;

  const catStats = {};
  results.forEach(r => {
    if (!catStats[r.cat]) catStats[r.cat] = { ok: 0, total: 0 };
    catStats[r.cat].total++;
    if (r.correct) catStats[r.cat].ok++;
  });

  const breakdownHtml = Object.entries(catStats).map(([cat, st]) => `
    <div class="cat-row">
      <span>${cat}</span>
      <strong>${st.ok} / ${st.total} 問正解（${Math.round((st.ok / st.total) * 100)}%）</strong>
    </div>
  `).join("");

  let msg = "よく頑張りました！間違えた問題を復習して本番に備えましょう。";
  if (pct === 100) msg = "全問正解です！自力で書ける力がついているので本番もバッチリですね！";
  else if (pct >= 80) msg = "高得点です！あと少しの復習で満点が狙えます。";

  document.getElementById("quizCard").innerHTML = `
    <div class="summary-card">
      <div style="font-size:1.1rem;font-weight:700;">テスト結果</div>
      <div class="score-big">${score} / ${filtered.length} 問（${pct}%）</div>
      <p style="color:var(--muted);margin-top:4px;">${msg}</p>
      <div class="cat-breakdown">
        <div style="font-weight:700;margin-bottom:8px;">分野別の正答率</div>
        ${breakdownHtml}
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        ${wrongCount > 0 ? `<button class="btn-primary" onclick="retryWrong()">間違えた ${wrongCount} 問だけ復習する</button>` : ""}
        <button class="btn-secondary" onclick="restartQuiz()">このセットをもう一度解く</button>
      </div>
    </div>
  `;
}

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    filterQuestions(btn.dataset.cat);
  });
});

renderQuestion();
</script>
