<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中1・2学期末テスト対策 英語 記述・穴埋めマスター (40問)</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #f0fdfa;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --correct: #16a34a;
      --correct-bg: #f0fdf4;
      --correct-border: #86efac;
      --wrong: #dc2626;
      --wrong-bg: #fef2f2;
      --wrong-border: #fca5a5;
      --accent: #f59e0b;
      --accent-bg: #fffbeb;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.07);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
      padding: 20px 14px 48px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .header-badge {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid #99f6e4;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
      letter-spacing: 0.03em;
    }

    .header h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 0.88rem;
      color: var(--muted);
    }

    /* Filter Pills */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* Status & Progress */
    .status-card {
      background: var(--card);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      border: 1px solid var(--border);
    }

    .status-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .score-pill {
      background: var(--primary-light);
      color: var(--primary);
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #14b8a6, #0f766e);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 999px;
    }

    /* Question Card */
    .quiz-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px 22px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .q-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .q-category {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 700;
      color: #0f766e;
      background: #ccfbf1;
      padding: 3px 10px;
      border-radius: 6px;
    }

    .q-type-badge {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 700;
      color: #475569;
      background: #f1f5f9;
      padding: 3px 9px;
      border-radius: 6px;
    }

    .q-num {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
    }

    .q-prompt-jp {
      font-size: 0.96rem;
      color: #334155;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .q-sentence {
      font-size: 1.22rem;
      font-weight: 700;
      color: #0f172a;
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 18px;
      letter-spacing: 0.01em;
    }

    /* Input Area */
    .answer-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .answer-input {
      flex: 1;
      font-size: 1.12rem;
      font-weight: 700;
      padding: 13px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      color: #0f172a;
      background: #fff;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .answer-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .answer-input.is-correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: #14532d;
    }

    .answer-input.is-wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: #7f1d1d;
    }

    .btn-submit {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 22px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .assist-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .assist-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-ghost {
      background: #f8fafc;
      border: 1px solid var(--border);
      color: #475569;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-ghost:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    .btn-ghost:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .hint-box {
      display: none;
      background: var(--accent-bg);
      border: 1px solid #fde68a;
      color: #92400e;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .hint-box.show {
      display: block;
      animation: fadeIn 0.18s ease;
    }

    /* Explanation Box */
    .explanation-box {
      margin-top: 20px;
      border-radius: 12px;
      padding: 16px 18px;
      display: none;
      animation: fadeIn 0.22s ease;
    }

    .explanation-box.show {
      display: block;
    }

    .explanation-box.is-correct {
      background: var(--correct-bg);
      border: 1.5px solid var(--correct-border);
    }

    .explanation-box.is-wrong {
      background: var(--wrong-bg);
      border: 1.5px solid var(--wrong-border);
    }

    .exp-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.08rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .is-correct .exp-header {
      color: var(--correct);
    }

    .is-wrong .exp-header {
      color: var(--wrong);
    }

    .exp-cap-note {
      font-size: 0.86rem;
      font-weight: 700;
      color: #b45309;
      background: #fef3c7;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: none;
    }

    .exp-cap-note.show {
      display: block;
    }

    .exp-answer {
      font-size: 0.95rem;
      font-weight: 700;
      color: #0f172a;
      background: rgba(255, 255, 255, 0.8);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .exp-body {
      font-size: 0.93rem;
      color: #1e293b;
      margin-bottom: 10px;
    }

    .exp-tip {
      font-size: 0.86rem;
      background: var(--accent-bg);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      border-radius: 6px;
      color: #78350f;
      font-weight: 600;
    }

    .next-wrap {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #fff;
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Result Screen */
    .result-card {
      display: none;
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px 22px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      text-align: center;
    }

    .result-card.show {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    .result-score-big {
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--primary);
      margin: 8px 0 4px;
    }

    .result-rank {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 18px;
    }

    .breakdown {
      text-align: left;
      background: #f8fafc;
      border-radius: 12px;
      padding: 16px;
      margin: 18px 0 22px;
      border: 1px solid var(--border);
    }

    .breakdown h3 {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .bd-row {
      margin-bottom: 10px;
    }

    .bd-row:last-child {
      margin-bottom: 0;
    }

    .bd-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .bd-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .bd-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 22px;
    }

    .review-list {
      text-align: left;
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .review-list h3 {
      font-size: 0.95rem;
      margin-bottom: 10px;
    }

    .review-item {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      font-size: 0.88rem;
    }

    .review-item.r-ok {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    .review-item.r-ng {
      background: #fef2f2;
      border-color: #fecaca;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .quiz-card { padding: 18px 15px; }
      .q-sentence { font-size: 1.08rem; padding: 12px; }
      .input-row { flex-direction: column; }
      .btn-submit { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-badge">中学1年生・2学期末テスト対策（記述・穴埋め版）</div>
      <h1>英語 穴埋め＆記述マスターテスト</h1>
      <p>自分で答えを入力して1問1答で答え合わせ！テスト本番の穴埋め・書きかえ・英作文を完全対策</p>
    </header>

    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-cat="ALL">すべて (40問)</button>
      <button class="filter-btn" data-cat="Which・Whose・所有代名詞">① Which・Whose</button>
      <button class="filter-btn" data-cat="代名詞（目的格・4格変化）">② 代名詞</button>
      <button class="filter-btn" data-cat="Why・Because">③ Why・Because</button>
      <button class="filter-btn" data-cat="重要語句・連語・表現">④ 語句・表現</button>
      <button class="filter-btn" data-cat="There is / are">⑤ There is/are</button>
      <button class="filter-btn" data-cat="How・by + 乗り物">⑥ How・乗り物</button>
    </div>

    <div class="status-card" id="statusCard">
      <div class="status-top">
        <span id="progressText">第 1 問 / 全 40 問</span>
        <span class="score-pill" id="scorePill">正解: 0 問</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <main class="quiz-card" id="quizCard">
      <div class="q-meta">
        <div class="q-badges">
          <span class="q-category" id="qCategory"></span>
          <span class="q-type-badge" id="qType"></span>
        </div>
        <span class="q-num" id="qNum"></span>
      </div>
      <div class="q-prompt-jp" id="qPrompt"></div>
      <div class="q-sentence" id="qSentence"></div>

      <form class="answer-form" id="answerForm" autocomplete="off">
        <div class="input-row">
          <input
            type="text"
            class="answer-input"
            id="answerInput"
            placeholder="ここに英語を入力（Enterで答え合わせ）"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          >
          <button type="submit" class="btn-submit" id="submitBtn">答え合わせ</button>
        </div>

        <div class="assist-row">
          <div class="assist-btns">
            <button type="button" class="btn-ghost" id="hintBtn">💡 ヒントを見る</button>
            <button type="button" class="btn-ghost" id="giveUpBtn">わからない（答えを見る）</button>
          </div>
        </div>

        <div class="hint-box" id="hintBox"></div>
      </form>

      <div class="explanation-box" id="explanationBox">
        <div class="exp-header" id="expHeader"></div>
        <div class="exp-cap-note" id="expCapNote"></div>
        <div class="exp-answer" id="expAnswer"></div>
        <div class="exp-body" id="expBody"></div>
        <div class="exp-tip" id="expTip"></div>
        <div class="next-wrap">
          <button type="button" class="btn-primary" id="nextBtn">次の問題へ →</button>
        </div>
      </div>
    </main>

    <section class="result-card" id="resultCard">
      <div class="header-badge">テスト結果</div>
      <div class="result-score-big" id="resultScore"></div>
      <div class="result-rank" id="resultRank"></div>
      <div class="breakdown" id="breakdown"></div>
      <div class="result-actions">
        <button class="btn-primary" id="retryWrongBtn" style="display:none;">間違えた問題だけ復習する</button>
        <button class="btn-secondary" id="restartBtn">最初からやり直す</button>
      </div>
      <div class="review-list" id="reviewList"></div>
    </section>
  </div>

  <script>
    const QUESTIONS = [
      // ① Which・Whose・所有代名詞 (7問)
      {
        cat: "Which・Whose・所有代名詞",
        type: "穴埋め (1語)",
        jp: "「どちらの机があなたのものですか。」となるように(　　)に入る1語を書きましょう。",
        en: "(　　) desk is yours?",
        answers: ["Which"],
        displayAns: "Which",
        hint: "W____（1語・文頭は大文字）",
        full: "Which desk is yours?",
        exp: "「どちらの〜」と2つ以上の中から選ぶときは〈Which ＋ 名詞〉を使います。",
        tip: "テスト注意：「だれの〜」は Whose、「どちらの〜」は Which としっかり区別しよう！"
      },
      {
        cat: "Which・Whose・所有代名詞",
        type: "穴埋め (1語)",
        jp: "「これはだれの部屋ですか。」となるように(　　)に入る1語を書きましょう。",
        en: "(　　) room is this?",
        answers: ["Whose"],
        displayAns: "Whose",
        hint: "W____（1語・文頭は大文字）",
        full: "Whose room is this?",
        exp: "持ち主をたずねる「だれの〜」は〈Whose ＋ 名詞〉で表します。",
        tip: "「Whose ＋ 名詞」のうしろは疑問文の語順（is this / is that）になります。"
      },
      {
        cat: "Which・Whose・所有代名詞",
        type: "穴埋め (1語)",
        jp: "「あれはだれの帽子ですか。」となるように(　　)に入る1語を書きましょう。",
        en: "Whose hat (　　) that?",
        answers: ["is"],
        displayAns: "is",
        hint: "be動詞（1語）",
        full: "Whose hat is that?",
        exp: "that（あれ）は単数なので、be動詞は is を使います。",
        tip: "一般動詞がない文なので do / does は使いません。"
      },
      {
        cat: "Which・Whose・所有代名詞",
        type: "穴埋め (1語)",
        jp: "「どちらのかさがあなたのものですか。青いの、それとも黄色いの？」となるように(　　)に入る1語を書きましょう。",
        en: "Which umbrella is yours, the blue one or the yellow (　　)?",
        answers: ["one"],
        displayAns: "one",
        hint: "o__（前の単数名詞のくり返しを避ける1語）",
        full: "Which umbrella is yours, the blue one or the yellow one?",
        exp: "前に出た単数名詞（umbrella）のくり返しを避けるときは代名詞 one を使います。",
        tip: "the ＋ 形容詞 ＋ one（青いもの、黄色いもの）の形は頻出です！"
      },
      {
        cat: "Which・Whose・所有代名詞",
        type: "穴埋め (1語)",
        jp: "「あの緑色のが彼女のものです。」となるように(　　)に入る1語を書きましょう。",
        en: "That green one is (　　).",
        answers: ["hers"],
        displayAns: "hers",
        hint: "h___（「彼女のもの」を表す所有代名詞・1語）",
        full: "That green one is hers.",
        exp: "「彼女のもの」を表す所有代名詞は hers です。her は「彼女の（〜）」なので、うしろに名詞がないときは hers にします。",
        tip: "she（彼女は）－ her（彼女の）－ her（彼女を）－ hers（彼女のもの）"
      },
      {
        cat: "Which・Whose・所有代名詞",
        type: "穴埋め (1語)",
        jp: "「あの学校は私たちのものです。」となるように(　　)に入る1語を書きましょう。",
        en: "That school is (　　).",
        answers: ["ours"],
        displayAns: "ours",
        hint: "o___（「私たちのもの」を表す所有代名詞・1語）",
        full: "That school is ours.",
        exp: "「私たちのもの」を表す所有代名詞は ours です。",
        tip: "we（私たちは）－ our（私たちの）－ us（私たちを）－ ours（私たちのもの）"
      },
      {
        cat: "Which・Whose・所有代名詞",
        type: "答え方 (2語)",
        jp: "「これはだれのノートですか。」―「ゆみのものです。」となるように、空欄に入る英語を書きましょう。",
        en: "Whose notebook is this? — (　　　　　).",
        answers: ["It's Yumi's", "It's Yumi's.", "It is Yumi's", "It is Yumi's."],
        displayAns: "It's Yumi's",
        hint: "It's Y___'s（2語・アポストロフィに注意）",
        full: "Whose notebook is this? — It's Yumi's.",
        exp: "人名を使って「〜のもの」と答えるときは、名前のあとに 's をつけて Yumi's にします。また、Whose の質問に Yes/No では答えません。",
        tip: "It's Yumi. だと「それはゆみです」という意味になってしまうので 's を忘れずに！"
      },

      // ② 代名詞（目的格・4格変化） (8問)
      {
        cat: "代名詞（目的格・4格変化）",

        type: "穴埋め (1語)",
        jp: "「私は病院へ歩いていきます。」となるように(　　)に入る1語を書きましょう。",
        en: "I (　　) to the hospital.",
        answers: ["walk"],
        displayAns: "walk",
        hint: "w___（1語）",
        full: "I walk to the hospital.",
        exp: "「〜へ歩いていく」は動詞 walk を使って〈walk to ＋ 場所〉で表します。walk は乗り物ではないので by walk とは言いません。",
        tip: "「歩いていく＝walk to ~」は p.66 の頻出問題です！"
      }
    ];

    let activeCategory = "ALL";
    let deck = [];
    let currentIndex = 0;
    let score = 0;
    let results = []; // { q, userAnswer, isCorrect }
    let answered = false;

    const filterBar = document.getElementById("filterBar");
    const statusCard = document.getElementById("statusCard");
    const quizCard = document.getElementById("quizCard");
    const resultCard = document.getElementById("resultCard");
    const progressText = document.getElementById("progressText");
    const scorePill = document.getElementById("scorePill");
    const progressFill = document.getElementById("progressFill");
    const qCategory = document.getElementById("qCategory");
    const qType = document.getElementById("qType");
    const qNum = document.getElementById("qNum");
    const qPrompt = document.getElementById("qPrompt");
    const qSentence = document.getElementById("qSentence");

    const answerForm = document.getElementById("answerForm");
    const answerInput = document.getElementById("answerInput");
    const submitBtn = document.getElementById("submitBtn");
    const hintBtn = document.getElementById("hintBtn");
    const giveUpBtn = document.getElementById("giveUpBtn");
    const hintBox = document.getElementById("hintBox");

    const explanationBox = document.getElementById("explanationBox");
    const expHeader = document.getElementById("expHeader");
    const expCapNote = document.getElementById("expCapNote");
    const expAnswer = document.getElementById("expAnswer");
    const expBody = document.getElementById("expBody");
    const expTip = document.getElementById("expTip");
    const nextBtn = document.getElementById("nextBtn");

    function normalizeText(str) {
      return str
        .trim()
        .replace(/[\u2018\u2019\uFF07]/g, "'")
        .replace(/\u3000/g, " ")
        .replace(/\s+/g, " ");
    }

    function startQuiz(customList = null) {
      if (customList) {
        deck = customList;
      } else if (activeCategory === "ALL") {
        deck = [...QUESTIONS];
      } else {
        deck = QUESTIONS.filter(q => q.cat === activeCategory);
      }
      currentIndex = 0;
      score = 0;
      results = [];
      statusCard.style.display = "block";
      quizCard.style.display = "block";
      resultCard.classList.remove("show");
      renderQuestion();
    }

    function renderQuestion() {
      answered = false;
      const q = deck[currentIndex];
      const total = deck.length;

      progressText.textContent = `第 ${currentIndex + 1} 問 / 全 ${total} 問`;
      scorePill.textContent = `正解: ${score} 問`;
      progressFill.style.width = `${(currentIndex / total) * 100}%`;

      qCategory.textContent = q.cat;
      qType.textContent = q.type;
      qNum.textContent = `Q${currentIndex + 1}`;
      qPrompt.textContent = q.jp;
      qSentence.textContent = q.en;

      answerInput.value = "";
      answerInput.disabled = false;
      answerInput.className = "answer-input";
      submitBtn.disabled = false;
      hintBtn.disabled = false;
      giveUpBtn.disabled = false;
      hintBox.className = "hint-box";
      hintBox.textContent = "";

      explanationBox.className = "explanation-box";
      expCapNote.className = "exp-cap-note";
      expCapNote.textContent = "";

      nextBtn.textContent = currentIndex === total - 1 ? "結果を見る →" : "次の問題へ →";

      setTimeout(() => answerInput.focus(), 40);
    }

    function evaluateAnswer(rawInput, gaveUp = false) {
      if (answered) return;
      const userClean = normalizeText(rawInput);
      if (!gaveUp && userClean === "") {
        answerInput.focus();
        return;
      }

      answered = true;
      const q = deck[currentIndex];

      let isExact = false;
      let isCaseInsensitiveMatch = false;

      if (!gaveUp) {
        for (const ans of q.answers) {
          const cleanAns = normalizeText(ans);
          if (userClean === cleanAns) {
            isExact = true;
            break;
          }
          if (userClean.toLowerCase() === cleanAns.toLowerCase()) {
            isCaseInsensitiveMatch = true;
          }
        }
      }

      const isCorrect = isExact || isCaseInsensitiveMatch;
      if (isCorrect) score++;

      results.push({
        q,
        userAnswer: gaveUp ? "（わからない）" : userClean,
        isCorrect
      });

      scorePill.textContent = `正解: ${score} 問`;
      progressFill.style.width = `${((currentIndex + 1) / deck.length) * 100}%`;

      answerInput.disabled = true;
      submitBtn.disabled = true;
      hintBtn.disabled = true;
      giveUpBtn.disabled = true;
      answerInput.classList.add(isCorrect ? "is-correct" : "is-wrong");

      explanationBox.classList.add("show", isCorrect ? "is-correct" : "is-wrong");

      if (isCorrect) {
        expHeader.textContent = "⭕ 正解！";
      } else if (gaveUp) {
        expHeader.textContent = `📘 正解は「${q.displayAns}」`;
      } else {
        expHeader.textContent = `❌ おしい！ 正解は「${q.displayAns}」`;
      }

      if (isCaseInsensitiveMatch && !isExact) {
        expCapNote.classList.add("show");
        expCapNote.textContent = `※ つづりは合っていますが、テスト本番では大文字・小文字（${q.displayAns}）に気をつけよう！`;
      }

      expAnswer.textContent = `完成文： ${q.full}`;
      expBody.textContent = q.exp;
      expTip.textContent = `💡 ${q.tip}`;
    }

    answerForm.addEventListener("submit", (e) => {
      e.preventDefault();
      if (!answered) {
        evaluateAnswer(answerInput.value, false);
      }
    });

    hintBtn.addEventListener("click", () => {
      const q = deck[currentIndex];
      hintBox.textContent = `💡 ヒント： ${q.hint}`;
      hintBox.classList.add("show");
      answerInput.focus();
    });

    giveUpBtn.addEventListener("click", () => {
      evaluateAnswer("", true);
    });

    nextBtn.addEventListener("click", () => {
      if (currentIndex < deck.length - 1) {
        currentIndex++;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        showResults();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (answered && e.key === "Enter") {
        if (quizCard.style.display !== "none") {
          e.preventDefault();
          nextBtn.click();
        }
      }
    });

    function showResults() {
      statusCard.style.display = "none";
      quizCard.style.display = "none";
      resultCard.classList.add("show");

      const total = deck.length;
      const pct = Math.round((score / total) * 100);
      document.getElementById("resultScore").textContent = `${score} / ${total} 問 (${pct}%)`;

      let rank = "";
      if (pct === 100) rank = "🏆 パーフェクト！スペルも文法もバッチリ！";
      else if (pct >= 80) rank = "✨ すばらしい！あと少しで満点！";
      else if (pct >= 60) rank = "👍 いい調子！間違えた問題のスペルや語順を復習しよう！";
      else rank = "📘 まずは解説とヒントを見ながら、くり返し書いて覚えよう！";
      document.getElementById("resultRank").textContent = rank;

      const catStats = {};
      results.forEach(r => {
        if (!catStats[r.q.cat]) catStats[r.q.cat] = { ok: 0, total: 0 };
        catStats[r.q.cat].total++;
        if (r.isCorrect) catStats[r.q.cat].ok++;
      });

      const breakdownEl = document.getElementById("breakdown");
      breakdownEl.innerHTML = "<h3>単元別の正答率</h3>";
      Object.entries(catStats).forEach(([cat, st]) => {
        const cPct = Math.round((st.ok / st.total) * 100);
        breakdownEl.innerHTML += `
          <div class="bd-row">
            <div class="bd-label"><span>${cat}</span><span>${st.ok} / ${st.total} (${cPct}%)</span></div>
            <div class="bd-bar"><div class="bd-fill" style="width:${cPct}%"></div></div>
          </div>
        `;
      });

      const wrongList = results.filter(r => !r.isCorrect).map(r => r.q);
      const retryWrongBtn = document.getElementById("retryWrongBtn");
      if (wrongList.length > 0) {
        retryWrongBtn.style.display = "inline-block";
        retryWrongBtn.textContent = `間違えた問題だけ復習する (${wrongList.length}問)`;
        retryWrongBtn.onclick = () => startQuiz(wrongList);
      } else {
        retryWrongBtn.style.display = "none";
      }

      const reviewList = document.getElementById("reviewList");
      reviewList.innerHTML = "<h3>解答一覧</h3>";
      results.forEach((r, i) => {
        reviewList.innerHTML += `
          <div class="review-item ${r.isCorrect ? "r-ok" : "r-ng"}">
            <div><strong>Q${i + 1} [${r.q.cat}]</strong> ${r.isCorrect ? "⭕" : "❌"}（あなたの解答: ${r.userAnswer}）</div>
            <div><strong>${r.q.full}</strong></div>
            <div style="color:#475569; margin-top:3px;">${r.q.exp}</div>
          </div>
        `;
      });
    }

    document.getElementById("restartBtn").addEventListener("click", () => startQuiz());

    filterBar.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        filterBar.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCategory = btn.dataset.cat;
        startQuiz();
      });
    });

    startQuiz();
  </script>
</body>
</html>
