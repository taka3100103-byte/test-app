<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中1理科 2学期末テスト対策 重要語句フラッシュカード（全45枚）</title>
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --accent: #0f766e;
    --accent-light: #f0fdfa;
    --text: #0f172a;
    --muted: #64748b;
    --border: #cbd5e1;
    --ok: #16a34a;
    --ok-bg: #f0fdf4;
    --warn: #d97706;
    --warn-bg: #fffbeb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: linear-gradient(135deg, #1e3a8a, #0f766e);
    color: #fff;
    padding: 16px 20px;
    box-shadow: 0 2px 10px rgba(15, 23, 42, 0.18);
  }

  .header-inner {
    max-width: 780px;
    margin: 0 auto;
  }

  .badge {
    display: inline-block;
    background: rgba(255, 255, 255, 0.18);
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    margin-bottom: 5px;
  }

  h1 {
    margin: 0 0 3px;
    font-size: 20px;
    line-height: 1.35;
  }

  .subtitle {
    margin: 0;
    font-size: 13px;
    opacity: 0.92;
  }

  .container {
    max-width: 780px;
    width: 100%;
    margin: 16px auto 36px;
    padding: 0 16px;
    flex: 1;
  }

  /* フィルター＆ツールバー */
  .toolbar {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
  }

  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  .filter-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }

  .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
  .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .filter-btn.unlearned.active { background: var(--warn); border-color: var(--warn); }

  .tool-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding-top: 8px;
    border-top: 1px dashed #e2e8f0;
  }

  .progress-meta {
    font-size: 13px;
    font-weight: 700;
    color: #334155;
  }

  .progress-meta span {
    color: var(--ok);
  }

  .tool-btns {
    display: flex;
    gap: 6px;
  }

  .mini-btn {
    border: 1px solid var(--border);
    background: #f8fafc;
    color: #334155;
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .mini-btn:hover { background: #e2e8f0; }

  /* プログレスバー */
  .progress-track {
    width: 100%;
    height: 7px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 14px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #2563eb, #16a34a);
    transition: width 0.25s ease;
  }

  /* 3Dフリップカード */
  .scene {
    perspective: 1100px;
    margin-bottom: 16px;
  }

  .flashcard {
    width: 100%;
    min-height: 290px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    cursor: pointer;
  }

  .flashcard.is-flipped {
    transform: rotateY(180deg);
  }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card);
    border-radius: 18px;
    padding: 22px 24px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    border: 2px solid #e2e8f0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .face-back {
    transform: rotateY(180deg);
    background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    border-color: #93c5fd;
  }

  .face-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .unit-tag {
    font-size: 12px;
    font-weight: 700;
    color: var(--primary-dark);
    background: var(--primary-light);
    padding: 3px 10px;
    border-radius: 999px;
  }

  .side-label {
    font-size: 12px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .side-label.back {
    color: var(--accent);
  }

  .learned-pill {
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--ok-bg);
    color: var(--ok);
    border: 1px solid #86efac;
  }

  .face-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 16px 8px;
  }

  .question-text {
    font-size: 19px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.6;
  }

  .answer-text {
    font-size: 24px;
    font-weight: 900;
    color: var(--primary-dark);
    margin-bottom: 14px;
    line-height: 1.4;
  }

  .point-box {
    width: 100%;
    text-align: left;
    background: var(--warn-bg);
    border-left: 4px solid var(--warn);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13.5px;
    color: #78350f;
    line-height: 1.6;
  }

  .point-box strong {
    color: #b45309;
  }

  .face-bottom {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }

  /* コントロールボタン */
  .nav-row {
    display: grid;
    grid-template-columns: auto 1fr 1fr auto;
    gap: 8px;
    align-items: center;
  }

  .btn {
    font-family: inherit;
    font-weight: 700;
    border-radius: 11px;
    padding: 12px 14px;
    font-size: 14px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s ease;
  }

  .btn-nav {
    background: #fff;
    border-color: var(--border);
    color: var(--text);
  }

  .btn-nav:hover:not(:disabled) { background: #f1f5f9; }
  .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-again {
    background: #fff7ed;
    border-color: #fdba74;
    color: #c2410c;
  }

  .btn-again:hover { background: #ffedd5; }

  .btn-ok {
    background: var(--ok);
    color: #fff;
    box-shadow: 0 2px 6px rgba(22, 163, 74, 0.25);
  }

  .btn-ok:hover { background: #15803d; }

  .key-help {
    margin-top: 10px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }

  .empty-state {
    display: none;
    background: #fff;
    border: 2px dashed #86efac;
    border-radius: 16px;
    padding: 40px 20px;
    text-align: center;
  }

  .empty-state.show { display: block; }

  @media (max-width: 560px) {
    .flashcard { min-height: 310px; }
    .question-text { font-size: 17px; }
    .answer-text { font-size: 21px; }
    .nav-row { grid-template-columns: 1fr 1fr; }
    .btn-prev { order: 3; }
    .btn-next { order: 4; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="badge">中学1年生 理科 2学期末テスト対策</div>
    <h1>「身のまわりの物質」重要語句フラッシュカード（全45枚）</h1>
    <p class="subtitle">表面で用語を思い出し、タップで裏返して「答え＋狙われやすい一言ポイント」を確認！</p>
  </div>
</header>

<div class="container">
  <div class="toolbar">
    <div class="filter-row" id="filterRow">
      <button class="filter-btn active" data-filter="all">すべて (45)</button>
      <button class="filter-btn" data-filter="ch1">1章 物質の性質 (12)</button>
      <button class="filter-btn" data-filter="ch2">2章 気体の性質 (11)</button>
      <button class="filter-btn" data-filter="ch3">3章 水溶液 (12)</button>
      <button class="filter-btn" data-filter="ch4">4章 状態変化・蒸留 (10)</button>
      <button class="filter-btn unlearned" data-filter="unlearned">まだ覚えていない</button>
    </div>
    <div class="tool-actions">
      <div class="progress-meta" id="progressMeta">1 / 45 枚目（覚えた: <span>0</span> / 45）</div>
      <div class="tool-btns">
        <button class="mini-btn" id="shuffleBtn">🔀 シャッフル</button>
        <button class="mini-btn" id="resetBtn">↺ 記録リセット</button>
      </div>
    </div>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
  </div>

  <div class="scene" id="scene">
    <div class="flashcard" id="flashcard">
      <div class="face face-front">
        <div class="face-top">
          <span class="unit-tag" id="frontUnit">1章</span>
          <span class="learned-pill" id="frontLearned" style="display:none;">✓ 覚えた</span>
          <span class="side-label">表：問題</span>
        </div>
        <div class="face-center">
          <div class="question-text" id="questionText"></div>
        </div>
        <div class="face-bottom">タップ / Spaceキー で裏返す ↻</div>
      </div>

      <div class="face face-back">
        <div class="face-top">
          <span class="unit-tag" id="backUnit">1章</span>
          <span class="side-label back">裏：答え ＆ ポイント</span>
        </div>
        <div class="face-center">
          <div class="answer-text" id="answerText"></div>
          <div class="point-box" id="pointBox"></div>
        </div>
        <div class="face-bottom">タップで表面に戻る ↺</div>
      </div>
    </div>
  </div>

  <div class="empty-state" id="emptyState">
    <div style="font-size: 28px; margin-bottom: 8px;">🎉</div>
    <div style="font-size: 18px; font-weight: 800; color: #16a34a; margin-bottom: 6px;">この範囲のカードはすべて「覚えた！」になりました！</div>
    <div style="font-size: 13.5px; color: #475569; margin-bottom: 16px;">「すべて」に切り替えて総復習するか、記録をリセットしてもう1周できます。</div>
    <button class="btn btn-ok" onclick="selectFilter('all')">すべてのカードを見る</button>
  </div>

  <div class="nav-row" id="navRow">
    <button class="btn btn-nav btn-prev" id="prevBtn">← 前へ</button>
    <button class="btn btn-again" id="againBtn">🔁 もう一度</button>
    <button class="btn btn-ok" id="learnedBtn">✅ 覚えた！</button>
    <button class="btn btn-nav btn-next" id="nextBtn">次へ →</button>
  </div>

  <div class="key-help">ショートカット：Spaceで裏返す ／ ← → で移動 ／ [1] もう一度 ／ [2] 覚えた！</div>
</div>

<script>
const allCards = [
  {

  },
  {
    "id": 2,

    "unit": "1章 物質の性質",

  },
  {
    "id": 4,
    "chapter": "ch1",
    "unit": "1章 物質の性質",
    "q": "「ガラス」や「プラスチック」のように、ものをつくっている材料で区別したときの名称は？",
    "a": "物質",

  },
  {
    "id": 5,
    "chapter": "ch1",
    "unit": "1章 物質の性質",

  },
  {

  },
  {

  },
  {
    "id": 8,
    "chapter": "ch1",
    "unit": "1章 物質の性質",
    "q": "金属をたたいて薄く広げることができる性質を何という？",
    "a": "展性（てんせい）",
    "point": "「展性（広げる）」と「延性（引きのばす）」の漢字の使い分けに注意！箔（はく）にするのが展性です。"
  },
  {
    "id": 9,
    "chapter": "ch1",
    "unit": "1章 物質の性質",

const state = {
  filter: "all",
  deck: [...allCards],
  index: 0,
  flipped: false,
  learned: {} // card.id -> true
};

function buildDeck() {
  if (state.filter === "all") {
    state.deck = [...allCards];
  } else if (state.filter === "unlearned") {
    state.deck = allCards.filter(c => !state.learned[c.id]);
  } else {
    state.deck = allCards.filter(c => c.chapter === state.filter);
  }
  state.index = 0;
  state.flipped = false;
}

function selectFilter(filter) {
  state.filter = filter;
  document.querySelectorAll(".filter-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.filter === filter);
  });
  buildDeck();
  render();
}

function shuffleDeck() {
  for (let i = state.deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.deck[i], state.deck[j]] = [state.deck[j], state.deck[i]];
  }
  state.index = 0;
  state.flipped = false;
  render();
}

function flipCard() {
  if (state.deck.length === 0) return;
  state.flipped = !state.flipped;
  document.getElementById("flashcard").classList.toggle("is-flipped", state.flipped);
}

function move(delta) {
  if (state.deck.length === 0) return;
  const next = state.index + delta;
  if (next >= 0 && next < state.deck.length) {
    state.index = next;
    state.flipped = false;
    render();
  }
}

function markCard(isLearned) {
  if (state.deck.length === 0) return;
  const card = state.deck[state.index];
  if (isLearned) {
    state.learned[card.id] = true;
  } else {
    delete state.learned[card.id];
  }

  if (state.filter === "unlearned" && isLearned) {
    state.deck = allCards.filter(c => !state.learned[c.id]);
    if (state.index >= state.deck.length) {
      state.index = Math.max(0, state.deck.length - 1);
    }
    state.flipped = false;
    render();
    return;
  }

  if (state.index < state.deck.length - 1) {
    state.index++;
  } else {
    state.index = 0;
  }
  state.flipped = false;
  render();
}

function resetProgress() {
  state.learned = {};
  buildDeck();
  render();
}

function render() {
  const totalAll = allCards.length;
  const learnedAll = Object.keys(state.learned).length;
  const totalDeck = state.deck.length;

  const meta = document.getElementById("progressMeta");
  const fill = document.getElementById("progressFill");
  const scene = document.getElementById("scene");
  const navRow = document.getElementById("navRow");
  const emptyState = document.getElementById("emptyState");

  fill.style.width = `${Math.round((learnedAll / totalAll) * 100)}%`;

  if (totalDeck === 0) {
    meta.innerHTML = `0 / 0 枚目（覚えた: <span>${learnedAll}</span> / ${totalAll}）`;
    scene.style.display = "none";
    navRow.style.display = "none";
    emptyState.classList.add("show");
    return;
  }

  scene.style.display = "block";
  navRow.style.display = "grid";
  emptyState.classList.remove("show");

  meta.innerHTML = `${state.index + 1} / ${totalDeck} 枚目（覚えた: <span>${learnedAll}</span> / ${totalAll}）`;

  const card = state.deck[state.index];
  const flashcard = document.getElementById("flashcard");
  flashcard.classList.toggle("is-flipped", state.flipped);

  document.getElementById("frontUnit").textContent = card.unit;
  document.getElementById("backUnit").textContent = card.unit;
  document.getElementById("frontLearned").style.display = state.learned[card.id] ? "inline-block" : "none";
  document.getElementById("questionText").textContent = card.q;
  document.getElementById("answerText").textContent = card.a;
  document.getElementById("pointBox").innerHTML = `<strong>💡 テストで狙われやすいポイント：</strong><br>${card.point}`;

  document.getElementById("prevBtn").disabled = state.index === 0;
  document.getElementById("nextBtn").disabled = state.index === totalDeck - 1;
}

document.getElementById("flashcard").addEventListener("click", flipCard);
document.getElementById("prevBtn").addEventListener("click", () => move(-1));
document.getElementById("nextBtn").addEventListener("click", () => move(1));
document.getElementById("againBtn").addEventListener("click", () => markCard(false));
document.getElementById("learnedBtn").addEventListener("click", () => markCard(true));
document.getElementById("shuffleBtn").addEventListener("click", shuffleDeck);
document.getElementById("resetBtn").addEventListener("click", resetProgress);

document.getElementById("filterRow").addEventListener("click", e => {
  const btn = e.target.closest(".filter-btn");
  if (!btn) return;
  selectFilter(btn.dataset.filter);
});

document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.key === "Enter") {
    e.preventDefault();
    flipCard();
  } else if (e.key === "ArrowLeft") {
    move(-1);
  } else if (e.key === "ArrowRight") {
    move(1);
  } else if (e.key === "1") {
    markCard(false);
  } else if (e.key === "2") {
    markCard(true);
  }
});

render();
</script>
