<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中1理科 2学期末テスト対策 4択ステップテスト（全40問）</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --primary: #1e40af;
    --primary-dark: #1e3a8a;
    --primary-light: #eff6ff;
    --accent: #0f766e;
    --text: #1e293b;
    --muted: #64748b;
    --border: #cbd5e1;
    --ok: #16a34a;
    --ok-bg: #f0fdf4;
    --ng: #dc2626;
    --ng-bg: #fef2f2;
    --warn: #d97706;
    --warn-bg: #fffbeb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 100%);
    color: #fff;
    padding: 18px 20px 16px;
    box-shadow: 0 2px 10px rgba(30, 58, 138, 0.2);
  }

  .header-inner {
    max-width: 820px;
    margin: 0 auto;
  }

  .badge {
    display: inline-block;
    background: rgba(255, 255, 255, 0.18);
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 20px;
    line-height: 1.35;
  }

  .subtitle {
    margin: 0;
    font-size: 13px;
    opacity: 0.92;
  }

  .container {
    max-width: 820px;
    width: 100%;
    margin: 18px auto 40px;
    padding: 0 16px;
    flex: 1;
  }

  .course-bar {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(15, 23, 42, 0.06);
    border: 1px solid #e2e8f0;
  }

  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  .filter-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filter-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .filter-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .progress-wrap {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 1px 4px rgba(15, 23, 42, 0.04);
  }

  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13.5px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .progress-count {
    color: var(--primary-dark);
    font-size: 15px;
  }

  .progress-score {
    color: var(--muted);
    font-size: 13px;
  }

  .progress-track {
    width: 100%;
    height: 8px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #2563eb, #10b981);
    border-radius: 999px;
    transition: width 0.25s ease;
  }

  .q-card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px 24px 22px;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    border: 2px solid #e2e8f0;
    transition: border-color 0.2s, background-color 0.2s;
  }

  .q-card.is-correct { border-color: #86efac; }
  .q-card.is-wrong { border-color: #fca5a5; }

  .q-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .q-num {
    font-weight: 800;
    font-size: 14px;
    color: var(--primary-dark);
    background: var(--primary-light);
    padding: 3px 11px;
    border-radius: 6px;
  }

  .q-tag {
    font-size: 12px;
    font-weight: 600;
    color: #475569;
    background: #f1f5f9;
    padding: 2px 9px;
    border-radius: 6px;
  }

  .q-tag.important {
    background: var(--warn-bg);
    color: #b45309;
    border: 1px solid #fde68a;
  }

  .q-status {
    margin-left: auto;
    font-size: 15px;
    font-weight: 800;
  }

  .q-status.ok { color: var(--ok); }
  .q-status.ng { color: var(--ng); }

  .q-text {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.75;
    margin: 0 0 16px;
    white-space: pre-line;
  }

  .q-figure {
    margin: 0 0 16px;
    padding: 12px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    text-align: center;
    overflow-x: auto;
  }

  .q-figure table {
    margin: 0 auto;
    border-collapse: collapse;
    font-size: 13.5px;
    background: #ffffff;
  }

  .q-figure th,
  .q-figure td {
    border: 1px solid #cbd5e1;
    padding: 6px 10px;
    text-align: center;
  }

  .q-figure th {
    background: #eff6ff;
    color: #1e3a8a;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .choice-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: #ffffff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.5;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .choice-btn:hover:not(:disabled) {
    border-color: #60a5fa;
    background: #f8fafc;
    transform: translateY(-1px);
  }

  .choice-btn:disabled {
    cursor: default;
  }

  .choice-label {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #f1f5f9;
    color: #334155;
    font-weight: 700;
    font-size: 13px;
  }

  .choice-btn.correct {
    background: var(--ok-bg);
    border-color: var(--ok);
    color: #14532d;
    font-weight: 700;
  }

  .choice-btn.correct .choice-label {
    background: var(--ok);
    color: #ffffff;
  }

  .choice-btn.wrong {
    background: var(--ng-bg);
    border-color: var(--ng);
    color: #7f1d1d;
  }

  .choice-btn.wrong .choice-label {
    background: var(--ng);
    color: #ffffff;
  }

  .answer-box {
    display: none;
    margin-top: 16px;
    padding: 16px 18px;
    background: #f8fafc;
    border-left: 5px solid var(--primary);
    border-radius: 10px;
    animation: fadeIn 0.2s ease;
  }

  .answer-box.show { display: block; }
  .answer-box.is-ok { background: var(--ok-bg); border-left-color: var(--ok); }
  .answer-box.is-ng { background: var(--ng-bg); border-left-color: var(--ng); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .answer-key {
    font-weight: 800;
    font-size: 15.5px;
    margin-bottom: 6px;
  }

  .answer-box.is-ok .answer-key { color: #166534; }
  .answer-box.is-ng .answer-key { color: #991b1b; }

  .explain {
    color: #334155;
    font-size: 14px;
    line-height: 1.7;
  }

  .card-footer {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #e2e8f0;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
  }

  .left-actions, .right-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .btn {
    font-family: inherit;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
    border: none;
  }

  .btn-next {
    background: var(--accent);
    color: #fff;
    padding: 11px 24px;
    font-size: 15px;
    box-shadow: 0 2px 6px rgba(15, 118, 110, 0.25);
  }

  .btn-next:hover { background: #115e59; }

  .btn-secondary {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 14px;
    font-size: 13.5px;
    font-weight: 600;
  }

  .btn-secondary:hover { background: #f1f5f9; }
  .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-primary {
    background: var(--primary);
    color: #fff;
    padding: 11px 22px;
    font-size: 14.5px;
  }

  .btn-primary:hover { background: var(--primary-dark); }

  .key-tip {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
  }

  .jump-wrap {
    margin-top: 18px;
    background: var(--card);
    border-radius: 12px;
    padding: 14px 16px;
    border: 1px solid #e2e8f0;
  }

  .jump-title {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .jump-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .jump-dot {
    width: 32px;
    height: 30px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .jump-dot.current {
    border-color: var(--primary);
    background: var(--primary);
    color: #fff;
  }

  .jump-dot.done-ok {
    background: var(--ok-bg);
    border-color: #86efac;
    color: var(--ok);
  }

  .jump-dot.done-ng {
    background: var(--ng-bg);
    border-color: #fca5a5;
    color: var(--ng);
  }

  .jump-dot.current.done-ok,
  .jump-dot.current.done-ng {
    box-shadow: 0 0 0 2px var(--primary);
  }

  .result-card {
    display: none;
    background: var(--card);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    border: 2px solid var(--primary);
    text-align: center;
  }

  .result-card.show { display: block; }

  .result-score {
    font-size: 42px;
    font-weight: 900;
    color: var(--primary-dark);
    margin: 8px 0 4px;
  }

  .result-sub {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .chapter-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
    gap: 10px;
    margin-bottom: 22px;
    text-align: left;
  }

  .stat-chip {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }

  .result-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  @media (max-width: 560px) {
    .q-card { padding: 18px 16px; }
    .q-text { font-size: 15.5px; }
    .choice-btn { font-size: 14.5px; padding: 10px 12px; }
    .card-footer { flex-direction: column; align-items: stretch; }
    .left-actions, .right-actions { justify-content: space-between; }
    .btn-next { flex: 1; text-align: center; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="badge">中学1年生 理科 2学期末テスト対策</div>
    <h1>「身のまわりの物質」1問1答 4択ステップテスト</h1>
    <p class="subtitle">1問ずつ「選択 → 即答え合わせ・解説 → 次の問題へ」の順で集中演習できます（全40問）</p>
  </div>
</header>

<div class="container">
  <div class="course-bar">
    <div class="filter-row" id="filterRow">
      <button class="filter-btn active" data-filter="all">全範囲 (40問)</button>
      <button class="filter-btn" data-filter="1">1章 物質の性質 (10)</button>
      <button class="filter-btn" data-filter="2">2章 気体の性質 (8)</button>
      <button class="filter-btn" data-filter="3">3章 水溶液 (11)</button>
      <button class="filter-btn" data-filter="4">4章 状態変化・蒸留 (11)</button>
      <button class="filter-btn" data-filter="important">重要・よく出るのみ</button>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-top">
      <span class="progress-count" id="progressCount">第 1 問 / 全 40 問</span>
      <span class="progress-score" id="progressScore">正解: 0 問（解答済み: 0）</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width: 2.5%;"></div>
    </div>
  </div>

  <div id="questionArea"></div>

  <div class="result-card" id="resultCard">
    <div style="font-size: 14px; font-weight: 700; color: #1e40af;">おつかれさまでした！</div>
    <div class="result-score" id="resultScore">0点</div>
    <div class="result-sub" id="resultSub">0問正解 / 40問中</div>
    <div class="chapter-stats" id="chapterStats"></div>
    <div class="result-actions">
      <button class="btn btn-primary" id="retryWrongBtn" style="display:none;">間違えた問題だけ解き直す</button>
      <button class="btn btn-secondary" id="restartBtn">最初からやり直す</button>
    </div>
  </div>

  <div class="jump-wrap" id="jumpWrap">
    <div class="jump-title">問題番号ジャンプ（クリックで移動）</div>
    <div class="jump-grid" id="jumpGrid"></div>
  </div>
</div>

<script>
const allQuestions = [
      // ================= 1章：いろいろな物質とその性質 (10問) =================
      {
        id: 1,
        chapter: "1",
        unit: "1章 ガスバーナーの使い方",
        important: true,
        text: "ガスバーナーに火をつけたところ、炎の色が赤色（オレンジ色）だった。青い炎に調節するための操作として正しいものはどれか。",
        figure: `
          <svg width="220" height="150" viewBox="0 0 220 150" aria-label="ガスバーナー">
            <rect x="95" y="20" width="30" height="65" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
            <rect x="88" y="65" width="44" height="14" rx="3" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
            <rect x="88" y="83" width="44" height="14" rx="3" fill="#64748b" stroke="#334155" stroke-width="2"/>
            <path d="M75 120 L145 120 L135 100 L85 100 Z" fill="#475569" stroke="#334155" stroke-width="2"/>
            <line x1="130" y1="90" x2="185" y2="90" stroke="#334155" stroke-width="6"/>
            <text x="22" y="76" font-size="13" font-weight="bold" fill="#1e3a8a">Aのねじ →</text>
            <text x="22" y="95" font-size="13" font-weight="bold" fill="#1e3a8a">Bのねじ →</text>
          </svg>
        `,
        choices: [
          "Bのねじをおさえたまま、Aのねじをさらに開ける。",
          "Aのねじをおさえたまま、Bのねじをさらに開ける。",
          "Bのねじをおさえたまま、Aのねじをしめる。",
          "AのねじとBのねじの両方をしめる。"
        ],
        answer: 0,
        explanation: "上のねじAが「空気調節ねじ」、下のねじBが「ガス調節ねじ」です。赤い炎は空気不足なので、ガス調節ねじ（B）が一緒に回らないようにおさえたまま、空気調節ねじ（A）をゆるめて（開けて）空気を多く入れます。消火するときは A → B → コック → 元栓 の順に閉めます。"
      },
      {
        id: 2,
        chapter: "1",
        unit: "1章 物体と物質の区別",
        important: false,
        text: "「コップ」のように使う目的や形で区別したときの名称を何というか。また、「ガラス」や「プラスチック」のように材料で区別したときの名称を何というか。",
        choices: [
          "目的や形：物質 ／ 材料：物体",
          "目的や形：物体 ／ 材料：物質",
          "目的や形：純物質 ／ 材料：混合物",
          "目的や形：有機物 ／ 材料：無機物"
        ],
        answer: 1,
        explanation: "コップ・スプーン・机のように、形や使う目的で区別したものを「物体」、ガラス・プラスチック・鉄のように、物体をつくっている材料そのもので区別したものを「物質」といいます。"
      },
      {
        id: 3,
        chapter: "1",
        unit: "1章 有機物と無機物",
        important: true,
        text: "砂糖・かたくり粉・食塩をそれぞれ燃焼さじで加熱し、燃えたものは石灰水を入れた集気びんに入れてよく振った。この実験結果について正しい説明はどれか。",
        choices: [
          "食塩は燃えて炭になり、石灰水を白くにごらせた。",
          "砂糖とかたくり粉は炭素をふくむ無機物である。",
          "かたくり粉が燃えたとき、集気びんの内側がくもったのは二酸化炭素ができたためである。",
          "砂糖とかたくり粉は燃えて二酸化炭素と水が発生する有機物であり、食塩は燃えない無機物である。"
        ],
        answer: 3,
        explanation: "砂糖・かたくり粉・エタノール・ろう・プラスチックのように、炭素をふくみ、燃えると二酸化炭素（石灰水を白くにごらせる）と水（集気びんの内側をくもらせる）が発生する物質を「有機物」といいます。食塩・鉄・ガラスなどは「無機物」です。"
      },
      {
        id: 4,
        chapter: "1",
        unit: "1章 金属と非金属",
        important: true,
        text: "アルミニウム、銅、鉄などの金属に共通する性質として誤っているものはどれか。",
        choices: [
          "電気をよく通す（電気伝導性）",
          "熱をよく伝える（熱伝導性）",
          "すべての金属は磁石につく",
          "みがくと特有の光沢が出たり、たたいて広げたり（展性）引きのばしたり（延性）できる"
        ],
        answer: 2,
        explanation: "鉄（スチール缶など）は磁石につきますが、アルミニウム（アルミ缶）や銅、金などは磁石につきません。したがって「磁石につく」ことは金属共通の性質ではありません。"
      },
      {
        id: 5,
        chapter: "1",
        unit: "1章 てんびんの使い方",
        important: false,
        text: "電子てんびんや上皿てんびんの使い方として正しいものはどれか。",
        choices: [
          "電子てんびんに薬包紙をのせたあと、表示を0にするスイッチを押してから薬品をはかりとる。",
          "電子てんびんは、傾いた台の上でも水平に調整しなくてよい。",
          "上皿てんびんは、指針が完全に止まるまで待たないとつり合ったか確認できない。",
          "上皿てんびんを使うとき、薬品は直接うでの皿の上にのせてはかる。"
        ],
        answer: 0,
        explanation: "電子てんびんも上皿てんびんも必ず水平な台に置いて使います。電子てんびんでは薬包紙をのせた後に0点スイッチを押します。上皿てんびんは指針が左右に同じ幅だけ振れればつり合っています（薬品をはかるときは薬包紙を両方の皿にのせます）。"
      },
      {
        id: 6,
        chapter: "1",
        unit: "1章 メスシリンダーの使い方",
        important: false,
        text: "メスシリンダーで液体の体積をはかるとき、目の位置と目盛りの読み方として正しいものはどれか。",
        choices: [
          "液面の上のふちを斜め上から見て、最小目盛りの10分の1まで読む。",
          "液面のいちばん低いところ（平らな部分）を真横から見て、最小目盛りの10分の1まで目分量で読む。",
          "液面のいちばん低いところを真横から見て、最小目盛りの単位で四捨五入して読む。",
          "液面の上のふちを真横から見て、最小目盛りの2分の1まで読む。"

const labels = ["ア", "イ", "ウ", "エ"];

const state = {
  filter: "all",
  activeList: [...allQuestions],
  currentIndex: 0,
  answers: {}, // q.id -> selectedIdx
  finished: false
};

function setCourse(filter) {
  state.filter = filter;
  if (filter === "all") {
    state.activeList = [...allQuestions];
  } else if (filter === "important") {
    state.activeList = allQuestions.filter(q => q.important);
  } else {
    state.activeList = allQuestions.filter(q => q.chapter === filter);
  }
  state.currentIndex = 0;
  state.finished = false;
  render();
}

function selectChoice(choiceIdx) {
  const q = state.activeList[state.currentIndex];
  if (!q || state.answers[q.id] !== undefined) return;
  state.answers[q.id] = choiceIdx;
  render();
}

function goNext() {
  if (state.currentIndex < state.activeList.length - 1) {
    state.currentIndex++;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    state.finished = true;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function goPrev() {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function jumpTo(idx) {
  state.finished = false;
  state.currentIndex = idx;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function restartCourse(onlyWrong = false) {
  if (onlyWrong) {
    const wrongList = state.activeList.filter(q => state.answers[q.id] !== q.answer);
    if (wrongList.length === 0) return;
    wrongList.forEach(q => {
      delete state.answers[q.id];
    });
    state.activeList = wrongList;
  } else {
    state.activeList.forEach(q => {
      delete state.answers[q.id];
    });
  }
  state.currentIndex = 0;
  state.finished = false;
  render();
}

function render() {
  const total = state.activeList.length;
  const answeredCount = state.activeList.filter(q => state.answers[q.id] !== undefined).length;
  const okCount = state.activeList.filter(q => state.answers[q.id] === q.answer).length;

  const progressWrap = document.getElementById("progressWrap");
  const questionArea = document.getElementById("questionArea");
  const resultCard = document.getElementById("resultCard");

  if (state.finished) {
    progressWrap.style.display = "none";
    questionArea.innerHTML = "";
    renderResult(okCount, total);
    resultCard.classList.add("show");
  } else {
    progressWrap.style.display = "block";
    resultCard.classList.remove("show");

    const pct = total > 0 ? Math.round(((state.currentIndex + 1) / total) * 100) : 0;
    document.getElementById("progressCount").textContent = `第 ${state.currentIndex + 1} 問 / 全 ${total} 問`;
    document.getElementById("progressScore").textContent = `正解: ${okCount} 問（解答済み: ${answeredCount}）`;
    document.getElementById("progressFill").style.width = `${pct}%`;

    renderCurrentQuestion();
  }

  renderJumpGrid();
}

function renderCurrentQuestion() {
  const area = document.getElementById("questionArea");
  const q = state.activeList[state.currentIndex];
  if (!q) {
    area.innerHTML = "";
    return;
  }

  const userAns = state.answers[q.id];
  const isAnswered = userAns !== undefined;
  const isOk = isAnswered && userAns === q.answer;
  const isLast = state.currentIndex === state.activeList.length - 1;

  const choicesHtml = q.choices.map((c, idx) => {
    let cls = "choice-btn";
    if (isAnswered) {
      if (idx === q.answer) cls += " correct";
      else if (idx === userAns) cls += " wrong";
    }
    return `
      <button class="${cls}" ${isAnswered ? "disabled" : ""} onclick="selectChoice(${idx})">
        <span class="choice-label">${labels[idx]}</span>
        <span>${c}</span>
      </button>
    `;
  }).join("");

  const statusHtml = isAnswered
    ? (isOk ? `<span class="q-status ok">⭕ 正解！</span>` : `<span class="q-status ng">❌ 不正解</span>`)
    : "";

  const ansBoxClass = isAnswered ? (isOk ? "answer-box show is-ok" : "answer-box show is-ng") : "answer-box";

  area.innerHTML = `
    <div class="q-card ${isAnswered ? (isOk ? "is-correct" : "is-wrong") : ""}">
      <div class="q-header">
        <span class="q-num">第 ${q.id} 問</span>
        ${q.important ? '<span class="q-tag important">重要・よく出る</span>' : ""}
        <span class="q-tag">${q.unit}</span>
        ${statusHtml}
      </div>
      <p class="q-text">${q.text}</p>
      ${q.figure ? `<div class="q-figure">${q.figure}</div>` : ""}
      <div class="choices">${choicesHtml}</div>
      <div class="${ansBoxClass}">
        <div class="answer-key">${isOk ? "⭕ 正解！" : "❌ 不正解（正解：" + labels[q.answer] + "）"}</div>
        <div class="explain">${q.explanation}</div>
      </div>
      <div class="card-footer">
        <div class="left-actions">
          <button class="btn btn-secondary" onclick="goPrev()" ${state.currentIndex === 0 ? "disabled" : ""}>← 前の問題</button>
        </div>
        <div class="right-actions">
          ${isAnswered ? `<button class="btn btn-next" id="nextBtn" onclick="goNext()">${isLast ? "結果を見る 🎉" : "次の問題へ →"}</button>` : `<span style="font-size:13px; color:var(--muted);">選択肢を1つ選んでください</span>`}
        </div>
      </div>
      <div class="key-tip">キーボードの 1〜4 で選択、Enterキーで次の問題へ進めます</div>
    </div>
  `;

  if (isAnswered) {
    const nextBtn = document.getElementById("nextBtn");
    if (nextBtn) nextBtn.focus();
  }
}

function renderResult(okCount, total) {
  const score = total > 0 ? Math.round((okCount / total) * 100) : 0;
  document.getElementById("resultScore").textContent = `${score}点`;
  document.getElementById("resultSub").textContent = `${okCount} 問正解 / ${total} 問中（正答率 ${score}%）`;

  const chMap = {
    "1": { label: "1章 物質の性質", ok: 0, total: 0 },
    "2": { label: "2章 気体の性質", ok: 0, total: 0 },
    "3": { label: "3章 水溶液", ok: 0, total: 0 },
    "4": { label: "4章 状態変化・蒸留", ok: 0, total: 0 }
  };

  state.activeList.forEach(q => {
    chMap[q.chapter].total++;
    if (state.answers[q.id] === q.answer) chMap[q.chapter].ok++;
  });

  const statsEl = document.getElementById("chapterStats");
  statsEl.innerHTML = Object.values(chMap)
    .filter(s => s.total > 0)
    .map(s => {
      const pct = Math.round((s.ok / s.total) * 100);
      return `<div class="stat-chip"><strong>${s.label}</strong><br>${s.ok} / ${s.total} 問正解 (${pct}%)</div>`;
    }).join("");

  const wrongCount = total - okCount;
  const retryBtn = document.getElementById("retryWrongBtn");
  if (wrongCount > 0) {
    retryBtn.style.display = "inline-block";
    retryBtn.textContent = `間違えた問題だけ解き直す (${wrongCount}問)`;
  } else {
    retryBtn.style.display = "none";
  }
}

function renderJumpGrid() {
  const grid = document.getElementById("jumpGrid");
  grid.innerHTML = state.activeList.map((q, idx) => {
    let cls = "jump-dot";
    if (!state.finished && idx === state.currentIndex) cls += " current";
    if (state.answers[q.id] !== undefined) {
      cls += state.answers[q.id] === q.answer ? " done-ok" : " done-ng";
    }
    return `<button class="${cls}" onclick="jumpTo(${idx})" title="第${q.id}問">${idx + 1}</button>`;
  }).join("");
}

document.getElementById("filterRow").addEventListener("click", e => {
  const btn = e.target.closest(".filter-btn");
  if (!btn) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  setCourse(btn.dataset.filter);
});

document.addEventListener("keydown", e => {
  if (state.finished) return;
  const q = state.activeList[state.currentIndex];
  if (!q) return;
  const isAnswered = state.answers[q.id] !== undefined;
  if (!isAnswered && ["1", "2", "3", "4"].includes(e.key)) {
    selectChoice(parseInt(e.key, 10) - 1);
  } else if (isAnswered && e.key === "Enter") {
    e.preventDefault();
    goNext();
  }
});

document.getElementById("retryWrongBtn").addEventListener("click", () => restartCourse(true));
document.getElementById("restartBtn").addEventListener("click", () => restartCourse(false));

render();
</script>
</body>
</html>
