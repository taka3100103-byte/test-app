<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中1 技術科 2学期末テスト対策 記述＆○×ひっかけ問題（G1-2E-Tech-R）</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --teal: #0f766e;
      --teal-soft: #f0fdfa;
      --correct: #16a34a;
      --correct-bg: #f0fdf4;
      --correct-border: #86efac;
      --partial: #d97706;
      --partial-bg: #fffbeb;
      --partial-border: #fcd34d;
      --wrong: #dc2626;
      --wrong-bg: #fef2f2;
      --wrong-border: #fca5a5;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding: 20px 16px 56px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #312e81, #4f46e5);
      color: #ffffff;
      padding: 22px 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    header .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    header .tag {
      background: rgba(255, 255, 255, 0.18);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 21px;
      line-height: 1.35;
    }

    header p {
      margin: 0;
      font-size: 13.5px;
      opacity: 0.92;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 18px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 16px 0 20px;
    }

    .mode-btn {
      text-align: left;
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .mode-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .mode-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .mode-btn .mode-title {
      display: block;
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      margin-bottom: 3px;
    }

    .mode-btn .mode-desc {
      display: block;
      font-size: 12.5px;
      color: var(--muted);
    }

    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .toggle-label input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
    }

    .btn:active { transform: translateY(1px); }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:hover { background: #cbd5e1; }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--muted);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4f46e5, #06b6d4);
      width: 0%;
      transition: width 0.25s ease;
    }

    .q-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .q-category {
      display: inline-block;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .q-type-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .q-type-essay {
      background: #fef3c7;
      color: #b45309;
    }

    .q-type-ox {
      background: #e0f2fe;
      color: #0369a1;
    }

    .q-important {
      display: inline-block;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .q-number {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    .q-text {
      font-size: 17.5px;
      font-weight: 700;
      line-height: 1.6;
      margin: 0 0 18px;
    }

    /* Essay Input */
    .essay-box {
      margin-bottom: 14px;
    }

    .essay-box textarea {
      width: 100%;
      min-height: 100px;
      padding: 14px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 15.5px;
      line-height: 1.6;
      resize: vertical;
      transition: border-color 0.15s ease;
    }

    .essay-box textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .essay-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    /* OX Buttons */
    .ox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .ox-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 18px 16px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: #f8fafc;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .ox-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-soft);
      transform: translateY(-1px);
    }

    .ox-btn:disabled {
      cursor: default;
    }

    .ox-symbol {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.1;
    }

    .ox-label {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--muted);
    }

    .ox-btn.selected-correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: var(--correct);
    }

    .ox-btn.selected-wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: var(--wrong);
    }

    .ox-btn.show-answer {
      border-color: var(--correct);
      background: var(--correct-bg);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.14);
    }

    /* Hint */
    .hint-box {
      display: none;
      background: #f8fafc;
      border: 1px dashed #94a3b8;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13.5px;
      color: #334155;
      margin-top: 12px;
    }

    .hint-box.visible { display: block; }

    /* Feedback & Keywords */
    .feedback {
      display: none;
      margin-top: 18px;
      border-radius: 12px;
      padding: 18px;
      border: 1.5px solid var(--border);
    }

    .feedback.visible { display: block; }

    .feedback.is-correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
    }

    .feedback.is-partial {
      background: var(--partial-bg);
      border-color: var(--partial-border);
    }

    .feedback.is-wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
    }

    .feedback.is-neutral {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .feedback-title {
      font-size: 16.5px;
      font-weight: 800;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .feedback.is-correct .feedback-title { color: var(--correct); }
    .feedback.is-partial .feedback-title { color: var(--partial); }
    .feedback.is-wrong .feedback-title { color: var(--wrong); }

    .model-answer-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .model-answer-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .model-answer-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }

    .kw-section {
      margin-bottom: 12px;
    }

    .kw-title {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }

    .kw-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .kw-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .kw-chip.hit {
      background: #dcfce7;
      color: #166534;
      border-color: #86efac;
    }

    .kw-chip.miss {
      background: #fee2e2;
      color: #991b1b;
      border-color: #fca5a5;
    }

    .kw-chip.neutral {
      background: #e0e7ff;
      color: #3730a3;
      border-color: #c7d2fe;
    }

    .explain-text {
      margin: 0;
      font-size: 14.5px;
      color: #334155;
    }

    .contrast-box {
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.85);
      border-left: 4px solid var(--teal);
      padding: 9px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 13.5px;
      color: #0f172a;
    }

    .self-grade-row {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed #cbd5e1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .self-grade-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      margin-right: 4px;
    }

    .grade-btn {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: #ffffff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .grade-btn.active-ok {
      background: var(--correct);
      color: #ffffff;
      border-color: var(--correct);
    }

    .grade-btn.active-ng {
      background: var(--wrong);
      color: #ffffff;
      border-color: var(--wrong);
    }

    .nav-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      gap: 12px;
    }

    /* Result Screen */
    .score-hero {
      text-align: center;
      padding: 12px 0 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .score-num {
      font-size: 44px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.1;
      margin: 6px 0;
    }

    .score-sub {
      font-size: 14.5px;
      color: var(--muted);
      margin: 0;
    }

    .breakdown-list {
      display: grid;
      gap: 10px;
      margin-bottom: 22px;
    }

    .breakdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .hidden { display: none !important; }

    @media (max-width: 520px) {
      .card { padding: 18px; }
      .q-text { font-size: 16.5px; }
      .ox-grid { gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge-row">
        <span class="tag">中学1年 技術</span>
        <span class="tag">2学期末テスト対策</span>
        <span class="tag">記述＆○×ひっかけ特化</span>
      </div>
      <h1>理由・仕組み記述 ＆ 紛らわしい用語○×テスト</h1>
      <p>製図（構想図・製作図・等角図・第三角法）と木材加工（材料取り・けがき・切断）の失点しやすいポイントを1問1答で対策します。</p>
    </header>

    <!-- Start Screen -->
    <section id="start-screen" class="card">
      <h2 style="margin:0 0 8px; font-size:18px;">出題モードを選んでスタート</h2>
      <p style="margin:0; font-size:13.5px; color:var(--muted);">
        記述問題は<strong>「必須キーワード」</strong>が自動でチェックされ、○×問題は<strong>「ひっかけの対比ポイント」</strong>がすぐに確認できます。
      </p>

      <div class="mode-grid" id="mode-grid">
        <button type="button" class="mode-btn active" data-mode="all">
          <span class="mode-title">全問チャレンジ（20問）</span>
          <span class="mode-desc">短文記述6問＋○×ひっかけ14問をまとめて対策</span>
        </button>
        <button type="button" class="mode-btn" data-mode="essay">
          <span class="mode-title">理由・仕組み 短文記述のみ（6問）</span>
          <span class="mode-desc">重要テーマ2選＋図法・けがき・切断の記述対策</span>
        </button>
        <button type="button" class="mode-btn" data-mode="ox">
          <span class="mode-title">紛らわしい用語 ○×のみ（14問）</span>
          <span class="mode-desc">構想図vs製作図・長手vs妻手・数値ひっかけ対策</span>
        </button>
      </div>

      <div class="options-row">
        <label class="toggle-label">
          <input type="checkbox" id="shuffle-toggle" />
          問題の順番をシャッフルする
        </label>
        <button type="button" id="start-btn" class="btn btn-primary">テストを始める →</button>
      </div>
    </section>

    <!-- Quiz Screen -->
    <section id="quiz-screen" class="card hidden">
      <div class="progress-header">
        <span id="progress-label">問題 1 / 20</span>
        <span id="score-live">現在の正解: 0</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>

      <div class="q-meta">
        <div class="badge-group">
          <span class="q-category" id="q-category"></span>
          <span class="q-type-badge" id="q-type-badge"></span>
          <span class="q-important hidden" id="q-important">★ 超重要記述テーマ</span>
        </div>
        <span class="q-number" id="q-number"></span>
      </div>

      <p class="q-text" id="q-text"></p>

      <!-- Essay Input Area -->
      <div id="essay-area" class="hidden">
        <div class="essay-box">
          <textarea id="essay-input" placeholder="ここに自分の言葉で理由や仕組みを入力しよう…（そのまま「答え合わせ」でもOK）"></textarea>
        </div>
        <div class="essay-actions">
          <button type="button" id="check-essay-btn" class="btn btn-primary">答え合わせ・キーワード確認</button>
          <button type="button" id="hint-btn" class="btn btn-outline">ヒントを見る</button>
        </div>
      </div>

      <!-- OX Choice Area -->
      <div id="ox-area" class="hidden">
        <div class="ox-grid">
          <button type="button" class="ox-btn" data-choice="true" id="btn-o">
            <span class="ox-symbol">○</span>
            <span class="ox-label">正しい</span>
          </button>
          <button type="button" class="ox-btn" data-choice="false" id="btn-x">
            <span class="ox-symbol">×</span>
            <span class="ox-label">まちがい</span>
          </button>
        </div>
      </div>

      <div id="hint-box" class="hint-box"></div>

      <!-- Feedback Area -->
      <div id="feedback-box" class="feedback">
        <div class="feedback-title" id="feedback-title"></div>

        <div id="model-answer-wrap" class="model-answer-box hidden">
          <div class="model-answer-label">模範解答</div>
          <p class="model-answer-text" id="model-answer-text"></p>
        </div>

        <div id="kw-wrap" class="kw-section hidden">
          <div class="kw-title">記述に含めるべき必須キーワード（自動チェック）</div>
          <div class="kw-list" id="kw-list"></div>
        </div>

        <p class="explain-text" id="explain-text"></p>

        <div id="contrast-box" class="contrast-box hidden"></div>

        <div id="self-grade-row" class="self-grade-row hidden">
          <span class="self-grade-label">自己採点（記録用）：</span>
          <button type="button" class="grade-btn" id="grade-ok-btn">○ 書けた・理解した</button>
          <button type="button" class="grade-btn" id="grade-ng-btn">✕ 要復習にする</button>
        </div>
      </div>

      <div class="nav-footer">
        <button type="button" id="quit-btn" class="btn btn-outline">最初に戻る</button>
        <button type="button" id="next-btn" class="btn btn-primary hidden">次の問題へ →</button>
      </div>
    </section>

    <!-- Result Screen -->
    <section id="result-screen" class="card hidden">
      <div class="score-hero">
        <div style="font-size:14px; font-weight:700; color:var(--muted);">テスト結果</div>
        <div class="score-num" id="final-score">0 / 0</div>
        <p class="score-sub" id="final-comment"></p>
      </div>

      <h3 style="margin:0 0 10px; font-size:16px;">単元・形式別の成績</h3>
      <div class="breakdown-list" id="breakdown-list"></div>

      <div class="result-actions">
        <button type="button" id="retry-wrong-btn" class="btn btn-primary hidden">間違えた・要復習の問題だけ解き直す</button>
        <button type="button" id="retry-all-btn" class="btn btn-secondary">同じモードでもう一度</button>
        <button type="button" id="back-home-btn" class="btn btn-outline">モード選択に戻る</button>
      </div>
    </section>
  </div>

  <script>
    const QUESTIONS = [
      // ===== 短文記述（6問：うち重要テーマ2つを明示） =====
      {
        id: "e1",
        type: "essay",
        important: true,
        category: "製図のルール",
        question: "【重要テーマ①】構想図や製作図をかくとき、日本ではJIS（日本産業規格）によって製図のルールが細かく決められています。その理由を説明しなさい。",
        hint: "「だれが」「だれに」「どう伝わるように」を意識して書こう。",
        modelAnswer: "設計者の考えが他の人に正しく伝わるようにするため。",
        keywords: [
          { label: "設計者の考え", match: ["設計者の考え", "設計者の思い", "設計者の意図", "考えたこと"] },
          { label: "他の人に", match: ["他の人", "ほかの人", "他人", "相手", "作る人", "つくる人", "別の人"] },
          { label: "正しく伝わる", match: ["正しく伝わ", "正確に伝わ", "間違いなく伝わ", "しっかり伝わ"] }
        ],
        explanation: "図面は設計者の頭の中にあるイメージや寸法を伝えるための共通言語です。人によってかき方がバラバラだと誤解やミスが起きるため、JIS（日本産業規格）でルールが統一されています。"
      },
      {
        id: "e2",
        type: "essay",
        important: true,

      });

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function startQuiz(customList = null) {
      let list;
      if (customList) {
        list = [...customList];
      } else {
        if (selectedMode === "essay") {
          list = QUESTIONS.filter(q => q.type === "essay");
        } else if (selectedMode === "ox") {
          list = QUESTIONS.filter(q => q.type === "ox");
        } else {
          list = [...QUESTIONS];
        }
        if (shuffleToggle.checked) {
          list = shuffleArray(list);
        }
      }

      activeQuestions = list;
      currentIndex = 0;
      score = 0;
      results = [];

      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      renderQuestion();
    }

    function renderQuestion() {
      const q = activeQuestions[currentIndex];
      const total = activeQuestions.length;

      progressLabel.textContent = `問題 ${currentIndex + 1} / ${total}`;
      scoreLive.textContent = `現在の正解: ${score}`;
      progressFill.style.width = `${(currentIndex / total) * 100}%`;

      qCategory.textContent = q.category;
      qNumber.textContent = `Q${currentIndex + 1}`;
      qText.textContent = q.question;

      if (q.type === "essay") {
        qTypeBadge.textContent = "短文記述";
        qTypeBadge.className = "q-type-badge q-type-essay";
      } else {
        qTypeBadge.textContent = "○×ひっかけ";
        qTypeBadge.className = "q-type-badge q-type-ox";
      }

      if (q.important) {
        qImportant.classList.remove("hidden");
      } else {
        qImportant.classList.add("hidden");
      }

      // Reset areas
      feedbackBox.className = "feedback";
      feedbackBox.classList.remove("visible");
      hintBox.classList.remove("visible");
      hintBox.textContent = "";
      nextBtn.classList.add("hidden");
      contrastBox.classList.add("hidden");
      modelAnswerWrap.classList.add("hidden");
      kwWrap.classList.add("hidden");
      selfGradeRow.classList.add("hidden");

      gradeNgBtn.className = "grade-btn";

        essayArea.classList.remove("hidden");
        oxArea.classList.add("hidden");
        essayInput.value = "";
        essayInput.disabled = false;
        checkEssayBtn.disabled = false;
        hintBtn.disabled = false;
      } else {
        essayArea.classList.add("hidden");
        oxArea.classList.remove("hidden");

        btnX.disabled = false;
        btnO.className = "ox-btn";
        btnX.className = "ox-btn";

    }

    hintBtn.addEventListener("click", () => {
      const q = activeQuestions[currentIndex];
      hintBox.textContent = "💡 ヒント： " + q.hint;
      hintBox.classList.add("visible");
    });

    function normalizeForCheck(str) {
      return (str || "")
        .replace(/\s+/g, "")
        .replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .toLowerCase();
    }

    let currentEssayResultRecorded = false;

    checkEssayBtn.addEventListener("click", () => {
      const q = activeQuestions[currentIndex];
      const userVal = normalizeForCheck(essayInput.value);
      const hasInput = userVal.length > 0;

      essayInput.disabled = true;
      checkEssayBtn.disabled = true;
      hintBtn.disabled = true;

      let hitCount = 0;
      kwList.innerHTML = "";

      q.keywords.forEach(kw => {
        const matched = hasInput && kw.match.some(m => userVal.includes(normalizeForCheck(m)));
        if (matched) hitCount++;

        const chip = document.createElement("span");
        if (!hasInput) {
          chip.className = "kw-chip neutral";
          chip.textContent = `🔑 ${kw.label}`;
        } else if (matched) {
          chip.className = "kw-chip hit";
          chip.textContent = `✓ ${kw.label}`;
        } else {
          chip.className = "kw-chip miss";
          chip.textContent = `✗ ${kw.label}`;
        }
        kwList.appendChild(chip);
      });

      const totalKw = q.keywords.length;
      let autoCorrect = false;

      if (!hasInput) {
        feedbackBox.className = "feedback visible is-neutral";
        feedbackTitle.textContent = "📖 模範解答と必須キーワード";
      } else if (hitCount === totalKw) {
        feedbackBox.className = "feedback visible is-correct";
        feedbackTitle.textContent = `○ すばらしい！必須キーワードをすべて含んでいます（${hitCount}/${totalKw}）`;
        autoCorrect = true;
      } else if (hitCount > 0) {
        feedbackBox.className = "feedback visible is-partial";
        feedbackTitle.textContent = `△ おしい！あと少し（キーワード ${hitCount}/${totalKw} 一致）`;
      } else {
        feedbackBox.className = "feedback visible is-wrong";
        feedbackTitle.textContent = `✕ キーワードが抜けています（0/${totalKw} 一致）`;
      }

      modelAnswerWrap.classList.remove("hidden");
      modelAnswerText.textContent = q.modelAnswer;
      kwWrap.classList.remove("hidden");
      explainText.textContent = q.explanation;

      selfGradeRow.classList.remove("hidden");
      currentEssayResultRecorded = true;

      // 初期の記録（あとで自己採点ボタンで切り替え可能）
      const entry = { q, isCorrect: autoCorrect };
      results.push(entry);
      if (autoCorrect) {
        score++;
        gradeOkBtn.classList.add("active-ok");
      } else {
        gradeNgBtn.classList.add("active-ng");
      }
      scoreLive.textContent = `現在の正解: ${score}`;

      nextBtn.classList.remove("hidden");
      nextBtn.textContent = currentIndex === activeQuestions.length - 1 ? "結果を見る →" : "次の問題へ →";
    });

    function setEssayGrade(isOk) {
      if (!currentEssayResultRecorded) return;
      const lastEntry = results[results.length - 1];
      if (lastEntry.isCorrect === isOk) return;

      lastEntry.isCorrect = isOk;
      score += isOk ? 1 : -1;
      scoreLive.textContent = `現在の正解: ${score}`;

      gradeOkBtn.className = isOk ? "grade-btn active-ok" : "grade-btn";
      gradeNgBtn.className = !isOk ? "grade-btn active-ng" : "grade-btn";
    }

    gradeOkBtn.addEventListener("click", () => setEssayGrade(true));
    gradeNgBtn.addEventListener("click", () => setEssayGrade(false));

    function handleOxChoice(userChoice) {
      const q = activeQuestions[currentIndex];
      const isCorrect = (userChoice === q.answer);

      btnO.disabled = true;
      btnX.disabled = true;

      const selectedBtn = userChoice ? btnO : btnX;
      const correctBtn = q.answer ? btnO : btnX;

      if (isCorrect) {
        selectedBtn.classList.add("selected-correct");
        feedbackBox.className = "feedback visible is-correct";
        feedbackTitle.textContent = `○ 正解！（答え：${q.answer ? "○ 正しい" : "× まちがい"}）`;
        score++;
      } else {
        selectedBtn.classList.add("selected-wrong");
        correctBtn.classList.add("show-answer");
        feedbackBox.className = "feedback visible is-wrong";
        feedbackTitle.textContent = `✕ まちがい！（正解は：${q.answer ? "○ 正しい" : "× まちがい"}）`;
      }

      results.push({ q, isCorrect });
      scoreLive.textContent = `現在の正解: ${score}`;

      explainText.textContent = q.explanation;
      if (q.contrast) {
        contrastBox.textContent = q.contrast;
        contrastBox.classList.remove("hidden");
      }

      nextBtn.classList.remove("hidden");
      nextBtn.textContent = currentIndex === activeQuestions.length - 1 ? "結果を見る →" : "次の問題へ →";
    }

    btnO.addEventListener("click", () => handleOxChoice(true));
    btnX.addEventListener("click", () => handleOxChoice(false));

    nextBtn.addEventListener("click", () => {
      currentEssayResultRecorded = false;
      currentIndex++;
      if (currentIndex < activeQuestions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    });

    function showResults() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const total = results.length;
      const pct = Math.round((score / total) * 100);
      finalScore.textContent = `${score} / ${total}（${pct}%）`;

      if (pct === 100) {
        finalComment.textContent = "全問クリア！記述のキーワードもひっかけ問題も完璧です。";
      } else if (pct >= 80) {
        finalComment.textContent = "よくできました！間違えた問題・要復習だけもう一度確認すればバッチリです。";
      } else if (pct >= 60) {
        finalComment.textContent = "あと一歩！記述の必須キーワードと、逆になりやすい用語ペアを復習しよう。";
      } else {
        finalComment.textContent = "まずは解説の対比ポイントとキーワードを声に出して確認しながら解き直してみよう！";
      }

      // 形式別・単元別の集計
      const groups = {};
      results.forEach(r => {
        const key = r.q.type === "essay" ? "📝 短文記述" : "⚡ ○×ひっかけ問題";
        if (!groups[key]) groups[key] = { ok: 0, total: 0 };
        groups[key].total++;
        if (r.isCorrect) groups[key].ok++;
      });

      breakdownList.innerHTML = "";
      Object.entries(groups).forEach(([name, stat]) => {
        const div = document.createElement("div");
        div.className = "breakdown-item";
        div.innerHTML = `<span>${name}</span><span>${stat.ok} / ${stat.total} 問正解</span>`;
        breakdownList.appendChild(div);
      });

      const wrongList = results.filter(r => !r.isCorrect).map(r => r.q);
      if (wrongList.length > 0) {
        retryWrongBtn.classList.remove("hidden");
        retryWrongBtn.textContent = `間違えた・要復習の問題だけ解き直す（${wrongList.length}問）`;
        retryWrongBtn.onclick = () => startQuiz(wrongList);
      } else {
        retryWrongBtn.classList.add("hidden");
      }
    }

    startBtn.addEventListener("click", () => startQuiz());
    retryAllBtn.addEventListener("click", () => startQuiz());

    function backHome() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    }

    quitBtn.addEventListener("click", backHome);
    backHomeBtn.addEventListener("click", backHome);
  </script>
</body>
</html>
