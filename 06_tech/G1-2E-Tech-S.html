<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中1 技術科 2学期末テスト対策 4択クイズ（製図・木工）</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --correct: #16a34a;
      --correct-bg: #f0fdf4;
      --correct-border: #86efac;
      --wrong: #dc2626;
      --wrong-bg: #fef2f2;
      --wrong-border: #fca5a5;
      --accent: #0f766e;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding: 20px 16px 48px;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #ffffff;
      padding: 22px 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    header .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    header .tag {
      background: rgba(255, 255, 255, 0.18);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 22px;
      line-height: 1.35;
    }

    header p {
      margin: 0;
      font-size: 13.5px;
      opacity: 0.92;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 18px;
    }

    /* Setup / Start Screen */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin: 16px 0 20px;
    }

    .mode-btn {
      text-align: left;
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .mode-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .mode-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .mode-btn .mode-title {
      display: block;
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      margin-bottom: 3px;
    }

    .mode-btn .mode-desc {
      display: block;
      font-size: 12.5px;
      color: var(--muted);
    }

    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .toggle-label input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    /* Quiz Screen */
    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--muted);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #0ea5e9);
      width: 0%;
      transition: width 0.25s ease;
    }

    .q-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .q-category {
      display: inline-block;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12.5px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
    }

    .q-number {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    .q-text {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 16px;
      color: var(--text);
    }

    .q-diagram {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .q-diagram svg {
      max-width: 100%;
      height: auto;
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 15.5px;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .choice-btn:disabled {
      cursor: default;
    }

    .choice-label {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #f1f5f9;
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    .choice-btn.is-correct {
      background: var(--correct-bg);
      border-color: var(--correct);
    }

    .choice-btn.is-correct .choice-label {
      background: var(--correct);
      color: #ffffff;
    }

    .choice-btn.is-wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
    }

    .choice-btn.is-wrong .choice-label {
      background: var(--wrong);
      color: #ffffff;
    }

    .choice-btn.is-dimmed {
      opacity: 0.62;
    }

    /* Immediate Feedback Box */
    .feedback-box {
      margin-top: 18px;
      border-radius: 12px;
      padding: 16px 18px;
      border: 1.5px solid var(--border);
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
    }

    .feedback-box.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
    }

    .feedback-title {
      font-size: 16.5px;
      font-weight: 800;
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .feedback-box.correct .feedback-title {
      color: var(--correct);
    }

    .feedback-box.wrong .feedback-title {
      color: var(--wrong);
    }

    .feedback-explanation {
      margin: 0 0 10px;
      font-size: 14.5px;
      color: var(--text);
    }

    .feedback-point {
      font-size: 13px;
      background: rgba(255, 255, 255, 0.78);
      border-radius: 8px;
      padding: 8px 12px;
      color: #334155;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .quiz-footer {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Result Screen */
    .score-hero {
      text-align: center;
      padding: 18px 12px 22px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .score-num {
      font-size: 42px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.15;
    }

    .score-sub {
      font-size: 15px;
      color: var(--muted);
      margin-top: 6px;
    }

    .cat-breakdown {
      display: grid;
      gap: 10px;
      margin-bottom: 22px;
    }

    .cat-row {
      display: grid;
      grid-template-columns: 165px 1fr 64px;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
    }

    .cat-bar-bg {
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .cat-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
    }

    .review-list {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .review-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-left: 4px solid var(--wrong);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .review-item h4 {
      margin: 0 0 6px;
      font-size: 14.5px;
    }

    .review-item .ans-line {
      font-size: 13.5px;
      margin-bottom: 6px;
    }

    .review-item .exp-line {
      font-size: 13.5px;
      color: #334155;
      margin: 0;
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .card { padding: 18px 16px; }
      .q-text { font-size: 16.5px; }
      .cat-row { grid-template-columns: 125px 1fr 54px; font-size: 12.5px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge-row">
        <span class="tag">中学1年 技術科</span>
        <span class="tag">2学期末テスト対策</span>
        <span class="tag">1問1答・即解説</span>
      </div>
      <h1>製図と木工（けがき・切断）4択テスト</h1>
      <p>出題範囲（製図のルール／等角図／第三角法／けがき／切断）を網羅した確認テストです。1問ごとに答え合わせと解説が出ます。</p>
    </header>

    <!-- START SCREEN -->
    <section id="start-screen" class="card">
      <h2 style="margin:0 0 6px; font-size:18px;">出題範囲をえらぼう</h2>
      <p style="margin:0; font-size:14px; color:var(--muted);">テスト前は「全範囲（25問）」で一通りチェックするのがおすすめです。</p>

      <div class="mode-grid" id="mode-grid">
        <button type="button" class="mode-btn active" data-mode="all">
          <span class="mode-title">全範囲まとめて（25問）</span>
          <span class="mode-desc">製図から切断まで範囲すべてを網羅</span>
        </button>
        <button type="button" class="mode-btn" data-mode="製図のルール">
          <span class="mode-title">① 製図のルール・構想図と製作図（4問）</span>
          <span class="mode-desc">JIS・構想図・製作図・拡大図</span>
        </button>
        <button type="button" class="mode-btn" data-mode="等角図">
          <span class="mode-title">② 等角図のかき方（4問）</span>
          <span class="mode-desc">30°・割合・方眼紙での手順</span>
        </button>
        <button type="button" class="mode-btn" data-mode="第三角法">
          <span class="mode-title">③ 第三角法による正投影図（5問）</span>
          <span class="mode-desc">平面図・正面図・右側面図の配置</span>
        </button>
        <button type="button" class="mode-btn" data-mode="けがき">
          <span class="mode-title">④ 材料取り（けがき）の技能（7問）</span>
          <span class="mode-desc">さしがね・けびき・切りしろ4mm・節</span>
        </button>
        <button type="button" class="mode-btn" data-mode="切断">
          <span class="mode-title">⑤ 切断（のこぎりびき）の技能（5問）</span>
          <span class="mode-desc">クランプ・ひく力・刃わたり8割・切り終わり</span>
        </button>
      </div>

      <div class="options-row">
        <label class="toggle-label">
          <input type="checkbox" id="shuffle-questions" />
          問題の順番をシャッフルする
        </label>
        <button type="button" class="btn btn-primary" id="start-btn">テストを始める →</button>
      </div>
    </section>

    <!-- QUIZ SCREEN -->
    <section id="quiz-screen" class="card hidden">
      <div class="progress-header">
        <span id="progress-text">第 1 問 / 全 25 問</span>
        <span id="score-live">現在の正解数: 0</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>

      <div class="q-meta">
        <span class="q-category" id="q-category"></span>
        <span class="q-number" id="q-number"></span>
      </div>

      <h2 class="q-text" id="q-text"></h2>

      <div class="q-diagram hidden" id="q-diagram"></div>

      <div class="choices" id="choices"></div>

      <div class="feedback-box" id="feedback-box">
        <div class="feedback-title" id="feedback-title"></div>
        <p class="feedback-explanation" id="feedback-explanation"></p>
        <div class="feedback-point" id="feedback-point"></div>
      </div>

      <div class="quiz-footer">
        <button type="button" class="btn btn-outline" id="quit-btn">最初に戻る</button>
        <button type="button" class="btn btn-primary hidden" id="next-btn">次の問題へ →</button>
      </div>
    </section>

    <!-- RESULT SCREEN -->
    <section id="result-screen" class="card hidden">
      <div class="score-hero">
        <div class="score-num" id="final-score">0 / 25</div>
        <div class="score-sub" id="final-message"></div>
      </div>

      <h3 style="margin:0 0 12px; font-size:16px;">分野別の正解率</h3>
      <div class="cat-breakdown" id="cat-breakdown"></div>

      <div id="wrong-review-section" class="hidden">
        <h3 style="margin:20px 0 8px; font-size:16px;">間違えた問題の復習</h3>
        <div class="review-list" id="review-list"></div>
      </div>

      <div class="quiz-footer" style="margin-top:24px;">
        <button type="button" class="btn btn-secondary" id="back-home-btn">範囲選択に戻る</button>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button type="button" class="btn btn-outline hidden" id="retry-wrong-btn">間違えた問題だけ復習する</button>
          <button type="button" class="btn btn-primary" id="retry-all-btn">もう一度同じ範囲を解く</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const QUESTIONS = [
      // ① 製図のルール・構想図と製作図 (4問)
      {
        id: 1,
        category: "製図のルール",
        question: "設計者の考えが他の人に正しく伝わるように、日本で製図のルールを細かく決めている規格は何ですか。",
        choices: [
          "JIS（日本産業規格）",
          "ISO（国際標準化機構）",
          "JAS（日本農林規格）",
          "PSC（消費生活用製品安全法）"
        ],
        answer: 0,
        explanation: "日本では、設計者の考えが他の人に正しく伝わるように、JIS（日本産業規格）によって製図のルールが細かく決められています。",
        point: "読み方：ジス（JIS）。「日本産業規格」という漢字名もセットで覚えましょう。"
      },
      {
        id: 2,
        category: "製図のルール",
        question: "ものを設計して製図するとき、正しい順序はどれですか。",
        choices: [
          "アイデアスケッチ → 構想図 → 製作図",
          "アイデアスケッチ → 製作図 → 構想図",
          "構想図 → アイデアスケッチ → 製作図",
          "製作図 → 構想図 → アイデアスケッチ"
        ],
        answer: 0,
        explanation: "まずは大まかな「アイデアスケッチ」をかき、次にできあがりのイメージをまとめた「構想図」、最後に正確な形状・寸法を記入した「製作図」をかきます。",
        point: "アイデア → 構想（全体のイメージ） → 製作（正確な寸法）の3段階です。"
      },
      {
        id: 3,
        category: "製図のルール",
        question: "「構想図」にかく内容として、最も適切なものはどれですか。",
        choices: [
          "つくるものの全体の形、部品同士の位置関係、できあがりのイメージや寸法",
          "のこぎりの刃わたりの長さや、使用するクランプの種類",
          "完成したあとの木材の重さや、塗装の色見本だけ",
          "部品1つ1つの表面のざらつきや、木の年輪の模様"
        ],
        answer: 0,
        explanation: "構想図には、できあがりのイメージをかき表し、全体の形、部品同士の位置関係、説明事項、寸法などを記入します。",
        point: "構想図は「どんなものをつくるか」の全体イメージを伝える図面です。"
      },
      {
        id: 4,
        category: "製図のルール",
        question: "製作品の形状・寸法を正確に記入する「製作図」では、必要に応じて部品図のほかにどのような図をかくことがありますか。",
        choices: [
          "拡大図",
          "想像図",
          "感想図",
          "地図"
        ],
        answer: 0,
        explanation: "製作図には製作品の形状・寸法を正確に記入し、細かい部分が見えにくい場合など、必要に応じて部品図や「拡大図」もかきます。",
        point: "製作図は実際につくるための設計図なので、正確な寸法と、必要に応じた部品図・拡大図をかきます。"
      },

      // ② 等角図 (4問)
      {
        id: 5,
        category: "等角図",
        question: "等角図をかくとき、立体の底面の直角に交わる2辺は、水平線に対してそれぞれ何度傾けてかきますか。",
        diagram: "isometric",
        choices: [
          "30°",
          "45°",
          "60°",
          "90°"
        ],
        answer: 0,
        explanation: "等角図では、立体の底面の直角に交わる2辺を、水平線に対して左右それぞれ「30°」傾けてかきます。",
        point: "水平線に対して30°ずつ傾けるため、手前の角は 180° − 30° − 30° = 120° になります。"
      },
      {
        id: 6,
        category: "等角図",
        question: "等角図における「幅・奥行き・高さ」の割合（a：b：c）はどのようにしますか。",
        choices: [
          "実物と同じ（1：1：1）にする",
          "奥行きだけ半分（1：0.5：1）にする",
          "高さだけ2倍（1：1：2）にする",
          "幅と奥行きを2倍（2：2：1）にする"
        ],
        answer: 0,
        explanation: "等角図は、幅・奥行き・高さの割合を「実物と同じ（a：b：c ＝ 1：1：1）」にして表します。",
        point: "奥行きを短くしないのが等角図の特徴です。"
      },
      {
        id: 7,
        category: "等角図",
        question: "等角図の特長として、正しいものはどれですか。",
        choices: [
          "幅・奥行き・高さの割合を変えずに立体的に表すのに適している",
          "立体の裏側や内部の隠れた部分まで1つの図で正確に表せる",
          "水平線に対して45°の角度を使うため、奥行きが強調される",
          "正面から見た形だけを平面的に表すときに使われる"
        ],

        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    modeGrid.addEventListener("click", (e) => {
      const btn = e.target.closest(".mode-btn");
      if (!btn) return;
      document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      selectedMode = btn.dataset.mode;
    });

    function startQuiz(customList = null) {
      if (customList) {
        activeQuestions = [...customList];
      } else {
        const filtered = selectedMode === "all"
          ? [...QUESTIONS]
          : QUESTIONS.filter((q) => q.category === selectedMode);
        activeQuestions = shuffleCheckbox.checked ? shuffleArray(filtered) : filtered;
      }

      currentIndex = 0;
      score = 0;
      wrongItems = [];
      categoryStats = {};

      activeQuestions.forEach((q) => {
        if (!categoryStats[q.category]) {
          categoryStats[q.category] = { total: 0, correct: 0 };
        }
        categoryStats[q.category].total += 1;
      });

      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      renderQuestion();
    }

    function renderQuestion() {
      const q = activeQuestions[currentIndex];
      const total = activeQuestions.length;

      progressText.textContent = `第 ${currentIndex + 1} 問 / 全 ${total} 問`;
      scoreLive.textContent = `現在の正解数: ${score}`;
      progressBar.style.width = `${(currentIndex / total) * 100}%`;

      qCategory.textContent = q.category;
      qNumber.textContent = `Q${currentIndex + 1}`;
      qText.textContent = q.question;

      if (q.diagram && DIAGRAMS[q.diagram]) {
        qDiagram.innerHTML = DIAGRAMS[q.diagram];
        qDiagram.classList.remove("hidden");
      } else {
        qDiagram.innerHTML = "";
        qDiagram.classList.add("hidden");
      }

      // 選択肢をシャッフルして正解インデックスを追跡
      const indexedChoices = q.choices.map((text, idx) => ({
        text,
        isCorrect: idx === q.answer
      }));
      currentShuffledChoices = shuffleArray(indexedChoices);

      choicesEl.innerHTML = "";
      currentShuffledChoices.forEach((choice, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice-btn";
        btn.innerHTML = `
          <span class="choice-label">${LABELS[idx]}</span>
          <span>${choice.text}</span>
        `;
        btn.addEventListener("click", () => handleAnswer(idx));
        choicesEl.appendChild(btn);
      });

      feedbackBox.className = "feedback-box";
      nextBtn.classList.add("hidden");
      nextBtn.textContent = currentIndex + 1 === total ? "結果を見る →" : "次の問題へ →";
    }

    function handleAnswer(selectedIdx) {
      const q = activeQuestions[currentIndex];
      const buttons = choicesEl.querySelectorAll(".choice-btn");
      const chosen = currentShuffledChoices[selectedIdx];
      const correctIdx = currentShuffledChoices.findIndex((c) => c.isCorrect);

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === correctIdx) {
          btn.classList.add("is-correct");
        } else if (idx === selectedIdx && !chosen.isCorrect) {
          btn.classList.add("is-wrong");
        } else {
          btn.classList.add("is-dimmed");
        }
      });

      if (chosen.isCorrect) {
        score += 1;
        categoryStats[q.category].correct += 1;
        feedbackBox.className = "feedback-box show correct";
        feedbackTitle.textContent = "⭕ 正解！";
      } else {
        wrongItems.push({
          question: q,
          yourAnswer: chosen.text,
          correctAnswer: currentShuffledChoices[correctIdx].text
        });
        feedbackBox.className = "feedback-box show wrong";
        feedbackTitle.textContent = `❌ 不正解（正解は「${LABELS[correctIdx]}：${currentShuffledChoices[correctIdx].text}」）`;
      }

      scoreLive.textContent = `現在の正解数: ${score}`;
      progressBar.style.width = `${((currentIndex + 1) / activeQuestions.length) * 100}%`;

      feedbackExplanation.textContent = q.explanation;
      feedbackPoint.innerHTML = `<strong>テストのポイント：</strong>${q.point}`;
      nextBtn.classList.remove("hidden");
    }

    function showResult() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const total = activeQuestions.length;
      const pct = Math.round((score / total) * 100);
      finalScoreEl.textContent = `${score} / ${total} 問正解（${pct}%）`;

      if (pct === 100) {
        finalMessageEl.textContent = "パーフェクト！2学期末テストの準備はバッチリです！";
      } else if (pct >= 80) {
        finalMessageEl.textContent = "よくできました！間違えた問題を確認して満点を目指そう。";
      } else if (pct >= 60) {
        finalMessageEl.textContent = "あと少し！苦手な分野の解説を見直してみよう。";
      } else {
        finalMessageEl.textContent = "解説を読んでから、もう1回チャレンジしてみよう！";
      }

      catBreakdownEl.innerHTML = "";
      Object.entries(categoryStats).forEach(([cat, st]) => {
        const rate = Math.round((st.correct / st.total) * 100);
        const row = document.createElement("div");
        row.className = "cat-row";
        row.innerHTML = `
          <span><strong>${cat}</strong></span>
          <div class="cat-bar-bg">
            <div class="cat-bar-fill" style="width:${rate}%"></div>
          </div>
          <span style="text-align:right; font-weight:700;">${st.correct}/${st.total}</span>
        `;
        catBreakdownEl.appendChild(row);
      });

      if (wrongItems.length > 0) {
        wrongReviewSection.classList.remove("hidden");
        retryWrongBtn.classList.remove("hidden");
        reviewListEl.innerHTML = "";
        wrongItems.forEach((item) => {
          const div = document.createElement("div");
          div.className = "review-item";
          div.innerHTML = `
            <h4>【${item.question.category}】${item.question.question}</h4>
            <div class="ans-line">
              あなたの回答：<span style="color:var(--wrong); font-weight:700;">${item.yourAnswer}</span> ／
              正解：<span style="color:var(--correct); font-weight:700;">${item.correctAnswer}</span>
            </div>
            <p class="exp-line">${item.question.explanation}</p>
          `;
          reviewListEl.appendChild(div);
        });
      } else {
        wrongReviewSection.classList.add("hidden");
        retryWrongBtn.classList.add("hidden");
      }
    }

    startBtn.addEventListener("click", () => startQuiz());

    nextBtn.addEventListener("click", () => {
      currentIndex += 1;
      if (currentIndex < activeQuestions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    });

    quitBtn.addEventListener("click", () => {
      quizScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    });

    backHomeBtn.addEventListener("click", () => {
      resultScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    });

    retryAllBtn.addEventListener("click", () => startQuiz());

    retryWrongBtn.addEventListener("click", () => {
      const retryList = wrongItems.map((item) => item.question);
      startQuiz(retryList);
    });
  </script>
</body>
</html>
