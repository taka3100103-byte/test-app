<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中1 技術科 2学期末テスト対策 穴埋め・記述問題（製図・木工）</title>
  <style>
    :root {
      --bg: #f3f7f6;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #dbe4e2;
      --primary: #0f766e;
      --primary-hover: #0d5e58;
      --primary-soft: #f0fdfa;
      --correct: #16a34a;
      --correct-bg: #f0fdf4;
      --correct-border: #86efac;
      --wrong: #dc2626;
      --wrong-bg: #fef2f2;
      --wrong-border: #fca5a5;
      --warn: #d97706;
      --warn-bg: #fffbeb;
      --warn-border: #fde68a;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding: 20px 16px 56px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #115e59, #0f766e);
      color: #ffffff;
      padding: 22px 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    header .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    header .tag {
      background: rgba(255, 255, 255, 0.18);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 22px;
      line-height: 1.35;
    }

    header p {
      margin: 0;
      font-size: 13.5px;
      opacity: 0.92;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 18px;
    }

    /* Setup Screen */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 16px 0 20px;
    }

    .mode-btn {
      text-align: left;
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .mode-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .mode-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }

    .mode-btn .mode-title {
      display: block;
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      margin-bottom: 3px;
    }

    .mode-btn .mode-desc {
      display: block;
      font-size: 12.5px;
      color: var(--muted);
    }

    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .toggle-label input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #cbd5e1;
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover:not(:disabled) {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    /* Quiz Screen */
    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--muted);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #0f766e, #14b8a6);
      width: 0%;
      transition: width 0.25s ease;
    }

    .q-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .q-category {
      display: inline-block;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #99f6e4;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
    }

    .q-type-badge {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .q-text {
      font-size: 17.5px;
      font-weight: 700;
      margin: 0 0 16px;
      line-height: 1.75;
    }

    .blank-slot {
      display: inline-block;
      min-width: 90px;
      padding: 0 10px;
      margin: 0 4px;
      border-bottom: 2.5px solid var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 6px 6px 0 0;
      text-align: center;
      font-weight: 800;
    }

    .blank-slot.revealed-correct {
      border-bottom-color: var(--correct);
      background: var(--correct-bg);
      color: var(--correct);
    }

    .blank-slot.revealed-wrong {
      border-bottom-color: var(--wrong);
      background: var(--wrong-bg);
      color: var(--wrong);
    }

    .diagram-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin: 0 0 18px;
      text-align: center;
    }

    .diagram-box svg {
      max-width: 100%;
      height: auto;
    }

    .diagram-caption {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Input Area */
    .answer-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .answer-input {
      flex: 1 1 240px;
      padding: 13px 16px;
      font-size: 16px;
      font-family: inherit;
      font-weight: 600;
      border: 2px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .answer-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }

    .answer-input:disabled {
      background: #f8fafc;
      color: var(--text);
    }

    .unit-hint {
      display: inline-flex;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      padding: 0 4px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .hint-box {
      margin-top: 10px;
      padding: 10px 14px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      border-radius: 10px;
      font-size: 13.5px;
      color: #92400e;
      display: none;
    }

    .hint-box.show {
      display: block;
    }

    /* Explanation Box */
    .explanation {
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .explanation.show {
      display: block;
    }

    .explanation.is-correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
    }

    .explanation.is-wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
    }

    .explanation.is-check {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .exp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .exp-title {
      font-weight: 800;
      font-size: 16px;
    }

    .explanation.is-correct .exp-title {
      color: var(--correct);
    }

    .explanation.is-wrong .exp-title {
      color: var(--wrong);
    }

    .explanation.is-check .exp-title {
      color: var(--primary);
    }

    .correct-answer-banner {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .correct-answer-banner strong {
      color: var(--primary);
      font-size: 17px;
    }

    .kanji-note {
      margin-top: 6px;
      font-size: 13px;
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 6px 10px;
    }

    .exp-body {
      font-size: 14.5px;
      margin: 0;
    }

    .exp-point {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed rgba(0, 0, 0, 0.12);
      font-size: 13.5px;
      color: #334155;
    }

    .self-judge-row {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .self-judge-row span {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--muted);
    }

    .nav-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Result Screen */
    .score-hero {
      text-align: center;
      padding: 12px 0 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
    }

    .score-circle {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: var(--primary-soft);
      border: 6px solid var(--primary);
      margin-bottom: 10px;
    }

    .score-num {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.1;
    }

    .score-sub {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    .cat-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .cat-stat-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13.5px;
    }

    .cat-stat-item strong {
      display: block;
      margin-bottom: 2px;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .review-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13.5px;
      background: #ffffff;
    }

    .review-item.ok {
      border-left: 5px solid var(--correct);
    }

    .review-item.ng {
      border-left: 5px solid var(--wrong);
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      header h1 { font-size: 19px; }
      .card { padding: 18px 16px; }
      .q-text { font-size: 16px; }
      .btn { width: 100%; }
      .nav-footer .btn { width: auto; flex: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge-row">
        <span class="tag">中学1年 技術科</span>
        <span class="tag">2学期末テスト対策</span>
        <span class="tag">穴埋め・記述式（全28問）</span>
      </div>
      <h1>製図・木工 1問1答 穴埋めマスター</h1>
      <p>選択肢に頼らず「自分で答えを思い出す・書く」テスト本番向けのトレーニングです。</p>
    </header>

    <!-- START SCREEN -->
    <section id="start-screen" class="card">
      <h2 style="margin:0 0 6px; font-size:18px;">出題範囲を選んでスタート</h2>
      <p style="margin:0; font-size:13.5px; color:var(--muted);">
        漢字・カタカナ・数字を正確に入力する練習ができます。迷ったときは「ヒント」や「答えを見る」も使えます。
      </p>

      <div class="mode-grid" id="category-grid">
        <button type="button" class="mode-btn active" data-cat="all">
          <span class="mode-title">すべての範囲（全28問）</span>
          <span class="mode-desc">製図・等角図・正投影図・けがき・切断を完全網羅</span>
        </button>
        <button type="button" class="mode-btn" data-cat="製図のルール">
          <span class="mode-title">1. 製図のルール・構想図と製作図</span>
          <span class="mode-desc">JIS・構想図・製作図・拡大図（4問）</span>
        </button>
        <button type="button" class="mode-btn" data-cat="等角図と正投影図">
          <span class="mode-title">2. 等角図・第三角法（正投影図）</span>
          <span class="mode-desc">30°・実物・平面図・正面図・右側面図（9問）</span>
        </button>
        <button type="button" class="mode-btn" data-cat="材料取り（けがき）">
          <span class="mode-title">3. 材料取り（けがき）</span>
          <span class="mode-desc">さしがね・けびき・切りしろ・4mm・節（9問）</span>
        </button>
        <button type="button" class="mode-btn" data-cat="切断の技能">
          <span class="mode-title">4. 切断の技能</span>
          <span class="mode-desc">クランプ・あて木・刃わたり8割・水平（6問）</span>
        </button>
      </div>

      <div class="options-row">
        <label class="toggle-label">
          <input type="checkbox" id="shuffle-toggle" />
          問題の順番をシャッフルする
        </label>
        <button type="button" class="btn btn-primary" id="start-btn">テストを始める</button>
      </div>
    </section>

    <!-- QUIZ SCREEN -->
    <section id="quiz-screen" class="card hidden">
      <div class="progress-header">
        <span id="progress-text">第 1 問 / 28 問</span>
        <span id="score-live">正解数: 0</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>

      <div class="q-meta">
        <span class="q-category" id="q-category"></span>
        <span class="q-type-badge">記述・穴埋め</span>
      </div>

      <p class="q-text" id="q-text"></p>

      <div class="diagram-box hidden" id="diagram-box"></div>

      <form class="answer-form" id="answer-form" autocomplete="off">
        <div class="input-row">
          <input
            type="text"
            id="answer-input"
            class="answer-input"
            placeholder="ここに答えを入力してください"
            enterkeyhint="done"
          />
          <span class="unit-hint hidden" id="unit-hint"></span>
        </div>

        <div class="action-buttons" id="pre-answer-actions">
          <button type="submit" class="btn btn-primary" id="check-btn">答え合わせ</button>
          <button type="button" class="btn btn-outline" id="hint-btn">ヒントを見る</button>
          <button type="button" class="btn btn-secondary" id="reveal-btn">わからない（答えを見る）</button>
        </div>
      </form>

      <div class="hint-box" id="hint-box"></div>

      <div class="explanation" id="explanation-box">
        <div class="exp-header">
          <span class="exp-title" id="exp-title"></span>
        </div>
        <div class="correct-answer-banner" id="correct-answer-banner"></div>
        <div class="kanji-note hidden" id="kanji-note"></div>
        <p class="exp-body" id="exp-body"></p>
        <div class="exp-point" id="exp-point"></div>
      </div>

      <div class="nav-footer">
        <button type="button" class="btn btn-outline" id="quit-btn">最初に戻る</button>
        <button type="button" class="btn btn-primary hidden" id="next-btn">次の問題へ →</button>
      </div>
    </section>

    <!-- RESULT SCREEN -->
    <section id="result-screen" class="card hidden">
      <div class="score-hero">
        <div class="score-circle">
          <span class="score-num" id="final-score">0/0</span>
          <span class="score-sub" id="final-rate">0%</span>
        </div>
        <h2 style="margin:6px 0 4px; font-size:20px;" id="result-title">おつかれさまでした！</h2>
        <p style="margin:0; font-size:14px; color:var(--muted);" id="result-msg"></p>
      </div>

      <h3 style="margin:0 0 10px; font-size:16px;">単元別の結果</h3>
      <div class="cat-stats" id="cat-stats"></div>

      <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px;">
        <button type="button" class="btn btn-primary" id="retry-wrong-btn">間違えた問題だけ解き直す</button>
        <button type="button" class="btn btn-secondary" id="retry-all-btn">同じ範囲をもう一度</button>
        <button type="button" class="btn btn-outline" id="back-home-btn">範囲選択に戻る</button>
      </div>

      <h3 style="margin:0 0 6px; font-size:16px;">解答一覧（ふりかえり）</h3>
      <div class="review-list" id="review-list"></div>
    </section>
  </div>

  <script>
    const QUESTIONS = [
      // 1. 製図のルール・構想図と製作図
      {
        id: 1,
        cat: "製図のルール",
        q: "設計者の考えが他の人に正しく伝わるように、日本では [　　]（日本産業規格）によって製図のルールが細かく決められている。",
        answers: ["JIS", "ジス", "じす"],
        displayAnswer: "JIS（日本産業規格）",
        preferredKanji: "JIS",
        hint: "アルファベット3文字の規格名です。",
        exp: "日本では、製図のルールは「JIS（日本産業規格）」によって統一されており、誰が見ても同じように形や寸法を読み取れるようになっています。",
        point: "アルファベット大文字で「JIS」と書けるようにしておこう（読み：ジス）。"
      },
      {
        id: 2,
        cat: "製図のルール",
        q: "アイデアスケッチをもとに、できあがりのイメージをかき表し、全体の形・部品同士の位置関係・寸法などを記入する図を [　　] という。",
        answers: ["構想図", "こうそうず"],
        displayAnswer: "構想図",
        preferredKanji: "構想図",
        hint: "漢字3文字。「アイデアを『構想』してかく図」です。",
        exp: "アイデアスケッチから製図に進む際、最初にかくのが「構想図」です。完成イメージや部品同士の位置関係、説明事項などをまとめます。",
        point: "順番：アイデアスケッチ → 構想図 → 製作図"
      },
      {
        id: 3,
        cat: "製図のルール",
        q: "構想図をもとに、製作品の形状や寸法を正確に記入する図を [　　] という。",
        answers: ["製作図", "せいさくず"],
        displayAnswer: "製作図",
        preferredKanji: "製作図",
        hint: "漢字3文字。「実際に『製作』するために正確にかく図」です。",
        exp: "「製作図」は、ものをつくる（製作する）ために必要な正確な形状と寸法をすべて記入した図面です。",
        point: "「制作図」ではなく「製作図」（ものをつくる「製」）の漢字に注意！"
      },
      {
        id: 4,
        cat: "製図のルール",
        q: "製作図では、必要に応じて部品図や、細かい部分を大きく表した [　　] 図もかく。",
        answers: ["拡大", "かくだい", "拡大図", "かくだいず"],

    const diagramBox = document.getElementById("diagram-box");

    const answerForm = document.getElementById("answer-form");
    const answerInput = document.getElementById("answer-input");
    const unitHint = document.getElementById("unit-hint");
    const checkBtn = document.getElementById("check-btn");
    const hintBtn = document.getElementById("hint-btn");
    const revealBtn = document.getElementById("reveal-btn");
    const hintBox = document.getElementById("hint-box");

    const explanationBox = document.getElementById("explanation-box");
    const expTitle = document.getElementById("exp-title");
    const correctAnswerBanner = document.getElementById("correct-answer-banner");
    const kanjiNote = document.getElementById("kanji-note");
    const expBody = document.getElementById("exp-body");
    const expPoint = document.getElementById("exp-point");

    const quitBtn = document.getElementById("quit-btn");
    const nextBtn = document.getElementById("next-btn");

    const finalScore = document.getElementById("final-score");
    const finalRate = document.getElementById("final-rate");
    const resultTitle = document.getElementById("result-title");
    const resultMsg = document.getElementById("result-msg");
    const catStats = document.getElementById("cat-stats");
    const retryWrongBtn = document.getElementById("retry-wrong-btn");
    const retryAllBtn = document.getElementById("retry-all-btn");
    const backHomeBtn = document.getElementById("back-home-btn");
    const reviewList = document.getElementById("review-list");

    // Category Selection
    categoryGrid.addEventListener("click", (e) => {
      const btn = e.target.closest(".mode-btn");
      if (!btn) return;
      categoryGrid.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      selectedCategory = btn.dataset.cat;
    });

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function normalizeText(str) {
      if (!str) return "";
      return str
        .trim()
        .replace(/[Ａ-Ｚａ-ｚ０-９]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .replace(/\s+/g, "")
        .toLowerCase();
    }

    function startQuiz(questionPool) {
      let pool = questionPool;
      if (!pool) {
        pool = selectedCategory === "all"
          ? [...QUESTIONS]
          : QUESTIONS.filter((q) => q.cat === selectedCategory);
      }
      if (shuffleToggle.checked) {
        pool = shuffleArray(pool);
      }
      currentQuestions = pool;
      currentIndex = 0;
      results = [];

      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      renderQuestion();
    }

    startBtn.addEventListener("click", () => startQuiz());

    function renderQuestion() {
      answeredCurrent = false;
      const q = currentQuestions[currentIndex];
      const total = currentQuestions.length;
      const correctCount = results.filter((r) => r.isCorrect).length;

      progressText.textContent = `第 ${currentIndex + 1} 問 / ${total} 問`;
      scoreLive.textContent = `正解数: ${correctCount}`;
      progressFill.style.width = `${(currentIndex / total) * 100}%`;

      qCategory.textContent = q.cat;

      // Format blanks as visual slots
      const formattedQ = q.q.replace(/\[　　\]/g, '<span class="blank-slot" data-slot="true">　　</span>');
      qText.innerHTML = formattedQ;

      if (q.svg) {
        diagramBox.innerHTML = q.svg + (q.svgCaption ? `<div class="diagram-caption">${q.svgCaption}</div>` : "");
        diagramBox.classList.remove("hidden");
      } else {
        diagramBox.innerHTML = "";
        diagramBox.classList.add("hidden");
      }

      if (q.unit) {
        unitHint.textContent = q.unit;
        unitHint.classList.remove("hidden");
      } else {
        unitHint.textContent = "";
        unitHint.classList.add("hidden");
      }

      answerInput.value = "";
      answerInput.disabled = false;
      checkBtn.disabled = false;
      hintBtn.disabled = false;
      revealBtn.disabled = false;

      hintBox.classList.remove("show");
      hintBox.textContent = "";

      explanationBox.className = "explanation";
      kanjiNote.classList.add("hidden");
      kanjiNote.textContent = "";
      nextBtn.classList.add("hidden");

      setTimeout(() => answerInput.focus(), 50);
    }

    hintBtn.addEventListener("click", () => {
      const q = currentQuestions[currentIndex];
      hintBox.textContent = `💡 ヒント：${q.hint}`;
      hintBox.classList.add("show");
      answerInput.focus();
    });

    function finishQuestion(userRaw, isCorrect, isRevealedOnly) {
      if (answeredCurrent) return;
      answeredCurrent = true;

      const q = currentQuestions[currentIndex];
      answerInput.disabled = true;
      checkBtn.disabled = true;
      hintBtn.disabled = true;
      revealBtn.disabled = true;

      // Update blank slots in question text
      const slots = qText.querySelectorAll('[data-slot="true"]');
      slots.forEach((slot, idx) => {
        if (idx === 0) {
          slot.textContent = q.displayAnswer;
          slot.classList.add(isCorrect ? "revealed-correct" : "revealed-wrong");
        }
      });

      results.push({
        qObj: q,
        userRaw: userRaw,
        isCorrect: isCorrect,
        isRevealedOnly: isRevealedOnly
      });

      const correctCount = results.filter((r) => r.isCorrect).length;
      scoreLive.textContent = `正解数: ${correctCount}`;
      progressFill.style.width = `${((currentIndex + 1) / currentQuestions.length) * 100}%`;

      explanationBox.classList.remove("is-correct", "is-wrong", "is-check");
      if (isCorrect) {
        explanationBox.classList.add("show", "is-correct");
        expTitle.textContent = "⭕ 正解！";
      } else if (isRevealedOnly) {
        explanationBox.classList.add("show", "is-wrong");
        expTitle.textContent = "📖 解答と解説";
      } else {
        explanationBox.classList.add("show", "is-wrong");
        expTitle.textContent = `❌ 惜しい！（あなたの解答: ${userRaw || "未入力"}）`;
      }

      correctAnswerBanner.innerHTML = `正解：<strong>${q.displayAnswer}</strong>`;

      // Check if user answered in hiragana/alternative when kanji is preferred
      if (isCorrect && q.preferredKanji && normalizeText(userRaw) !== normalizeText(q.preferredKanji)) {
        kanjiNote.textContent = `✏️ テスト本番では漢字などで「${q.preferredKanji}」と書けるようにしよう！`;
        kanjiNote.classList.remove("hidden");
      } else {
        kanjiNote.classList.add("hidden");
      }

      expBody.textContent = q.exp;
      expPoint.innerHTML = `<strong>テストのポイント：</strong>${q.point}`;

      nextBtn.textContent = currentIndex === currentQuestions.length - 1 ? "結果を見る →" : "次の問題へ →";
      nextBtn.classList.remove("hidden");
      nextBtn.focus();
    }

    answerForm.addEventListener("submit", (e) => {
      e.preventDefault();
      if (answeredCurrent) return;

      const raw = answerInput.value.trim();
      if (!raw) {
        answerInput.focus();
        return;
      }

      const q = currentQuestions[currentIndex];
      const normInput = normalizeText(raw);
      const isCorrect = q.answers.some((ans) => normalizeText(ans) === normInput);

      finishQuestion(raw, isCorrect, false);
    });

    revealBtn.addEventListener("click", () => {
      if (answeredCurrent) return;
      finishQuestion("", false, true);
    });

    nextBtn.addEventListener("click", () => {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    });

    quitBtn.addEventListener("click", () => {
      quizScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    });

    function showResults() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const total = results.length;
      const correct = results.filter((r) => r.isCorrect).length;
      const rate = total > 0 ? Math.round((correct / total) * 100) : 0;

      finalScore.textContent = `${correct}/${total}`;
      finalRate.textContent = `${rate}%`;

      if (rate === 100) {
        resultTitle.textContent = "パーフェクト！全問正解です！";
        resultMsg.textContent = "用語も漢字もバッチリ書けています。本番でもこの調子で自信を持って挑みましょう！";
      } else if (rate >= 80) {
        resultTitle.textContent = "素晴らしい成績です！";
        resultMsg.textContent = "かなり定着しています。間違えた数問を解き直せば完璧です。";
      } else if (rate >= 60) {
        resultTitle.textContent = "あと一歩！基礎はできています";
        resultMsg.textContent = "惜しい問題やど忘れした用語を「間違えた問題だけ解き直す」で復習しよう。";
      } else {
        resultTitle.textContent = "ここから仕上げよう！";
        resultMsg.textContent = "まずは4択版で流れをつかみ、もう一度この穴埋めテストで用語を書く練習をすると効果的です。";
      }

      // Category stats
      const statsMap = {};
      results.forEach((r) => {
        const c = r.qObj.cat;
        if (!statsMap[c]) statsMap[c] = { total: 0, correct: 0 };
        statsMap[c].total++;
        if (r.isCorrect) statsMap[c].correct++;
      });

      catStats.innerHTML = "";
      Object.entries(statsMap).forEach(([cat, st]) => {
        const p = Math.round((st.correct / st.total) * 100);
        const div = document.createElement("div");
        div.className = "cat-stat-item";
        div.innerHTML = `<strong>${cat}</strong>${st.correct} / ${st.total} 問正解（${p}%）`;
        catStats.appendChild(div);
      });

      const wrongPool = results.filter((r) => !r.isCorrect).map((r) => r.qObj);
      if (wrongPool.length > 0) {
        retryWrongBtn.classList.remove("hidden");
        retryWrongBtn.textContent = `間違えた問題だけ解き直す（${wrongPool.length}問）`;
        retryWrongBtn.onclick = () => startQuiz(wrongPool);
      } else {
        retryWrongBtn.classList.add("hidden");
      }

      retryAllBtn.onclick = () => startQuiz(currentQuestions);
      backHomeBtn.onclick = () => {
        resultScreen.classList.add("hidden");
        startScreen.classList.remove("hidden");
      };

      reviewList.innerHTML = "";
      results.forEach((r, idx) => {
        const div = document.createElement("div");
        div.className = `review-item ${r.isCorrect ? "ok" : "ng"}`;
        const userAnsText = r.isRevealedOnly ? "（答えを見た）" : (r.userRaw || "未入力");
        div.innerHTML = `
          <div style="font-weight:700; margin-bottom:4px;">
            ${r.isCorrect ? "⭕" : "❌"} 第${idx + 1}問 [${r.qObj.cat}]
          </div>
          <div style="margin-bottom:4px;">${r.qObj.q.replace(/\[　　\]/g, `<strong>【${r.qObj.displayAnswer}】</strong>`)}</div>
          <div style="font-size:12.5px; color:var(--muted);">
            あなたの解答：${userAnsText} ／ 正解：<strong>${r.qObj.displayAnswer}</strong>
          </div>
        `;
        reviewList.appendChild(div);
      });
    }
  </script>
</body>
</html>
