<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中1 家庭科 2学期末テスト対策 フラッシュカード</title>
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --ok: #16a34a;
    --ok-bg: #f0fdf4;
    --ok-border: #86efac;
    --retry: #ea580c;
    --retry-bg: #fff7ed;
    --retry-border: #fdba74;
    --border: #e2e8f0;
    --shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    padding: 18px 14px 48px;
  }
  .container { max-width: 760px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 16px; }
  header h1 { font-size: 1.4rem; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
  header p { font-size: 0.88rem; color: var(--muted); }

  .controls-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }
  .ctrl-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ctrl-group label { font-size: 0.82rem; font-weight: 700; color: var(--muted); }
  select {
    font-family: inherit; font-size: 0.88rem; padding: 6px 10px;
    border-radius: 8px; border: 1px solid var(--border); background: #f8fafc; color: var(--text); cursor: pointer;
  }
  .btn-sm {
    font-family: inherit; font-size: 0.83rem; font-weight: 700; padding: 6px 11px;
    border-radius: 8px; border: 1px solid var(--border); background: #fff; color: var(--text);
    cursor: pointer; transition: all 0.15s;
  }
  .btn-sm:hover { background: #f1f5f9; }
  .btn-sm.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .progress-wrap { margin-bottom: 14px; }
  .progress-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.85rem; font-weight: 700; color: var(--muted); margin-bottom: 6px;
  }
  .stats-inline { display: flex; gap: 12px; }
  .stat-ok { color: var(--ok); }
  .stat-retry { color: var(--retry); }
  .progress-track { height: 9px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #3b82f6, #2563eb);
    border-radius: 999px; transition: width 0.25s ease; width: 0%;
  }

  /* Flashcard */
  .flashcard {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    min-height: 310px;
    padding: 22px 22px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    transition: transform 0.12s ease, border-color 0.2s ease;
    position: relative;
  }
  .flashcard:active { transform: scale(0.995); }
  .flashcard.flipped { border-color: #93c5fd; background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%); }

  .fc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 14px; }
  .badge {
    font-size: 0.76rem; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: var(--primary-light); color: var(--primary-dark);
  }
  .side-pill {
    font-size: 0.75rem; font-weight: 800; padding: 3px 9px; border-radius: 999px;
    background: #f1f5f9; color: #475569;
  }
  .flashcard.flipped .side-pill { background: #dbeafe; color: #1d4ed8; }

  .fc-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px 6px;
  }
  .fc-question {
    font-size: 1.22rem;
    font-weight: 800;
    color: #0f172a;
    line-height: 1.55;
  }
  .svg-box {
    margin-top: 14px;
    padding: 10px 18px;
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    border-radius: 10px;
  }
  .care-svg { height: 70px; width: auto; color: #0f172a; display: block; }

  .fc-answer-box { width: 100%; text-align: left; animation: fadeIn 0.18s ease; }
  .fc-q-mini {
    font-size: 0.85rem; color: var(--muted); margin-bottom: 10px;
    padding-bottom: 8px; border-bottom: 1px dashed var(--border);
  }
  .fc-answer-label { font-size: 0.78rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 4px; }
  .fc-answer {
    font-size: 1.18rem; font-weight: 800; color: #0f172a;
    background: #eff6ff; border-left: 4px solid var(--primary);
    padding: 10px 14px; border-radius: 8px; margin-bottom: 12px;
  }
  .fc-point {
    font-size: 0.92rem; color: #334155;
    background: #fffbeb; border: 1px solid #fde68a;
    padding: 10px 14px; border-radius: 8px;
  }
  .fc-point strong { color: #b45309; }

  .fc-foot {
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 14px;
  }

  .card-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }
  .btn-judge {
    font-family: inherit; font-size: 0.98rem; font-weight: 800;
    padding: 13px 16px; border-radius: 12px; border: 2px solid transparent;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-retry { background: var(--retry-bg); color: var(--retry); border-color: var(--retry-border); }
  .btn-retry:hover { background: #ffedd5; }
  .btn-ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
  .btn-ok:hover { background: #dcfce7; }

  .nav-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px; gap: 10px;
  }
  .btn-nav {
    font-family: inherit; font-size: 0.88rem; font-weight: 700;
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: #fff; color: var(--text); cursor: pointer;
  }
  .btn-nav:disabled { opacity: 0.4; cursor: default; }

  .hint-keys { text-align: center; margin-top: 12px; font-size: 0.78rem; color: var(--muted); }

  /* Summary */
  .summary-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 26px 22px; box-shadow: var(--shadow); text-align: center;
  }
  .summary-big { font-size: 2.1rem; font-weight: 900; color: var(--primary); margin-bottom: 6px; }
  .summary-msg { font-size: 1rem; font-weight: 700; margin-bottom: 18px; }
  .summary-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .btn-primary {
    font-family: inherit; font-size: 0.95rem; font-weight: 700; padding: 11px 20px;
    border-radius: 10px; border: none; background: var(--primary); color: #fff; cursor: pointer;
  }
  .btn-primary:hover { background: var(--primary-dark); }

  /* List View */
  .list-wrap { display: flex; flex-direction: column; gap: 10px; }
  .list-item {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
  }
  .list-item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .list-q { font-weight: 800; font-size: 0.98rem; color: #0f172a; margin-bottom: 6px; }
  .list-a { font-weight: 700; font-size: 0.95rem; color: var(--primary-dark); margin-bottom: 4px; }
  .list-p { font-size: 0.86rem; color: #475569; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 560px) {
    .flashcard { padding: 18px 16px; min-height: 280px; }
    .fc-question { font-size: 1.08rem; }
    .fc-answer { font-size: 1.04rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>中1 家庭科 2学期末テスト対策 フラッシュカード</h1>
    <p>全48枚｜表：用語を問う問題 ／ 裏：答え＆テストで狙われやすい一言ポイント</p>
  </header>

  <div class="controls-bar">
    <div class="ctrl-group">
      <label for="catSelect">分野:</label>

    </div>
    <div class="ctrl-group">
      <button class="btn-sm" id="shuffleBtn" type="button">シャッフル: OFF</button>
      <button class="btn-sm" id="modeBtn" type="button">一覧表示</button>
      <button class="btn-sm" id="restartBtn" type="button">最初から</button>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-meta">
      <span id="progressText">1 / 48</span>
      <span class="stats-inline">
        <span class="stat-ok" id="okText">○ 覚えた: 0</span>
        <span class="stat-retry" id="retryText">△ もう一度: 0</span>
      </span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <main id="mainArea"></main>
  <p class="hint-keys" id="hintKeys">操作: カードをクリック（または Space）で裏返す ／ [1] もう一度 ・ [2] 覚えた</p>
</div>

let state = {
  category: "すべて",
  shuffle: false,
  listView: false,
  pool: [],
  idx: 0,
  flipped: false,
  okIds: new Set(),
  retryIds: new Set()
};

const catSelect = document.getElementById("catSelect");
const shuffleBtn = document.getElementById("shuffleBtn");
const modeBtn = document.getElementById("modeBtn");
const restartBtn = document.getElementById("restartBtn");
const progressWrap = document.getElementById("progressWrap");
const progressText = document.getElementById("progressText");
const okText = document.getElementById("okText");
const retryText = document.getElementById("retryText");
const progressFill = document.getElementById("progressFill");
const mainArea = document.getElementById("mainArea");
const hintKeys = document.getElementById("hintKeys");

function initCategories() {
  const cats = ["すべて", ...new Set(ALL_CARDS.map(c => c.category))];
  catSelect.innerHTML = cats.map(c => {
    const n = c === "すべて" ? ALL_CARDS.length : ALL_CARDS.filter(x => x.category === c).length;
    return `<option value="${c}">${c}（${n}枚）</option>`;
  }).join("");
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startDeck(customPool = null) {
  let base = customPool
    ? customPool
    : (state.category === "すべて" ? ALL_CARDS : ALL_CARDS.filter(c => c.category === state.category));
  if (state.shuffle) base = shuffleArray(base);
  state.pool = base;
  state.idx = 0;
  state.flipped = false;
  if (!customPool) {
    state.okIds = new Set();
    state.retryIds = new Set();
  } else {
    customPool.forEach(c => state.retryIds.delete(c.id));
  }
  render();
}

function updateProgress() {
  const total = state.pool.length;
  const done = Math.min(state.idx, total);
  progressText.textContent = `${Math.min(state.idx + 1, total)} / ${total}`;
  okText.textContent = `○ 覚えた: ${state.okIds.size}`;
  retryText.textContent = `△ もう一度: ${state.retryIds.size}`;
  progressFill.style.width = `${total ? (done / total) * 100 : 0}%`;
}

function render() {
  if (state.listView) {
    progressWrap.style.display = "none";
    hintKeys.style.display = "none";
    renderList();
    return;
  }
  progressWrap.style.display = "block";
  hintKeys.style.display = "block";
  updateProgress();

  if (state.idx >= state.pool.length) {
    renderSummary();
    return;
  }

  const c = state.pool[state.idx];
  const svgHtml = c.svg ? `<div class="svg-box">${c.svg}</div>` : "";
  const bodyHtml = !state.flipped
    ? `<div class="fc-question">${c.front}</div>${svgHtml}`
    : `<div class="fc-answer-box">
         <div class="fc-q-mini">Q. ${c.front}</div>
         <div class="fc-answer-label">答え</div>
         <div class="fc-answer">${c.answer}</div>
         <div class="fc-point"><strong>★テストの一言ポイント：</strong>${c.point}</div>
       </div>`;

  mainArea.innerHTML = `
    <div class="flashcard ${state.flipped ? "flipped" : ""}" id="flashcard" tabindex="0">
      <div class="fc-top">
        <span class="badge">${c.category}</span>
        <span class="side-pill">${state.flipped ? "裏面（答え）" : "表面（問題）"}</span>
      </div>
      <div class="fc-body">${bodyHtml}</div>
      <div class="fc-foot">${state.flipped ? "クリックで表に戻す ／ 下のボタンで仕分け" : "タップ・クリックして答えを見る"}</div>
    </div>
    <div class="card-actions">
      <button class="btn-judge btn-retry" id="retryBtn" type="button">△ もう一度（苦手）</button>
      <button class="btn-judge btn-ok" id="okBtn" type="button">○ 覚えた！</button>
    </div>
    <div class="nav-row">
      <button class="btn-nav" id="prevBtn" type="button" ${state.idx === 0 ? "disabled" : ""}>← 前のカード</button>
      <button class="btn-nav" id="nextBtn" type="button">スキップして次へ →</button>
    </div>
  `;

  document.getElementById("flashcard").addEventListener("click", () => {
    state.flipped = !state.flipped;
    render();
  });
  document.getElementById("retryBtn").addEventListener("click", () => judge(false));
  document.getElementById("okBtn").addEventListener("click", () => judge(true));
  document.getElementById("prevBtn").addEventListener("click", () => {
    if (state.idx > 0) {
      state.idx--;
      state.flipped = false;
      render();
    }
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    state.idx++;
    state.flipped = false;
    render();
  });
}

function judge(isOk) {
  const c = state.pool[state.idx];
  if (isOk) {
    state.okIds.add(c.id);
    state.retryIds.delete(c.id);
  } else {
    state.retryIds.add(c.id);
    state.okIds.delete(c.id);
  }
  state.idx++;
  state.flipped = false;
  render();
}

function renderSummary() {
  progressFill.style.width = "100%";
  const retryPool = ALL_CARDS.filter(c => state.retryIds.has(c.id));
  const total = state.pool.length;
  const okCount = state.pool.filter(c => state.okIds.has(c.id)).length;
  const msg = retryPool.length === 0
    ? "すべて「覚えた！」になりました！テスト本番もバッチリです。"
    : `あと ${retryPool.length} 枚！「△ もう一度」のカードだけテンポよく復習しよう。`;

  const retryBtnHtml = retryPool.length > 0
    ? `<button class="btn-primary" id="retryDeckBtn" type="button">「もう一度」だけ復習する（${retryPool.length}枚）</button>`
    : "";

  mainArea.innerHTML = `
    <div class="summary-card">
      <div class="summary-big">${okCount} / ${total} 枚 覚えた！</div>
      <div class="summary-msg">${msg}</div>
      <div class="summary-actions">
        ${retryBtnHtml}
        <button class="btn-sm" id="resetDeckBtn" type="button" style="padding:11px 18px;font-size:0.92rem;">最初からやり直す</button>
      </div>
    </div>
  `;
  if (retryPool.length > 0) {
    document.getElementById("retryDeckBtn").addEventListener("click", () => startDeck(retryPool));
  }
  document.getElementById("resetDeckBtn").addEventListener("click", () => startDeck());
}

function renderList() {
  const items = state.pool.map((c, i) => `
    <div class="list-item">
      <div class="list-item-head">
        <span class="badge">${c.category}</span>
        <span style="font-size:0.8rem;color:var(--muted);font-weight:700;">#${i + 1}</span>
      </div>
      <div class="list-q">Q. ${c.front}</div>
      ${c.svg ? `<div class="svg-box" style="display:inline-block;margin:4px 0 8px;">${c.svg}</div>` : ""}
      <div class="list-a">A. ${c.answer}</div>
      <div class="list-p"><strong>★ポイント：</strong>${c.point}</div>
    </div>
  `).join("");
  mainArea.innerHTML = `<div class="list-wrap">${items}</div>`;
}

catSelect.addEventListener("change", () => {
  state.category = catSelect.value;
  startDeck();
});

shuffleBtn.addEventListener("click", () => {
  state.shuffle = !state.shuffle;
  shuffleBtn.textContent = `シャッフル: ${state.shuffle ? "ON" : "OFF"}`;
  shuffleBtn.classList.toggle("active", state.shuffle);
  startDeck();
});

modeBtn.addEventListener("click", () => {
  state.listView = !state.listView;
  modeBtn.textContent = state.listView ? "カード表示" : "一覧表示";
  modeBtn.classList.toggle("active", state.listView);
  render();
});

restartBtn.addEventListener("click", () => startDeck());

document.addEventListener("keydown", (e) => {
  if (state.listView || state.idx >= state.pool.length) return;
  if (e.code === "Space" || e.key === "Enter") {
    e.preventDefault();
    state.flipped = !state.flipped;
    render();
  } else if (e.key === "1") {
    judge(false);
  } else if (e.key === "2") {
    judge(true);
  }
});

initCategories();
startDeck();
</script>
