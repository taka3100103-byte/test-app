<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中1 家庭科 2学期末テスト 通し模擬テスト（35問・100点満点）</title>
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --primary: #1d4ed8;
    --primary-light: #eff6ff;
    --correct: #15803d;
    --correct-bg: #f0fdf4;
    --correct-border: #86efac;
    --wrong: #b91c1c;
    --wrong-bg: #fef2f2;
    --wrong-border: #fca5a5;
    --warn: #b45309;
    --warn-bg: #fffbeb;
    --border: #cbd5e1;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    padding-bottom: 64px;
  }
  .sticky-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(8px);
    border-bottom: 2px solid var(--border);
    box-shadow: 0 2px 12px rgba(15, 23, 42, 0.08);
    padding: 10px 16px;
  }
  .sticky-inner {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .exam-title-sm {
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--text);
  }
  .timer-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f8fafc;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 5px 14px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .timer-box.warn {
    background: var(--warn-bg);
    border-color: #f59e0b;
    color: var(--warn);
  }
  .timer-box.danger {
    background: var(--wrong-bg);
    border-color: #ef4444;
    color: var(--wrong);
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .timer-display { font-size: 1.15rem; }
  .btn-xs {
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }
  .btn-xs:hover { background: #e2e8f0; }
  .status-pill {
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--primary);
    background: var(--primary-light);
    padding: 5px 12px;
    border-radius: 999px;
  }
  .container {
    max-width: 880px;
    margin: 20px auto 0;
    padding: 0 14px;
  }
  .intro-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 18px;
  }
  .intro-card h1 {
    font-size: 1.35rem;
    margin-bottom: 6px;
  }
  .intro-meta {
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .nav-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .nav-dot {
    width: 32px;
    height: 30px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #f8fafc;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }
  .nav-dot.answered {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .nav-dot.res-ok {
    background: var(--correct);
    border-color: var(--correct);
    color: #fff;
  }
  .nav-dot.res-ng {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #fff;
  }
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 16px;
    scroll-margin-top: 76px;
  }
  .q-card.is-ok { border-left: 6px solid var(--correct); }
  .q-card.is-ng { border-left: 6px solid var(--wrong); }
  .q-top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .q-badges {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--primary-light);
    color: var(--primary);
  }
  .badge-type {
    background: #f1f5f9;
    color: #334155;
  }
  .q-pts {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
  }
  .q-text {
    font-size: 1.04rem;
    font-weight: 700;
    margin-bottom: 14px;
    white-space: pre-line;
  }
  .svg-box {
    display: flex;
    justify-content: center;
    background: #f8fafc;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 14px;
  }
  .care-svg { height: 72px; width: auto; color: #0f172a; }
  .choices-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .choice-label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.12s;
    font-size: 0.96rem;
  }
  .choice-label:hover { background: #f8fafc; border-color: #93c5fd; }
  .choice-label input { margin-top: 4px; accent-color: var(--primary); }
  .choice-label.selected { background: var(--primary-light); border-color: var(--primary); }
  .ox-row {
    display: flex;
    gap: 12px;
  }
  .ox-btn {
    flex: 1;
    padding: 12px;
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: 800;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    transition: all 0.12s;
  }
  .ox-btn:hover { background: #f8fafc; border-color: #93c5fd; }
  .ox-btn.selected { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
  .fill-input {
    width: 100%;
    max-width: 360px;
    font-family: inherit;
    font-size: 1rem;
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: 8px;
    outline: none;
  }
  .fill-input:focus { border-color: var(--primary); }
  .submit-area {
    text-align: center;
    margin: 28px 0;
  }
  .btn-submit {
    font-family: inherit;
    font-size: 1.12rem;
    font-weight: 800;
    padding: 15px 40px;
    border-radius: 12px;
    border: none;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(29, 78, 216, 0.3);
  }
  .btn-submit:hover { background: #1e40af; }
  .result-panel {
    background: var(--card);
    border: 2px solid var(--primary);
    border-radius: var(--radius);
    padding: 24px 22px;
    margin-bottom: 22px;
    display: none;
  }
  .result-panel.show { display: block; }
  .score-hero {
    text-align: center;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .score-num {
    font-size: 2.8rem;
    font-weight: 900;
    color: var(--primary);
    line-height: 1.15;
  }
  .score-sub {
    font-size: 1rem;
    font-weight: 700;
    color: var(--muted);
    margin-top: 4px;
  }
  .breakdown-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .bd-item {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.86rem;
  }
  .bd-bar-track {
    height: 7px;
    background: #e2e8f0;
    border-radius: 999px;
    margin-top: 6px;
    overflow: hidden;
  }
  .bd-bar-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 999px;
  }
  .res-controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .btn-filter {
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: #fff;
    cursor: pointer;
  }
  .btn-filter.active {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }
  .review-box {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.92rem;
  }
  .review-box.ok {
    background: var(--correct-bg);
    border: 1px solid var(--correct-border);
  }
  .review-box.ng {
    background: var(--wrong-bg);
    border: 1px solid var(--wrong-border);
  }
  .review-head {
    font-weight: 800;
    margin-bottom: 4px;
  }
  .review-box.ok .review-head { color: var(--correct); }
  .review-box.ng .review-head { color: var(--wrong); }
  @media (max-width: 600px) {
    .q-card { padding: 16px 14px; }
    .score-num { font-size: 2.2rem; }
  }
</style>
</head>
<body>
<div class="sticky-bar">
  <div class="sticky-inner">
    <div class="exam-title-sm">中1 家庭科 2学期末 通し模擬テスト</div>
    <div class="timer-box" id="timerBox">
      <span>⏱ 残り時間</span>
      <span class="timer-display" id="timerDisplay">25:00</span>
      <button type="button" class="btn-xs" id="pauseBtn">一時停止</button>
    </div>
    <div class="status-pill" id="answeredCount">解答済み: 0 / 35</div>
  </div>
</div>

<div class="container">
  <section class="intro-card">
    <h1>中1 家庭科 2学期末テスト 通し模擬テスト</h1>
    <p class="intro-meta">全35問（100点満点）／ 制限時間 25分 ／ 解答中はヒント・解説は出ません。全問解答後に「採点する」を押してください。</p>
    <div class="nav-grid" id="navGrid"></div>
  </section>

  <section class="result-panel" id="resultPanel">
    <div class="score-hero">
      <div class="score-num" id="scoreNum">0 / 100 点</div>
      <div class="score-sub" id="scoreSub"></div>
    </div>
    <h3 style="font-size:0.95rem;margin-bottom:10px;">単元別の正答率</h3>
    <div class="breakdown-grid" id="breakdownGrid"></div>
    <div class="res-controls">
      <button type="button" class="btn-filter active" id="showAllBtn">全問を表示（35問）</button>
      <button type="button" class="btn-filter" id="showWrongBtn">間違えた問題のみ表示</button>
      <button type="button" class="btn-filter" id="retryBtn">最初からやり直す</button>
    </div>
  </section>

  <form id="examForm">
    <div id="questionsContainer"></div>
    <div class="submit-area" id="submitArea">
      <button type="button" class="btn-submit" id="gradeBtn">採点する（全35問）</button>
    </div>
  </form>
</div>

const LABELS = ["ア", "イ", "ウ", "エ"];
const TYPE_NAME = { choice: "選択式", fill: "穴埋め", ox: "○×問題" };

let userAnswers = {};
let graded = false;
let totalSeconds = 25 * 60;
let remainingSeconds = totalSeconds;
let timerPaused = false;
let timerInterval = null;

const timerBox = document.getElementById("timerBox");
const timerDisplay = document.getElementById("timerDisplay");
const pauseBtn = document.getElementById("pauseBtn");
const answeredCount = document.getElementById("answeredCount");
const navGrid = document.getElementById("navGrid");
const questionsContainer = document.getElementById("questionsContainer");
const gradeBtn = document.getElementById("gradeBtn");
const submitArea = document.getElementById("submitArea");
const resultPanel = document.getElementById("resultPanel");

function normalizeText(s) {
  return (s || "")
    .trim()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/\s+/g, "")
    .toLowerCase();
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (timerPaused || graded) return;
    remainingSeconds--;
    timerDisplay.textContent = formatTime(Math.max(0, remainingSeconds));
    timerBox.classList.remove("warn", "danger");
    if (remainingSeconds <= 60) timerBox.classList.add("danger");
    else if (remainingSeconds <= 300) timerBox.classList.add("warn");

    if (remainingSeconds <= 0) {
      clearInterval(timerInterval);
      alert("25分が経過しました！テストを終了して採点します。");
      gradeExam(true);
    }
  }, 1000);
}

pauseBtn.addEventListener("click", () => {
  if (graded) return;
  timerPaused = !timerPaused;
  pauseBtn.textContent = timerPaused ? "再開" : "一時停止";
});

function updateProgress() {
  const count = QUESTIONS.filter(q => {
    const val = userAnswers[q.id];
    if (q.type === "fill") return typeof val === "string" && val.trim().length > 0;
    return val !== undefined && val !== null;
  }).length;
  answeredCount.textContent = `解答済み: ${count} / ${QUESTIONS.length}`;
  QUESTIONS.forEach(q => {
    const dot = document.getElementById(`nav-${q.id}`);
    const val = userAnswers[q.id];
    const hasAns = q.type === "fill" ? (typeof val === "string" && val.trim().length > 0) : (val !== undefined && val !== null);
    dot.classList.toggle("answered", hasAns && !graded);
  });
}

function renderExam() {
  navGrid.innerHTML = QUESTIONS.map(q =>
    `<a href="#q-${q.id}" class="nav-dot" id="nav-${q.id}">${q.id}</a>`
  ).join("");

  questionsContainer.innerHTML = QUESTIONS.map(q => {
    const svgHtml = q.svg ? `<div class="svg-box">${q.svg}</div>` : "";
    let inputHtml = "";
    if (q.type === "choice") {
      inputHtml = `<div class="choices-list">` + q.choices.map((c, idx) => `
        <label class="choice-label" id="lbl-${q.id}-${idx}">
          <input type="radio" name="q-${q.id}" value="${idx}">
          <span><strong>${LABELS[idx]}.</strong> ${c}</span>
        </label>
      `).join("") + `</div>`;
    } else if (q.type === "ox") {
      inputHtml = `
        <div class="ox-row">
          <button type="button" class="ox-btn" data-qid="${q.id}" data-val="true">○（正しい）</button>
          <button type="button" class="ox-btn" data-qid="${q.id}" data-val="false">×（誤り）</button>
        </div>
      `;
    } else {
      inputHtml = `<input type="text" class="fill-input" id="fill-${q.id}" placeholder="答えを入力してください" autocomplete="off">`;
    }

    return `
      <article class="q-card" id="q-${q.id}">
        <div class="q-top">
          <div class="q-badges">
            <span class="badge">問${q.id}</span>
            <span class="badge">${q.category}</span>
            <span class="badge badge-type">${TYPE_NAME[q.type]}</span>
          </div>
          <span class="q-pts">配点 ${q.points}点</span>
        </div>
        <div class="q-text">${q.question}</div>
        ${svgHtml}
        ${inputHtml}
        <div id="review-${q.id}"></div>
      </article>
    `;
  }).join("");

  // Event listeners
  QUESTIONS.forEach(q => {
    if (q.type === "choice") {
      document.querySelectorAll(`input[name="q-${q.id}"]`).forEach(radio => {
        radio.addEventListener("change", (e) => {
          if (graded) return;
          const val = Number(e.target.value);
          userAnswers[q.id] = val;
          q.choices.forEach((_, i) => {
            document.getElementById(`lbl-${q.id}-${i}`).classList.toggle("selected", i === val);
          });
          updateProgress();
        });
      });
    } else if (q.type === "ox") {
      document.querySelectorAll(`.ox-btn[data-qid="${q.id}"]`).forEach(btn => {
        btn.addEventListener("click", () => {
          if (graded) return;
          const val = btn.dataset.val === "true";
          userAnswers[q.id] = val;
          document.querySelectorAll(`.ox-btn[data-qid="${q.id}"]`).forEach(b => {
            b.classList.toggle("selected", (b.dataset.val === "true") === val);
          });
          updateProgress();
        });
      });
    } else {
      const inp = document.getElementById(`fill-${q.id}`);
      inp.addEventListener("input", () => {
        if (graded) return;
        userAnswers[q.id] = inp.value;
        updateProgress();
      });
    }
  });
}

function checkCorrect(q) {
  const val = userAnswers[q.id];
  if (q.type === "choice") return val === q.answer;
  if (q.type === "ox") return val === q.answer;
  const norm = normalizeText(val);
  if (!norm) return false;
  return q.accepts.some(a => normalizeText(a) === norm);
}

function formatUserAnswer(q) {
  const val = userAnswers[q.id];
  if (q.type === "choice") return val !== undefined ? `${LABELS[val]}. ${q.choices[val]}` : "（未解答）";
  if (q.type === "ox") return val === true ? "○" : val === false ? "×" : "（未解答）";
  return val && val.trim() ? val.trim() : "（未解答）";
}

function formatCorrectAnswer(q) {
  if (q.type === "choice") return `${LABELS[q.answer]}. ${q.choices[q.answer]}`;
  if (q.type === "ox") return q.answer ? "○（正しい）" : "×（誤り）";
  return q.answer;
}

function gradeExam(auto = false) {
  if (graded) return;
  const unanswered = QUESTIONS.filter(q => {
    const val = userAnswers[q.id];
    if (q.type === "fill") return !val || !val.trim();
    return val === undefined || val === null;
  }).length;

  if (!auto && unanswered > 0) {
    if (!confirm(`未解答の問題が ${unanswered} 問あります。このまま採点しますか？`)) {
      return;
    }
  }

  graded = true;
  clearInterval(timerInterval);
  pauseBtn.disabled = true;
  submitArea.style.display = "none";

  // Disable inputs
  document.querySelectorAll("#examForm input, #examForm button.ox-btn").forEach(el => {
    el.disabled = true;
  });

  let earnedPoints = 0;
  let correctCount = 0;
  const catStats = {};

  QUESTIONS.forEach(q => {
    if (!catStats[q.category]) catStats[q.category] = { ok: 0, total: 0, pts: 0, maxPts: 0 };
    catStats[q.category].total++;
    catStats[q.category].maxPts += q.points;

    const ok = checkCorrect(q);
    if (ok) {
      earnedPoints += q.points;
      correctCount++;
      catStats[q.category].ok++;
      catStats[q.category].pts += q.points;
    }

    const card = document.getElementById(`q-${q.id}`);
    card.classList.add(ok ? "is-ok" : "is-ng");
    card.dataset.ok = ok ? "1" : "0";

    const dot = document.getElementById(`nav-${q.id}`);
    dot.classList.remove("answered");
    dot.classList.add(ok ? "res-ok" : "res-ng");

    const rev = document.getElementById(`review-${q.id}`);
    rev.innerHTML = `
      <div class="review-box ${ok ? "ok" : "ng"}">
        <div class="review-head">${ok ? `○ 正解（+${q.points}点）` : "× 不正解（0点）"}</div>
        <div><strong>あなたの解答：</strong>${formatUserAnswer(q)} ／ <strong>正解：</strong>${formatCorrectAnswer(q)}</div>
        <div style="margin-top:6px;"><strong>解説：</strong>${q.explanation}</div>
      </div>
    `;
  });

  const elapsed = totalSeconds - remainingSeconds;
  document.getElementById("scoreNum").textContent = `${earnedPoints} / 100 点`;
  document.getElementById("scoreSub").textContent = `正解数：${correctCount} / ${QUESTIONS.length} 問 ／ 所要時間：${formatTime(elapsed)}`;

  document.getElementById("breakdownGrid").innerHTML = Object.entries(catStats).map(([cat, st]) => {
    const pct = Math.round((st.ok / st.total) * 100);
    return `
      <div class="bd-item">
        <strong>${cat}</strong>
        <div>${st.ok} / ${st.total} 問正解（${pct}%）｜ ${st.pts}/${st.maxPts}点</div>
        <div class="bd-bar-track"><div class="bd-bar-fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join("");

  resultPanel.classList.add("show");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

gradeBtn.addEventListener("click", () => gradeExam(false));

document.getElementById("showAllBtn").addEventListener("click", (e) => {
  document.getElementById("showAllBtn").classList.add("active");
  document.getElementById("showWrongBtn").classList.remove("active");
  document.querySelectorAll(".q-card").forEach(c => c.style.display = "block");
});

document.getElementById("showWrongBtn").addEventListener("click", () => {
  document.getElementById("showWrongBtn").classList.add("active");
  document.getElementById("showAllBtn").classList.remove("active");
  document.querySelectorAll(".q-card").forEach(c => {
    c.style.display = c.dataset.ok === "0" ? "block" : "none";
  });
});

document.getElementById("retryBtn").addEventListener("click", () => {
  location.reload();
});

renderExam();
updateProgress();
startTimer();
</script>
</body>
</html>
