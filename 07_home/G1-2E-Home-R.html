<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中1 家庭科 2学期末テスト対策 記述＆○×ひっかけ対策</title>
<style>
  :root {
    --bg: #f5f3ff;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --primary: #6d28d9;
    --primary-dark: #5b21b6;
    --primary-light: #ede9fe;
    --accent: #d97706;
    --accent-bg: #fef3c7;
    --accent-border: #fcd34d;
    --correct: #15803d;
    --correct-bg: #f0fdf4;
    --correct-border: #86efac;
    --wrong: #dc2626;
    --wrong-bg: #fef2f2;
    --wrong-border: #fca5a5;
    --border: #e2e8f0;
    --shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    min-height: 100vh;
    padding: 20px 14px 48px;
  }
  .container { max-width: 800px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 18px; }
  header h1 {
    font-size: 1.4rem;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 4px;
  }
  header p { font-size: 0.9rem; color: var(--muted); }

  .controls-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-group label {
    font-size: 0.84rem;
    font-weight: 700;
    color: var(--muted);
  }
  select {
    font-family: inherit;
    font-size: 0.88rem;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #f8fafc;
    color: var(--text);
    cursor: pointer;
  }
  .btn-sm {
    font-family: inherit;
    font-size: 0.84rem;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-sm:hover { background: #f1f5f9; }
  .btn-sm.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .progress-wrap { margin-bottom: 16px; }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .progress-track {
    height: 10px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #8b5cf6, #6d28d9);
    border-radius: 999px;
    transition: width 0.3s ease;
    width: 0%;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 22px;
    box-shadow: var(--shadow);
  }
  .q-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .badges-left {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--primary-light);
    color: var(--primary-dark);
  }
  .badge-type-essay {
    background: #fef3c7;
    color: #b45309;
    border: 1px solid #fde68a;
  }
  .badge-type-ox {
    background: #e0f2fe;
    color: #0369a1;
    border: 1px solid #bae6fd;
  }
  .badge-important {
    background: #fee2e2;
    color: #b91c1c;
    border: 1px solid #fecaca;
  }
  .badge-contrast {
    background: #f1f5f9;
    color: #334155;
    border: 1px solid #cbd5e1;
  }
  .q-num { font-size: 0.85rem; font-weight: 700; color: var(--muted); }

  .q-text {
    font-size: 1.1rem;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 16px;
  }
  .svg-box {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 18px;
  }
  .care-svg { height: 76px; width: auto; color: #0f172a; }

  /* Essay input area */
  .essay-area {
    width: 100%;
    min-height: 96px;
    font-family: inherit;
    font-size: 0.98rem;
    line-height: 1.6;
    padding: 12px 14px;
    border: 2px solid var(--border);
    border-radius: 10px;
    resize: vertical;
    transition: border-color 0.15s;
    background: #fff;
    color: var(--text);
  }
  .essay-area:focus {
    outline: none;
    border-color: var(--primary);
  }
  .essay-actions {
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .essay-tip {
    font-size: 0.82rem;
    color: var(--muted);
  }

  /* OX buttons */
  .ox-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .ox-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px 12px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: #fff;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .ox-btn:hover:not(:disabled) {
    border-color: #a78bfa;
    background: #faf5ff;
  }
  .ox-btn:disabled { cursor: default; }
  .ox-symbol {
    font-size: 2.1rem;
    font-weight: 900;
    line-height: 1.1;
  }
  .ox-btn[data-val="true"] .ox-symbol { color: #2563eb; }
  .ox-btn[data-val="false"] .ox-symbol { color: #dc2626; }
  .ox-sub {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    margin-top: 4px;
  }
  .ox-btn.correct {
    border-color: var(--correct);
    background: var(--correct-bg);
  }
  .ox-btn.wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
  }

  /* Feedback box */
  .feedback {
    margin-top: 20px;
    padding: 18px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #f8fafc;
    display: none;
    animation: fadeIn 0.2s ease;
  }
  .feedback.show { display: block; }
  .feedback.is-correct {
    background: var(--correct-bg);
    border-color: var(--correct-border);
  }
  .feedback.is-wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong-border);
  }
  .feedback-title {
    font-size: 1.05rem;
    font-weight: 800;
    margin-bottom: 10px;
  }
  .feedback.is-correct .feedback-title { color: var(--correct); }
  .feedback.is-wrong .feedback-title { color: var(--wrong); }

  .model-answer-box {
    background: #fff;
    border: 1px solid #cbd5e1;
    border-left: 4px solid var(--primary);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .box-label {
    font-size: 0.78rem;
    font-weight: 800;
    color: var(--primary-dark);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .model-answer-text {
    font-size: 0.96rem;
    font-weight: 700;
    color: #0f172a;
  }

  .kw-box {
    background: #fffbeb;
    border: 1px solid var(--accent-border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .kw-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .kw-title {
    font-size: 0.82rem;
    font-weight: 800;
    color: #b45309;
  }
  .kw-match-count {
    font-size: 0.8rem;
    font-weight: 700;
    color: #0f172a;
  }
  .kw-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 6px;
  }
  .kw-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.84rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
    background: #fff;
    border: 1px solid #f59e0b;
    color: #92400e;
  }
  .kw-tag.hit {
    background: #dcfce7;
    border-color: #22c55e;
    color: #166534;
  }
  .kw-note {
    font-size: 0.84rem;
    color: #78350f;
  }

  .feedback-exp {
    font-size: 0.93rem;
    color: #1e293b;
  }

  .self-grade-wrap {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed #cbd5e1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .self-grade-label {
    font-size: 0.88rem;
    font-weight: 700;
    color: #334155;
  }
  .self-grade-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn-ok {
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid #22c55e;
    background: #16a34a;
    color: #fff;
    cursor: pointer;
  }
  .btn-ok:hover { background: #15803d; }
  .btn-ng {
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid #fca5a5;
    background: #fff;
    color: #dc2626;
    cursor: pointer;
  }
  .btn-ng:hover { background: #fef2f2; }

  .actions {
    margin-top: 16px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .btn-primary {
    font-family: inherit;
    font-size: 0.96rem;
    font-weight: 700;
    padding: 11px 22px;
    border-radius: 10px;
    border: none;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--primary-dark); }

  .summary-score {
    text-align: center;
    padding: 18px 0 22px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .score-big {
    font-size: 2.3rem;
    font-weight: 900;
    color: var(--primary);
    line-height: 1.2;
  }
  .score-msg {
    font-size: 1.02rem;
    font-weight: 700;
    margin-top: 6px;
  }
  .cat-breakdown {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 10px;
    margin-bottom: 22px;
  }
  .cat-item {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.88rem;
  }
  .cat-item strong { display: block; color: #0f172a; margin-bottom: 2px; }
  .summary-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  .hint-keys {
    text-align: center;
    margin-top: 14px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 560px) {
    .card { padding: 18px 15px; }
    .q-text { font-size: 1.02rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>中1 家庭科 2学期末テスト対策【記述＆○×ひっかけ】</h1>
    <p>理由・仕組みの短文記述（必須キーワード判定つき）＋ 紛らわしい用語対比の○×対策</p>
  </header>

  <div class="controls-bar">
    <div class="filter-group">
      <label for="typeSelect">形式:</label>
      <select id="typeSelect">
        <option value="all">すべて（記述＋○×）</option>
        <option value="essay">短文記述のみ（理由・仕組み）</option>
        <option value="ox">○×問題のみ（ひっかけ対策）</option>
      </select>
      <label for="catSelect">分野:</label>
      <select id="catSelect"></select>
    </div>
    <div class="filter-group">
      <button class="btn-sm" id="shuffleBtn" type="button">シャッフル: OFF</button>
      <button class="btn-sm" id="restartBtn" type="button">最初から</button>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-meta">
      <span id="progressText">問題 1 / 36</span>
      <span id="scoreText">クリア数: 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <main class="card" id="quizCard"></main>
  <p class="hint-keys">○×問題キーボード操作: [1]または[O]で○ ／ [2]または[X]で× ／ [Enter]で次へ</p>
</div>

<script>
const ALL_QUESTIONS = [
  {
    "id": 1,
    "type": "essay",
    "importantTheme": "重要テーマ①：洗剤の適量と洗浄力",
    "category": "洗剤量・しみ抜き",
    "question": "洗剤は適量より多く入れても洗浄力が上がらないのはなぜか。また、洗剤を適量より「多すぎる」ほど入れるとどのようなデメリットがあるか、理由とあわせて説明しなさい。",
    "modelAnswer": "洗剤の量とともに洗浄力は高くなるが、適量を越えると洗浄力は頭打ちになるため、多く入れても洗浄力は上がらない。入れすぎると、多く入れた分の洗剤が無駄になり、泡切れが悪くなってすすぎを長くすることで水や電気代も無駄になる場合がある。",
    "keywords": [
      "頭打ち",
      "無駄",
      "泡切れ",
      "すすぎ"
    ],
    "keywordNotes": "「適量を越えると頭打ち」「洗剤が無駄」「泡切れが悪くなり、すすぎの水や電気代が無駄」の4点が押さえられていれば満点レベルです。",
    "explanation": "【テストに出る重要ポイント】グラフにある通り、洗剤は適量までは洗浄力が上がりますが、適量を越えると「頭打ち」になります。そのため多すぎても効果は変わらず、洗剤・水・電気代の無駄につながります。"
  },
  {
    "id": 2,
    "type": "essay",
    "importantTheme": "重要テーマ①：洗剤量と洗浄力",
    "category": "洗剤量・しみ抜き",
    "question": "洗剤が適量より「少なすぎる」場合、洗濯物にどのような2つのデメリットが起きるか。また、仕上げに使う「柔軟剤」を入れすぎるとどのようなデメリットがあるか説明しなさい。",
    "modelAnswer": "洗剤が少なすぎると、①洗浄力が弱くなり汚れ落ちが悪くなる、②一度落ちた汚れが洗濯機の中で再び衣服についてしまう（再汚染）ことがある。また、柔軟剤を入れすぎると香りが強くなりすぎたり、吸水性が悪くなったりする。",
    "keywords": [
      "洗浄力",
      "汚れ落ち",
      "再汚染",
      "吸水性"
    ],
    "keywordNotes": "少なすぎる場合＝「洗浄力（汚れ落ち）低下」＋「再汚染」、柔軟剤入れすぎ＝「香りが強すぎ」「吸水性が悪くなる」をセットで覚えましょう。",
    "explanation": "多すぎる場合と少なすぎる場合のデメリットを逆にしてしまうひっかけが頻出です。特に「再汚染」は洗剤が【少なすぎる】ときに起きる現象、吸水性の低下は【柔軟剤】の入れすぎによる現象です。"
  },
  {
    "id": 3,
    "type": "essay",
    "importantTheme": "重要テーマ②：洗濯表示の判断と理由",
    "category": "洗濯表示マスター",
    "question": "毛75％・ポリエステル25％の服A（洗濯桶×・ドライクリーニングP）と、綿100％の服B（洗濯桶40・△・アイロン高・つり干し）のうち、家庭で洗濯できるのはどちらで、その理由は何か。",
    "modelAnswer": "家庭で洗濯できるのは服B。理由は、服Aは洗濯桶に×がついており家庭での水洗いができない表示だから（服Bは40の洗濯桶マークがあり家庭で洗濯できる表示だから）。",
    "keywords": [
      "服B",
      "×",
      "水洗い",
      "洗濯できない"
    ],
    "keywordNotes": "「服B」を正しく選び、服Aが「洗濯桶に×がついているため家庭で洗濯（水洗い）できない」ことを書ければOKです。",
    "explanation": "洗濯表示すごろくの上部問題そのままの出題です。綿100％はしわになりやすい性質がありますが、洗濯桶に「40」のマークがあるため家庭で水洗いできます。一方、服Aは洗濯桶に×がついているためドライクリーニング（P）に出す必要があります。"
  },
  {
    "id": 4,
    "type": "essay",
    "importantTheme": "重要テーマ②：洗濯・乾燥の仕組み",
    "category": "洗濯の手順・表示",
    "question": "洗濯機で「脱水」が終わった後、洗濯物を洗濯機の中に放置せず、すぐに取り出して乾燥させるべきなのはなぜか。",
    "modelAnswer": "脱水後、そのまま放っておくと衣服にしわがついてしまう（しわになる）から。",
    "keywords": [
      "しわ",
      "放っておく"
    ],
    "keywordNotes": "「放っておくとしわになるから」という理由が簡潔に書けていれば正解です。",
    "explanation": "洗濯機による洗濯の「4 乾燥させる」のポイントです。脱水後はすぐに取り出して、取り扱い表示を確認したうえで衣服に適した干し方をするか、乾燥機を利用します。"
  },
  {
    "id": 5,
    "type": "essay",
    "category": "洗濯表示マスター",
    "question": "汚れた洗濯物は後回しにせず、「早めに洗う」のがよいとされるのはなぜか。",
    "modelAnswer": "時間がたつと汚れが落ちにくくなるから。",
    "keywords": [
      "時間",
      "汚れが落ちにくく"
    ],
    "keywordNotes": "「時間がたつと汚れが落ちにくくなる」の2点が必須です。",
    "explanation": "洗濯表示すごろくの豆知識にある通り、汚れは時間がたつほど繊維に定着して落ちにくくなります。また、洗濯前にはポケットの中を確認し、干すときはしわをのばしてから干します。"
  },
  {
    "id": 6,
    "type": "essay",
    "category": "洗剤量・しみ抜き",
    "question": "衣服に付いた「しみ」を落とすとき、なぜ「こすらず、たたいて」落とすのか。その仕組みとやり方のポイントを説明しなさい。",
    "modelAnswer": "下にタオルなどの他の布を敷き、こすらずに上からたたくことで、下の布（タオル）に汚れを移して落とすため（こすると生地を傷めたり汚れが広がったりするため）。",
    "keywords": [
      "こすらず",
      "たたいて",
      "他の布",
      "移す"
    ],
    "keywordNotes": "「こすらず」「たたいて」「他の布（タオル）に汚れを移す」という仕組みのキーワードを含めましょう。",
    "explanation": "図3「しみ抜きの方法」のポイントです。部分的な汚れである「しみ」は、下にタオルを敷いて上からたたくことで、汚れを下の布に移し取って落とします。"
  },
  {
    "id": 7,

    "category": "洗濯表示マスター",
    "question": "乾燥のマークで、四角の左上に「斜め線」が入っているものは「日なた干し」を表している。",
    "answer": false,
    "keywords": [
      "左上の斜め線＝日かげ干し",
      "斜め線なし＝日なた干し"
    ],
    "explanation": "【×】左上に斜め線が入っているマークは「日かげ干し」です。斜め線がないものが「日なた干し」です。",
    "svg": "<svg viewBox=\"0 0 80 68\" class=\"care-svg\"><rect x=\"18\" y=\"12\" width=\"44\" height=\"44\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\"/><line x1=\"18\" y1=\"28\" x2=\"34\" y2=\"12\" stroke=\"currentColor\" stroke-width=\"3\"/><line x1=\"40\" y1=\"20\" x2=\"40\" y2=\"48\" stroke=\"currentColor\" stroke-width=\"3.5\"/></svg>"
  },
  {
    "id": 35,
    "type": "ox",
    "contrastPair": "タンブル乾燥（四角に丸） vs 漂白（△）",
    "category": "洗濯表示マスター",
    "question": "四角の中に丸が描かれたマークは「家庭の乾燥機（タンブル乾燥）」、三角形（△）のマークは「漂白」を表している。",
    "answer": true,
    "keywords": [
      "四角に丸＝乾燥機（タンブル乾燥）",
      "△＝漂白"
    ],
    "explanation": "【○】その通りです。なお、丸の中に「P」があるマークはドライクリーニングを表します。",
    "svg": "<svg viewBox=\"0 0 160 68\" class=\"care-svg\"><g transform=\"translate(10,6)\"><rect x=\"10\" y=\"6\" width=\"44\" height=\"44\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\"/><circle cx=\"32\" cy=\"28\" r=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><circle cx=\"32\" cy=\"28\" r=\"3\" fill=\"currentColor\"/></g><g transform=\"translate(88,6)\"><polygon points=\"32,6 8,50 56,50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\"/></g></svg>"
  },
  {
    "id": 36,
    "type": "ox",
    "contrastPair": "通販のメリット vs デメリット",
    "category": "衣服計画・入手",
    "question": "通信販売で衣服を購入する場合、「試着ができない」ことはメリットの1つである。",
    "answer": false,
    "keywords": [
      "デメリット（試着できない）",
      "メリット（店に行かない・家に届く・すぐ買える）"
    ],
    "explanation": "【×】「試着ができない」のはデメリットです。メリットは「店に行かなくてよい」「待っていると家に届けてくれる」「すぐに買える」などです。"
  }
];

let state = {
  typeFilter: "all",
  category: "すべて",
  shuffle: false,
  pool: [],
  idx: 0,
  correctCount: 0,
  answered: false,
  wrongIds: new Set(),
  results: []
};

const typeSelect = document.getElementById("typeSelect");
const catSelect = document.getElementById("catSelect");
const shuffleBtn = document.getElementById("shuffleBtn");
const restartBtn = document.getElementById("restartBtn");
const progressWrap = document.getElementById("progressWrap");
const progressText = document.getElementById("progressText");
const scoreText = document.getElementById("scoreText");
const progressFill = document.getElementById("progressFill");
const quizCard = document.getElementById("quizCard");

function initCategories() {
  const cats = ["すべて", ...new Set(ALL_QUESTIONS.map(q => q.category))];
  catSelect.innerHTML = cats.map(c => {
    const count = c === "すべて" ? ALL_QUESTIONS.length : ALL_QUESTIONS.filter(q => q.category === c).length;
    return `<option value="${c}">${c}（${count}問）</option>`;
  }).join("");
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function normalizeForMatch(str) {
  return str
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
    .replace(/　/g, " ")
    .toLowerCase();
}

function startQuiz(customPool = null) {
  let base = customPool ? customPool : ALL_QUESTIONS.filter(q => {
    const typeOk = state.typeFilter === "all" || q.type === state.typeFilter;
    const catOk = state.category === "すべて" || q.category === state.category;
    return typeOk && catOk;
  });
  if (state.shuffle) base = shuffleArray(base);
  state.pool = base;
  state.idx = 0;
  state.correctCount = 0;
  state.answered = false;
  state.results = [];
  if (!customPool) state.wrongIds = new Set();
  progressWrap.style.display = "block";
  renderQuestion();
}

function renderQuestion() {
  if (state.pool.length === 0) {
    progressWrap.style.display = "none";
    quizCard.innerHTML = `<p style="text-align:center;padding:24px;color:var(--muted);">該当する問題がありません。条件を変更してください。</p>`;
    return;
  }
  if (state.idx >= state.pool.length) {
    renderSummary();
    return;
  }
  const q = state.pool[state.idx];
  state.answered = false;

  progressText.textContent = `問題 ${state.idx + 1} / ${state.pool.length}`;
  scoreText.textContent = `クリア数: ${state.correctCount}`;
  progressFill.style.width = `${(state.idx / state.pool.length) * 100}%`;

  const typeBadge = q.type === "essay"
    ? `<span class="badge badge-type-essay">短文記述（理由・仕組み）</span>`
    : `<span class="badge badge-type-ox">○×ひっかけ対策</span>`;
  const extraBadge = q.importantTheme
    ? `<span class="badge badge-important">★ ${q.importantTheme}</span>`
    : (q.contrastPair ? `<span class="badge badge-contrast">対比：${q.contrastPair}</span>` : "");

  const svgHtml = q.svg ? `<div class="svg-box">${q.svg}</div>` : "";

  let inputHtml = "";
  if (q.type === "essay") {
    inputHtml = `
      <textarea class="essay-area" id="essayInput" placeholder="自分の言葉で理由や仕組みを書いてみよう（空欄のまま答え合わせもできます）"></textarea>
      <div class="essay-actions">
        <span class="essay-tip">※キーワードが含まれているか自動でチェックします</span>
        <button class="btn-primary" id="checkEssayBtn" type="button">答え合わせをする</button>
      </div>
    `;
  } else {
    inputHtml = `
      <div class="ox-grid">
        <button class="ox-btn" data-val="true" type="button">
          <span class="ox-symbol">○</span>
          <span class="ox-sub">正しい</span>
        </button>
        <button class="ox-btn" data-val="false" type="button">
          <span class="ox-symbol">×</span>
          <span class="ox-sub">誤り（ひっかけ）</span>
        </button>
      </div>
    `;
  }

  quizCard.innerHTML = `
    <div class="q-header">
      <div class="badges-left">
        ${typeBadge}
        <span class="badge">${q.category}</span>
        ${extraBadge}
      </div>
      <span class="q-num">Q${state.idx + 1}</span>
    </div>
    <div class="q-text">${q.question}</div>
    ${svgHtml}
    <div id="inputWrap">${inputHtml}</div>
    <div class="feedback" id="feedbackBox"></div>
    <div class="actions" id="actionsWrap" style="display:none;">
      <button class="btn-primary" id="nextBtn" type="button">
        ${state.idx + 1 < state.pool.length ? "次の問題へ →" : "結果を見る →"}
      </button>
    </div>
  `;

  if (q.type === "essay") {
    document.getElementById("checkEssayBtn").addEventListener("click", handleEssayCheck);
  } else {
    document.querySelectorAll(".ox-btn").forEach(btn => {
      btn.addEventListener("click", () => handleOXAnswer(btn.dataset.val === "true"));
    });
  }
  document.getElementById("nextBtn").addEventListener("click", () => {
    state.idx++;
    renderQuestion();
  });
}

function handleEssayCheck() {
  if (state.answered) return;
  const q = state.pool[state.idx];
  const userText = document.getElementById("essayInput").value.trim();
  const normUser = normalizeForMatch(userText);

  let hitCount = 0;
  const kwTagsHtml = q.keywords.map(kw => {
    const isHit = userText.length > 0 && normUser.includes(normalizeForMatch(kw));
    if (isHit) hitCount++;
    return `<span class="kw-tag ${isHit ? "hit" : ""}">${isHit ? "✓ " : ""}${kw}</span>`;
  }).join("");

  document.getElementById("essayInput").disabled = true;
  document.getElementById("checkEssayBtn").disabled = true;

  const fb = document.getElementById("feedbackBox");
  fb.classList.add("show");
  fb.innerHTML = `
    <div class="model-answer-box">
      <div class="box-label">模範解答</div>
      <div class="model-answer-text">${q.modelAnswer}</div>
    </div>
    <div class="kw-box">
      <div class="kw-header">
        <span class="kw-title">📌 記述に含めるべき必須キーワード</span>
        ${userText.length > 0 ? `<span class="kw-match-count">一致：${hitCount} / ${q.keywords.length} 個</span>` : ""}
      </div>
      <div class="kw-tags">${kwTagsHtml}</div>
      <div class="kw-note">${q.keywordNotes}</div>
    </div>
    <div class="feedback-exp"><strong>【詳しい解説】</strong><br>${q.explanation}</div>
    <div class="self-grade-wrap" id="selfGradeWrap">
      <span class="self-grade-label">自己採点して次へ進もう：</span>
      <div class="self-grade-btns">
        <button class="btn-ok" id="gradeOkBtn" type="button">○ キーワードを押さえて書けた</button>
        <button class="btn-ng" id="gradeNgBtn" type="button">× 要復習にする</button>
      </div>
    </div>
  `;

  document.getElementById("gradeOkBtn").addEventListener("click", () => finalizeEssay(true));
  document.getElementById("gradeNgBtn").addEventListener("click", () => finalizeEssay(false));
}

function finalizeEssay(isOk) {
  if (state.answered) return;
  state.answered = true;
  const q = state.pool[state.idx];

  if (isOk) {
    state.correctCount++;
    state.wrongIds.delete(q.id);
  } else {
    state.wrongIds.add(q.id);
  }
  state.results.push({ id: q.id, category: q.category, type: q.type, ok: isOk });

  const fb = document.getElementById("feedbackBox");
  fb.classList.add(isOk ? "is-correct" : "is-wrong");
  const wrap = document.getElementById("selfGradeWrap");
  wrap.innerHTML = `<span class="self-grade-label">${isOk ? "○ クリアとして記録しました" : "× 要復習リストに追加しました"}</span>`;

  scoreText.textContent = `クリア数: ${state.correctCount}`;
  progressFill.style.width = `${((state.idx + 1) / state.pool.length) * 100}%`;
  document.getElementById("actionsWrap").style.display = "flex";
}

function handleOXAnswer(selectedVal) {
  if (state.answered) return;
  state.answered = true;
  const q = state.pool[state.idx];
  const isOk = selectedVal === q.answer;

  if (isOk) {
    state.correctCount++;
    state.wrongIds.delete(q.id);
  } else {
    state.wrongIds.add(q.id);
  }
  state.results.push({ id: q.id, category: q.category, type: q.type, ok: isOk });

  document.querySelectorAll(".ox-btn").forEach(btn => {
    btn.disabled = true;
    const val = btn.dataset.val === "true";
    if (val === q.answer) btn.classList.add("correct");
    else if (val === selectedVal && !isOk) btn.classList.add("wrong");
  });

  const kwTagsHtml = q.keywords.map(kw => `<span class="kw-tag">${kw}</span>`).join("");
  const fb = document.getElementById("feedbackBox");
  fb.classList.add("show", isOk ? "is-correct" : "is-wrong");
  fb.innerHTML = `
    <div class="feedback-title">${isOk ? "○ 正解！" : "× 不正解…"}（正解は「${q.answer ? "○" : "×"}」）</div>
    <div class="kw-box">
      <div class="kw-header"><span class="kw-title">📌 押さえるべき必須キーワード・対比</span></div>
      <div class="kw-tags">${kwTagsHtml}</div>
    </div>
    <div class="feedback-exp">${q.explanation}</div>
  `;

  scoreText.textContent = `クリア数: ${state.correctCount}`;
  progressFill.style.width = `${((state.idx + 1) / state.pool.length) * 100}%`;
  document.getElementById("actionsWrap").style.display = "flex";
}

function renderSummary() {
  progressWrap.style.display = "none";
  const total = state.pool.length;
  const pct = total ? Math.round((state.correctCount / total) * 100) : 0;
  let msg = "おつかれさま！要復習の問題を見直してひっかけ・記述を完璧にしよう。";
  if (pct === 100) msg = "パーフェクト！記述のキーワードもひっかけ問題もバッチリです！";
  else if (pct >= 80) msg = "すばらしい！あと少し復習すれば満点が狙えます！";
  else if (pct >= 60) msg = "いい調子！解説のキーワードを意識してもう一度解いてみよう。";

  const typeMap = {
    essay: { label: "短文記述（理由・仕組み）", ok: 0, total: 0 },
    ox: { label: "○×ひっかけ対策", ok: 0, total: 0 }
  };
  state.results.forEach(r => {
    typeMap[r.type].total++;
    if (r.ok) typeMap[r.type].ok++;
  });

  const breakdownHtml = Object.values(typeMap)
    .filter(st => st.total > 0)
    .map(st => {
      const p = Math.round((st.ok / st.total) * 100);
      return `<div class="cat-item"><strong>${st.label}</strong>${st.ok} / ${st.total} 問クリア（${p}%）</div>`;
    }).join("");

  const wrongPool = ALL_QUESTIONS.filter(q => state.wrongIds.has(q.id));
  const retryWrongBtn = wrongPool.length > 0
    ? `<button class="btn-primary" id="retryWrongBtn" type="button">要復習の問題だけ解き直す（${wrongPool.length}問）</button>`
    : "";

  quizCard.innerHTML = `
    <div class="summary-score">
      <div class="score-big">${state.correctCount} / ${total} 問クリア（${pct}%）</div>
      <div class="score-msg">${msg}</div>
    </div>
    <div class="cat-breakdown">${breakdownHtml}</div>
    <div class="summary-actions">
      ${retryWrongBtn}
      <button class="btn-sm" id="retryAllBtn" type="button" style="padding:11px 20px;font-size:0.95rem;">もう一度最初から解く</button>
    </div>
  `;

  if (wrongPool.length > 0) {
    document.getElementById("retryWrongBtn").addEventListener("click", () => startQuiz(wrongPool));
  }
  document.getElementById("retryAllBtn").addEventListener("click", () => startQuiz());
}

typeSelect.addEventListener("change", () => {
  state.typeFilter = typeSelect.value;
  startQuiz();
});

catSelect.addEventListener("change", () => {
  state.category = catSelect.value;
  startQuiz();
});

shuffleBtn.addEventListener("click", () => {
  state.shuffle = !state.shuffle;
  shuffleBtn.textContent = `シャッフル: ${state.shuffle ? "ON" : "OFF"}`;
  shuffleBtn.classList.toggle("active", state.shuffle);
  startQuiz();
});

restartBtn.addEventListener("click", () => startQuiz());

document.addEventListener("keydown", (e) => {
  if (state.idx >= state.pool.length) return;
  const q = state.pool[state.idx];
  if (!q) return;
  if (q.type === "ox" && !state.answered) {
    if (e.key === "1" || e.key.toLowerCase() === "o") handleOXAnswer(true);
    else if (e.key === "2" || e.key.toLowerCase() === "x") handleOXAnswer(false);
  } else if (state.answered && e.key === "Enter" && document.activeElement.tagName !== "TEXTAREA") {
    e.preventDefault();
    state.idx++;
    renderQuestion();
  }
});

initCategories();
startQuiz();
</script>
</body>
</html>
