    "svg": "<svg viewBox=\"0 0 160 68\" class=\"care-svg\"><g transform=\"translate(10,6)\"><rect x=\"10\" y=\"6\" width=\"44\" height=\"44\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\"/><line x1=\"32\" y1=\"14\" x2=\"32\" y2=\"42\" stroke=\"currentColor\" stroke-width=\"3.5\"/><text x=\"32\" y=\"61\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">A</text></g><g transform=\"translate(88,6)\"><rect x=\"10\" y=\"6\" width=\"44\" height=\"44\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\"/><line x1=\"10\" y1=\"22\" x2=\"26\" y2=\"6\" stroke=\"currentColor\" stroke-width=\"3\"/><line x1=\"32\" y1=\"14\" x2=\"32\" y2=\"42\" stroke=\"currentColor\" stroke-width=\"3.5\"/><text x=\"32\" y=\"61\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">B</text></g></svg>",
    "choices": [
      "B（左上に斜め線があるマーク）",
      "A（左上に斜め線がないマーク）",
      "どちらも日なた干しを表す",
      "どちらも平干しを表す"
    ],
    "answer": 0,
    "explanation": "四角の左上に斜め線が入っているものが「日かげ干し」です。斜め線がないAは「日なた干し」を表します。"
  },
  {
    "id": 43,
    "category": "洗濯表示マスター",
    "question": "次のマークのうち、「吊るして干す（つり干し）」ことを示しているのはどれか。",
    "svg": "<svg viewBox=\"0 0 160 68\" class=\"care-svg\"><g transform=\"translate(10,6)\"><rect x=\"10\" y=\"6\" width=\"44\" height=\"44\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\"/><line x1=\"32\" y1=\"14\" x2=\"32\" y2=\"42\" stroke=\"currentColor\" stroke-width=\"3.5\"/><text x=\"32\" y=\"61\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">A</text></g><g transform=\"translate(88,6)\"><rect x=\"10\" y=\"6\" width=\"44\" height=\"44\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\"/><line x1=\"18\" y1=\"28\" x2=\"46\" y2=\"28\" stroke=\"currentColor\" stroke-width=\"3.5\"/><text x=\"32\" y=\"61\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">B</text></g></svg>",
    "choices": [
      "A（四角の中に縦線）",
      "B（四角の中に横線）",
      "どちらもつり干しを表す",
      "どちらも平干しを表す"
    ],
    "answer": 0,
    "explanation": "四角の中に「縦線」が「つり干し（吊るして干す）」、「横線」が「平干し（平らに置いて干す）」を表します。"
  },
  {
    "id": 44,
    "category": "洗濯表示マスター",
    "question": "毛75％・ポリエステル25％の服A（洗濯桶×・ドライクリーニングP）と、綿100％の服B（洗濯桶40・△・アイロン高・つり干し）のうち、家庭で洗濯できるのはどちらで、その理由は何か。",
    "choices": [
      "服B。服Aは家庭での水洗いができない表示（×）だから",
      "服A。ポリエステルが入っていて乾きやすいから",
      "どちらも家庭で洗濯できる",
      "どちらも家庭で洗濯できない"
    ],
    "answer": 0,
    "explanation": "洗濯表示すごろくの上部問題にある通り、服Aは洗濯桶に×がついているため家庭で水洗いができません。服Bは「40」の洗濯桶マークがあるため家庭で洗濯できます（綿はしわになりやすいですが、そのまま洗えます）。"
  }
];
const LABELS = ["ア", "イ", "ウ", "エ"];

let state = {
  category: "すべて",
  shuffle: false,
  pool: [],
  idx: 0,
  correctCount: 0,
  answered: false,
  wrongIds: new Set(),
  results: [] // {id, category, ok}
};

const catSelect = document.getElementById("catSelect");
const shuffleBtn = document.getElementById("shuffleBtn");
const restartBtn = document.getElementById("restartBtn");
const progressWrap = document.getElementById("progressWrap");
const progressText = document.getElementById("progressText");
const scoreText = document.getElementById("scoreText");
const progressFill = document.getElementById("progressFill");
const quizCard = document.getElementById("quizCard");

function initCategories() {
  const cats = ["すべて", ...new Set(ALL_QUESTIONS.map(q => q.category))];
  catSelect.innerHTML = cats.map(c => {
    const count = c === "すべて" ? ALL_QUESTIONS.length : ALL_QUESTIONS.filter(q => q.category === c).length;
    return `<option value="${c}">${c}（${count}問）</option>`;
  }).join("");
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function prepareQuestion(q) {
  // Shuffle choice order while tracking the right answer
  const indexed = q.choices.map((text, i) => ({ text, isCorrect: i === q.answer }));
  const mixed = shuffleArray(indexed);
  return {
    ...q,
    displayChoices: mixed.map(item => item.text),
    displayAnswer: mixed.findIndex(item => item.isCorrect)
  };
}

function startQuiz(customPool = null) {
  let base = customPool
    ? customPool
    : (state.category === "すべて" ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q => q.category === state.category));
  if (state.shuffle) base = shuffleArray(base);
  state.pool = base.map(prepareQuestion);
  state.idx = 0;
  state.correctCount = 0;
  state.answered = false;
  state.results = [];
  if (!customPool) state.wrongIds = new Set();
  progressWrap.style.display = "block";
  renderQuestion();
}

function renderQuestion() {
  if (state.idx >= state.pool.length) {
    renderSummary();
    return;
  }
  const q = state.pool[state.idx];
  state.answered = false;

  progressText.textContent = `問題 ${state.idx + 1} / ${state.pool.length}`;
  scoreText.textContent = `正解数: ${state.correctCount}`;
  progressFill.style.width = `${(state.idx / state.pool.length) * 100}%`;

  const svgHtml = q.svg ? `<div class="svg-box">${q.svg}</div>` : "";
  const choicesHtml = q.displayChoices.map((c, i) => `
    <button class="choice-btn" data-idx="${i}" type="button">
      <span class="choice-label">${LABELS[i]}</span>
      <span>${c}</span>
    </button>
  `).join("");

  quizCard.innerHTML = `
    <div class="q-header">
      <span class="badge">${q.category}</span>
      <span class="q-num">Q${state.idx + 1}</span>
    </div>
    <div class="q-text">${q.question}</div>
    ${svgHtml}
    <div class="choices" id="choicesWrap">${choicesHtml}</div>
    <div class="feedback" id="feedbackBox">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div class="feedback-exp" id="feedbackExp"></div>
    </div>
    <div class="actions" id="actionsWrap" style="display:none;">
      <button class="btn-primary" id="nextBtn" type="button">
        ${state.idx + 1 < state.pool.length ? "次の問題へ →" : "結果を見る →"}
      </button>
    </div>
  `;

  document.querySelectorAll(".choice-btn").forEach(btn => {
    btn.addEventListener("click", () => handleAnswer(Number(btn.dataset.idx)));
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    state.idx++;
    renderQuestion();
  });
}

function handleAnswer(selectedIdx) {
  if (state.answered) return;
  state.answered = true;

  const q = state.pool[state.idx];
  const isOk = selectedIdx === q.displayAnswer;
  if (isOk) {
    state.correctCount++;
    state.wrongIds.delete(q.id);
  } else {
    state.wrongIds.add(q.id);
  }
  state.results.push({ id: q.id, category: q.category, ok: isOk });

  const btns = document.querySelectorAll(".choice-btn");
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.displayAnswer) btn.classList.add("correct");
    else if (i === selectedIdx && !isOk) btn.classList.add("wrong");
  });

  const fb = document.getElementById("feedbackBox");
  const fbTitle = document.getElementById("feedbackTitle");
  const fbExp = document.getElementById("feedbackExp");
  fb.classList.add("show", isOk ? "is-correct" : "is-wrong");
  fbTitle.textContent = isOk
    ? `○ 正解！（答え：${LABELS[q.displayAnswer]}）`
    : `× 不正解…（正解は ${LABELS[q.displayAnswer]}）`;
  fbExp.textContent = q.explanation;

  scoreText.textContent = `正解数: ${state.correctCount}`;
  progressFill.style.width = `${((state.idx + 1) / state.pool.length) * 100}%`;
  document.getElementById("actionsWrap").style.display = "flex";
}

function renderSummary() {
  progressWrap.style.display = "none";
  const total = state.pool.length;
  const pct = total ? Math.round((state.correctCount / total) * 100) : 0;
  let msg = "おつかれさま！間違えた問題を復習してテスト本番に備えよう。";
  if (pct === 100) msg = "パーフェクト！全範囲バッチリ理解できています！";
  else if (pct >= 80) msg = "すばらしい！合格圏内です。あと少しで満点！";
  else if (pct >= 60) msg = "よくがんばりました！解説を見直して定着させよう。";

  const catMap = {};
  state.results.forEach(r => {
    if (!catMap[r.category]) catMap[r.category] = { ok: 0, total: 0 };
    catMap[r.category].total++;
    if (r.ok) catMap[r.category].ok++;
  });
  const catHtml = Object.entries(catMap).map(([cat, st]) => {
    const p = Math.round((st.ok / st.total) * 100);
    return `<div class="cat-item"><strong>${cat}</strong>${st.ok} / ${st.total} 問正解（${p}%）</div>`;
  }).join("");

  const wrongPool = ALL_QUESTIONS.filter(q => state.wrongIds.has(q.id));
  const retryWrongBtn = wrongPool.length > 0
    ? `<button class="btn-primary" id="retryWrongBtn" type="button">間違えた問題だけ復習する（${wrongPool.length}問）</button>`
    : "";

  quizCard.innerHTML = `
    <div class="summary-score">
      <div class="score-big">${state.correctCount} / ${total} 問正解（${pct}%）</div>
      <div class="score-msg">${msg}</div>
    </div>
    <div class="cat-breakdown">${catHtml}</div>
    <div class="summary-actions">
      ${retryWrongBtn}
      <button class="btn-sm" id="retryAllBtn" type="button" style="padding:11px 20px;font-size:0.95rem;">もう一度最初から解く</button>
    </div>
  `;

  if (wrongPool.length > 0) {
    document.getElementById("retryWrongBtn").addEventListener("click", () => startQuiz(wrongPool));
  }
  document.getElementById("retryAllBtn").addEventListener("click", () => startQuiz());
}

catSelect.addEventListener("change", () => {
  state.category = catSelect.value;
  startQuiz();
});

shuffleBtn.addEventListener("click", () => {
  state.shuffle = !state.shuffle;
  shuffleBtn.textContent = `シャッフル: ${state.shuffle ? "ON" : "OFF"}`;
  shuffleBtn.classList.toggle("active", state.shuffle);
  startQuiz();
});

restartBtn.addEventListener("click", () => startQuiz());

document.addEventListener("keydown", (e) => {
  if (state.idx >= state.pool.length) return;
  if (!state.answered && ["1", "2", "3", "4"].includes(e.key)) {
    const idx = Number(e.key) - 1;
    if (idx < state.pool[state.idx].displayChoices.length) handleAnswer(idx);
  } else if (state.answered && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    state.idx++;
    renderQuestion();
  }
});

initCategories();
startQuiz();
</script>
</body>
</html>
