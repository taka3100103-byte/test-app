<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中1 家庭科 2学期末テスト対策 記述・穴埋めクイズ</title>
<style>
  :root {

    --text: #1e293b;

    --primary-dark: #115e59;
    --primary-light: #f0fdfa;
    --primary-border: #99f6e4;
    --correct: #16a34a;
    --correct-bg: #f0fdf4;
    --correct-border: #86efac;
    --wrong: #dc2626;
    --wrong-bg: #fef2f2;
    --wrong-border: #fca5a5;
    --hint-bg: #fffbeb;
    --hint-border: #fde68a;
    --hint-text: #92400e;
    --border: #e2e8f0;
    --shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);

    padding: 20px 14px 48px;
  }
  .container { max-width: 780px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 1.45rem; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
  header p { font-size: 0.9rem; color: var(--muted); }
  .controls-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }
  .filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-group label { font-size: 0.85rem; font-weight: 700; color: var(--muted); }
  select {
    font-family: inherit; font-size: 0.9rem; padding: 6px 12px;
    border-radius: 8px; border: 1px solid var(--border); background: #f8fafc;
    color: var(--text); cursor: pointer;
  }
  .btn-sm {
    font-family: inherit; font-size: 0.85rem; font-weight: 700;
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: #fff; color: var(--text); cursor: pointer; transition: all 0.15s;
  }
  .btn-sm:hover { background: #f1f5f9; }
  .btn-sm.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .progress-wrap { margin-bottom: 16px; }
  .progress-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.88rem; font-weight: 700; color: var(--muted); margin-bottom: 6px;
  }
  .progress-track { height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #14b8a6, #0f766e);
    border-radius: 999px; transition: width 0.3s ease; width: 0%;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px 22px; box-shadow: var(--shadow);
  }
  .q-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 14px;
  }
  .badge {
    display: inline-block; font-size: 0.78rem; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
    background: var(--primary-light); color: var(--primary-dark);
    border: 1px solid var(--primary-border);
  }
  .q-num { font-size: 0.85rem; font-weight: 700; color: var(--muted); }
  .q-text { font-size: 1.12rem; font-weight: 700; color: #0f172a; margin-bottom: 18px; }
  .blank-tag {
    display: inline-block;
    padding: 0 8px;
    margin: 0 2px;
    border-radius: 6px;
    background: var(--primary-light);
    color: var(--primary-dark);
    border: 1.5px dashed var(--primary);
    font-weight: 800;
  }
  .svg-box {
    display: flex; justify-content: center; align-items: center;
    background: #f8fafc; border: 1px dashed #cbd5e1;
    border-radius: 10px; padding: 14px; margin-bottom: 18px;
  }
  .care-svg { height: 76px; width: auto; color: #0f172a; }
  .answer-area { display: flex; flex-direction: column; gap: 12px; }
  .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .answer-input {
    flex: 1 1 240px;
    font-family: inherit; font-size: 1.05rem; font-weight: 600;
    padding: 12px 15px; border-radius: 10px;
    border: 2px solid #cbd5e1; background: #fff; color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .answer-input:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
  }
  .answer-input:disabled { background: #f8fafc; color: #334155; }
  .answer-input.is-correct { border-color: var(--correct); background: var(--correct-bg); }
  .answer-input.is-wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .sub-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn-primary {
    font-family: inherit; font-size: 0.98rem; font-weight: 700;
    padding: 12px 22px; border-radius: 10px; border: none;
    background: var(--primary); color: #fff; cursor: pointer; transition: background 0.15s;
  }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-ghost {
    font-family: inherit; font-size: 0.86rem; font-weight: 700;
    padding: 7px 13px; border-radius: 8px; border: 1px solid var(--border);
    background: #f8fafc; color: var(--muted); cursor: pointer; transition: all 0.15s;
  }
  .btn-ghost:hover { background: #f1f5f9; color: var(--text); }
  .hint-box {
    padding: 10px 14px; border-radius: 8px;
    background: var(--hint-bg); border: 1px solid var(--hint-border);
    color: var(--hint-text); font-size: 0.9rem; font-weight: 600;
    display: none; animation: fadeIn 0.2s ease;
  }
  .hint-box.show { display: block; }
  .feedback {
    margin-top: 20px; padding: 16px 18px; border-radius: 10px;
    border: 1px solid var(--border); display: none; animation: fadeIn 0.2s ease;
  }
  .feedback.show { display: block; }
  .feedback.is-correct { background: var(--correct-bg); border-color: var(--correct-border); }
  .feedback.is-wrong { background: var(--wrong-bg); border-color: var(--wrong-border); }
  .feedback-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 8px; }
  .feedback.is-correct .feedback-title { color: var(--correct); }
  .feedback.is-wrong .feedback-title { color: var(--wrong); }
  .model-answer {
    display: inline-block;
    background: #ffffff;
    border: 1px solid rgba(15, 23, 42, 0.12);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 1rem;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 10px;
  }
  .feedback-exp { font-size: 0.94rem; color: #1e293b; }
  .override-wrap { margin-top: 10px; }
  .btn-override {
    font-family: inherit; font-size: 0.82rem; font-weight: 700;
    padding: 5px 11px; border-radius: 7px;
    border: 1px solid #cbd5e1; background: #fff; color: #334155; cursor: pointer;
  }
  .btn-override:hover { background: #f1f5f9; }
  .actions { margin-top: 18px; display: flex; justify-content: flex-end; gap: 10px; }
  .summary-score {
    text-align: center; padding: 18px 0 22px;
    border-bottom: 1px solid var(--border); margin-bottom: 20px;
  }
  .score-big { font-size: 2.5rem; font-weight: 900; color: var(--primary); line-height: 1.2; }
  .score-msg { font-size: 1.05rem; font-weight: 700; margin-top: 6px; }
  .cat-breakdown {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 10px; margin-bottom: 22px;
  }
  .cat-item {
    background: #f8fafc; border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; font-size: 0.88rem;
  }
  .cat-item strong { display: block; color: #0f172a; margin-bottom: 2px; }
  .summary-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .hint-keys { text-align: center; margin-top: 14px; font-size: 0.8rem; color: var(--muted); }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 560px) {
    .card { padding: 18px 15px; }
    .q-text { font-size: 1.03rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>中1 家庭科 2学期末テスト対策 記述・穴埋めクイズ</h1>
    <p>1問1答式・自分で考えて答えるテスト対策（全出題範囲網羅）</p>
  </header>

  <div class="controls-bar">

    </div>

    <div class="progress-track">

  <main class="card" id="quizCard"></main>
  <p class="hint-keys">キーボード操作: 入力後 [Enter] で答え合わせ ／ 解説表示後 [Enter] で次の問題へ</p>
</div>

  results: []
};

const catSelect = document.getElementById("catSelect");
const shuffleBtn = document.getElementById("shuffleBtn");
const restartBtn = document.getElementById("restartBtn");
const progressWrap = document.getElementById("progressWrap");
const progressText = document.getElementById("progressText");
const scoreText = document.getElementById("scoreText");
const progressFill = document.getElementById("progressFill");
const quizCard = document.getElementById("quizCard");

function initCategories() {
  const cats = ["すべて", ...new Set(ALL_QUESTIONS.map(q => q.category))];
  catSelect.innerHTML = cats.map(c => {
    const count = c === "すべて" ? ALL_QUESTIONS.length : ALL_QUESTIONS.filter(q => q.category === c).length;
    return `<option value="${c}">${c}（${count}問）</option>`;
  }).join("");
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function normalizeAnswer(str) {
  return (str || "")
    .normalize("NFKC")
    .toLowerCase()
    .replace(/[\s\u3000・、。,.「」『』()（）]/g, "");
}

function isMatch(userInput, q) {
  const norm = normalizeAnswer(userInput);
  if (!norm) return false;
  return q.accepts.some(acc => normalizeAnswer(acc) === norm);
}

function formatQuestionText(text) {
  return text.replace(/【　　】/g, '<span class="blank-tag">　　　</span>');
}

function startQuiz(customPool = null) {
  let base = customPool
    ? [...customPool]
    : (state.category === "すべて" ? [...ALL_QUESTIONS] : ALL_QUESTIONS.filter(q => q.category === state.category));
  if (state.shuffle) base = shuffleArray(base);
  state.pool = base;
  state.idx = 0;
  state.correctCount = 0;
  state.answered = false;
  state.results = [];
  if (!customPool) state.wrongIds = new Set();
  progressWrap.style.display = "block";
  renderQuestion();
}

function renderQuestion() {
  if (state.idx >= state.pool.length) {
    renderSummary();
    return;
  }
  const q = state.pool[state.idx];
  state.answered = false;

  progressText.textContent = `問題 ${state.idx + 1} / ${state.pool.length}`;
  scoreText.textContent = `正解数: ${state.correctCount}`;
  progressFill.style.width = `${(state.idx / state.pool.length) * 100}%`;

  const svgHtml = q.svg ? `<div class="svg-box">${q.svg}</div>` : "";

  quizCard.innerHTML = `
    <div class="q-header">
      <span class="badge">${q.category}</span>
      <span class="q-num">Q${state.idx + 1}</span>
    </div>
    <div class="q-text">${formatQuestionText(q.question)}</div>
    ${svgHtml}
    <div class="answer-area">
      <div class="input-row">
        <input type="text" class="answer-input" id="answerInput" placeholder="答えを入力してください..." autocomplete="off">
        <button class="btn-primary" id="checkBtn" type="button">答え合わせ</button>
      </div>
      <div class="sub-actions" id="subActions">
        <button class="btn-ghost" id="hintBtn" type="button">💡 ヒントを見る</button>
        <button class="btn-ghost" id="giveUpBtn" type="button">答えを見る</button>
      </div>
      <div class="hint-box" id="hintBox">💡 ヒント：${q.hint}</div>
    </div>
    <div class="feedback" id="feedbackBox">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div class="model-answer" id="modelAnswer"></div>
      <div class="feedback-exp" id="feedbackExp"></div>
      <div class="override-wrap" id="overrideWrap" style="display:none;">
        <button class="btn-override" id="overrideBtn" type="button">✓ 表現は違うが合っていた（正解にする）</button>
      </div>
    </div>
    <div class="actions" id="actionsWrap" style="display:none;">
      <button class="btn-primary" id="nextBtn" type="button">
        ${state.idx + 1 < state.pool.length ? "次の問題へ →" : "結果を見る →"}
      </button>
    </div>
  `;

  const inputEl = document.getElementById("answerInput");
  const checkBtn = document.getElementById("checkBtn");
  const hintBtn = document.getElementById("hintBtn");
  const giveUpBtn = document.getElementById("giveUpBtn");
  const hintBox = document.getElementById("hintBox");

  inputEl.focus();

  checkBtn.addEventListener("click", () => handleCheck(false));
  giveUpBtn.addEventListener("click", () => handleCheck(true));
  hintBtn.addEventListener("click", () => {
    hintBox.classList.add("show");
    hintBtn.style.display = "none";
    inputEl.focus();
  });
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing && !state.answered) {
      e.preventDefault();
      handleCheck(false);
    }
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    state.idx++;
    renderQuestion();
  });
}

function handleCheck(gaveUp) {
  if (state.answered) return;
  const inputEl = document.getElementById("answerInput");
  const userVal = inputEl.value.trim();
  if (!gaveUp && !userVal) {
    inputEl.focus();
    return;
  }

  state.answered = true;
  const q = state.pool[state.idx];
  const isOk = !gaveUp && isMatch(userVal, q);

  if (isOk) {
    state.correctCount++;
    state.wrongIds.delete(q.id);
  } else {
    state.wrongIds.add(q.id);
  }
  const resultEntry = { id: q.id, category: q.category, ok: isOk };
  state.results.push(resultEntry);

  inputEl.disabled = true;
  inputEl.classList.add(isOk ? "is-correct" : "is-wrong");
  document.getElementById("checkBtn").disabled = true;
  document.getElementById("subActions").style.display = "none";

  const fb = document.getElementById("feedbackBox");
  const fbTitle = document.getElementById("feedbackTitle");
  const modelAns = document.getElementById("modelAnswer");
  const fbExp = document.getElementById("feedbackExp");
  const overrideWrap = document.getElementById("overrideWrap");
  const overrideBtn = document.getElementById("overrideBtn");

  fb.classList.add("show", isOk ? "is-correct" : "is-wrong");
  if (isOk) {
    fbTitle.textContent = "○ 正解！";
  } else if (gaveUp) {
    fbTitle.textContent = "答えを確認しよう";
  } else {
    fbTitle.textContent = "× 不正解…";
  }
  modelAns.textContent = `模範解答：${q.answer}`;
  fbExp.textContent = q.explanation;

  if (!isOk && !gaveUp) {
    overrideWrap.style.display = "block";
    overrideBtn.addEventListener("click", () => {
      state.correctCount++;
      state.wrongIds.delete(q.id);
      resultEntry.ok = true;
      fb.classList.remove("is-wrong");
      fb.classList.add("is-correct");
      inputEl.classList.remove("is-wrong");
      inputEl.classList.add("is-correct");
      fbTitle.textContent = "○ 正解として記録しました！";
      overrideWrap.style.display = "none";
      scoreText.textContent = `正解数: ${state.correctCount}`;
    });
  }

  scoreText.textContent = `正解数: ${state.correctCount}`;
  progressFill.style.width = `${((state.idx + 1) / state.pool.length) * 100}%`;
  document.getElementById("actionsWrap").style.display = "flex";
}

function renderSummary() {
  progressWrap.style.display = "none";
  const total = state.pool.length;
  const pct = total ? Math.round((state.correctCount / total) * 100) : 0;
  let msg = "おつかれさま！間違えた問題を復習してテスト本番に備えよう。";
  if (pct === 100) msg = "パーフェクト！記述・穴埋めもバッチリです！";
  else if (pct >= 80) msg = "すばらしい！合格圏内です。あと少しで満点！";
  else if (pct >= 60) msg = "よくがんばりました！解説を見直して定着させよう。";

  const catMap = {};
  state.results.forEach(r => {
    if (!catMap[r.category]) catMap[r.category] = { ok: 0, total: 0 };
    catMap[r.category].total++;
    if (r.ok) catMap[r.category].ok++;
  });
  const catHtml = Object.entries(catMap).map(([cat, st]) => {
    const p = Math.round((st.ok / st.total) * 100);
    return `<div class="cat-item"><strong>${cat}</strong>${st.ok} / ${st.total} 問正解（${p}%）</div>`;
  }).join("");

  const wrongPool = ALL_QUESTIONS.filter(q => state.wrongIds.has(q.id));
  const retryWrongBtn = wrongPool.length > 0
    ? `<button class="btn-primary" id="retryWrongBtn" type="button">間違えた問題だけ復習する（${wrongPool.length}問）</button>`
    : "";

  quizCard.innerHTML = `
    <div class="summary-score">
      <div class="score-big">${state.correctCount} / ${total} 問正解（${pct}%）</div>
      <div class="score-msg">${msg}</div>
    </div>
    <div class="cat-breakdown">${catHtml}</div>
    <div class="summary-actions">
      ${retryWrongBtn}
      <button class="btn-sm" id="retryAllBtn" type="button" style="padding:11px 20px;font-size:0.95rem;">もう一度最初から解く</button>
    </div>
  `;

  if (wrongPool.length > 0) {
    document.getElementById("retryWrongBtn").addEventListener("click", () => startQuiz(wrongPool));
  }
  document.getElementById("retryAllBtn").addEventListener("click", () => startQuiz());
}

catSelect.addEventListener("change", () => {
  state.category = catSelect.value;
  startQuiz();
});

shuffleBtn.addEventListener("click", () => {
  state.shuffle = !state.shuffle;
  shuffleBtn.textContent = `シャッフル: ${state.shuffle ? "ON" : "OFF"}`;
  shuffleBtn.classList.toggle("active", state.shuffle);
  startQuiz();
});

restartBtn.addEventListener("click", () => startQuiz());

document.addEventListener("keydown", (e) => {
  if (state.idx >= state.pool.length) return;
  if (state.answered && e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    state.idx++;
    renderQuestion();
  }
});

initCategories();
startQuiz();
</script>
</body>
</html>
