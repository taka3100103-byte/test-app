<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中1 2学期末テスト対策 音楽｜記述＆ひっかけ○×特化テスト</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #0f766e;
      --primary-light: #ccfbf1;
      --primary-dark: #115e59;
      --indigo: #4338ca;
      --indigo-light: #e0e7ff;
      --amber: #b45309;
      --amber-light: #fef3c7;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --correct: #15803d;
      --correct-bg: #dcfce7;
      --wrong: #b91c1c;
      --wrong-bg: #fee2e2;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      padding: 20px 14px 56px;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    .badge-title {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-weight: 800;
      font-size: 0.82rem;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 8px;
      letter-spacing: 0.03em;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text);
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .mode-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 18px;
    }

    .mode-btn {
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 8px 15px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .mode-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 26px 24px;
      border: 1px solid var(--border);
    }

    .progress-wrap {
      margin-bottom: 18px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .progress-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #14b8a6);
      width: 0%;
      transition: width 0.3s ease;
    }

    .q-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }

    .tag {
      font-size: 0.78rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 6px;
    }

    .tag-unit {
      background: #f1f5f9;
      color: #334155;
    }

    .tag-essay {
      background: var(--indigo-light);
      color: var(--indigo);
    }

    .tag-ox {
      background: var(--amber-light);
      color: var(--amber);
    }

    .tag-core {
      background: #fce7f3;
      color: #be185d;
    }

    .q-text {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      line-height: 1.65;
    }

    .pair-hint {
      font-size: 0.84rem;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      padding: 8px 12px;
      color: #475569;
      margin-bottom: 16px;
    }

    /* ○× Buttons */
    .ox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .ox-btn {
      border: 2px solid var(--border);
      background: #fff;
      border-radius: 14px;
      padding: 18px 12px;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text);
    }

    .ox-btn .symbol {
      font-size: 2rem;
      line-height: 1.1;
    }

    .ox-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #f0fdfa;
      transform: translateY(-1px);
    }

    .ox-btn.selected-correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: var(--correct);
    }

    .ox-btn.selected-wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: var(--wrong);
    }

    .ox-btn.reveal-correct {
      border-color: var(--correct);
      background: #f0fdf4;
      color: var(--correct);
    }

    .ox-btn:disabled {
      cursor: default;
      opacity: 0.9;
    }

    /* Essay input */
    .essay-wrap {
      margin-bottom: 14px;
    }

    textarea {
      width: 100%;
      min-height: 105px;
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.6;
      resize: vertical;
      transition: border-color 0.15s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    /* Feedback Box */
    .feedback {
      margin-top: 18px;
      border-radius: 14px;
      padding: 18px;
      border: 1.5px solid var(--border);
      display: none;
    }

    .feedback.show {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    .feedback.is-correct {
      background: #f0fdf4;
      border-color: #86efac;
    }

    .feedback.is-wrong {
      background: #fef2f2;
      border-color: #fca5a5;
    }

    .feedback.is-partial {
      background: #fffbeb;
      border-color: #fcd34d;
    }

    .fb-header {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .fb-header.correct-text { color: var(--correct); }
    .fb-header.wrong-text { color: var(--wrong); }
    .fb-header.partial-text { color: var(--amber); }

    .model-answer {
      background: #ffffff;
      border-left: 4px solid var(--primary);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }

    .model-answer strong {
      display: block;
      font-size: 0.82rem;
      color: var(--primary-dark);
      margin-bottom: 3px;
    }

    .kw-box {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .kw-title {
      font-size: 0.83rem;
      font-weight: 800;
      color: var(--indigo);
      margin-bottom: 8px;
    }

    .kw-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .kw-chip {
      font-size: 0.84rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
    }

    .kw-chip.hit {
      background: var(--correct-bg);
      border-color: #4ade80;
      color: var(--correct);
    }

    .kw-chip.miss {
      background: #fee2e2;
      border-color: #f87171;
      color: var(--wrong);
    }

    .explanation {
      font-size: 0.94rem;
      color: #1e293b;
      line-height: 1.7;
    }

    .trap-box {
      margin-top: 10px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.88rem;
      color: #92400e;
    }

    .self-grade {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .sg-btn {
      border: 1.5px solid var(--border);
      background: #fff;
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 0.83rem;
      font-weight: 700;
      cursor: pointer;
    }

    .sg-btn.active-ok {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
    }

    .sg-btn.active-ng {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }

    .next-wrap {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
    }

    /* Result Screen */
    .result-screen {
      display: none;
      text-align: center;
    }

    .result-screen.show {
      display: block;
    }

    .score-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px auto 18px;
      border: 4px solid var(--primary);
    }

    .score-num {
      font-size: 2rem;
      font-weight: 900;
      line-height: 1.1;
    }

    .score-sub {
      font-size: 0.82rem;
      font-weight: 700;
    }

    .breakdown {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0;
      text-align: left;
    }

    .bd-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .bd-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
    }

    .bd-val {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      margin-top: 2px;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 18px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .card { padding: 18px 16px; }
      .breakdown { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge-title">中学1年 2学期末テスト対策｜音楽</div>
      <h1>記述問題＆ひっかけ○× 特化テスト</h1>
      <p class="subtitle">「理由・仕組みを答える短文記述」＋「紛らわしい用語ペアの○×」を1問1答で完全攻略</p>
    </header>

    <div class="mode-bar" id="modeBar">
      <button class="mode-btn active" data-mode="all">すべて（全20問）</button>
      <button class="mode-btn" data-mode="essay">短文記述のみ（6問）</button>
      <button class="mode-btn" data-mode="ox">ひっかけ○×のみ（14問）</button>
    </div>

    <div class="card" id="quizCard">
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="progressLabel">第 1 問 / 20 問</span>
          <span id="scoreLabel">正解：0 問</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="q-tags" id="qTags"></div>
      <div class="q-text" id="qText"></div>
      <div class="pair-hint" id="pairHint" style="display:none;"></div>

      <!-- ○× UI -->
      <div class="ox-grid" id="oxArea" style="display:none;">
        <button class="ox-btn" id="btnO" onclick="answerOX(true)">
          <span class="symbol">○</span>
          <span>正しい</span>
        </button>
        <button class="ox-btn" id="btnX" onclick="answerOX(false)">
          <span class="symbol">×</span>
          <span>誤り（ひっかけ）</span>
        </button>
      </div>

      <!-- Essay UI -->
      <div class="essay-wrap" id="essayArea" style="display:none;">
        <textarea id="essayInput" placeholder="ここに理由や仕組みを短文で入力してください..."></textarea>
        <div class="action-row">
          <button class="btn btn-primary" id="checkEssayBtn" onclick="checkEssay()">答え合わせ＆解説を見る</button>
          <button class="btn btn-secondary" id="skipEssayBtn" onclick="revealEssay()">わからない（模範解答を見る）</button>
        </div>
      </div>

      <!-- Feedback -->
      <div class="feedback" id="feedbackBox">
        <div class="fb-header" id="fbHeader"></div>
        <div class="model-answer" id="modelAnswerBox" style="display:none;">
          <strong>模範解答</strong>
          <span id="modelAnswerText"></span>
        </div>
        <div class="kw-box" id="kwBox" style="display:none;">
          <div class="kw-title">📌 記述に含めるべき必須キーワード（採点ポイント）</div>
          <div class="kw-list" id="kwList"></div>
        </div>
        <div class="explanation" id="fbExplanation"></div>
        <div class="trap-box" id="trapBox" style="display:none;"></div>
        <div class="self-grade" id="selfGradeBox" style="display:none;">
          <span>自己採点を変更：</span>
          <button class="sg-btn" id="sgOk" onclick="setSelfGrade(true)">〇 正解にする</button>
          <button class="sg-btn" id="sgNg" onclick="setSelfGrade(false)">× 要復習にする</button>
        </div>
        <div class="next-wrap">
          <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">次の問題へ →</button>
        </div>
      </div>
    </div>

    <div class="card result-screen" id="resultCard">
      <h2>テスト結果</h2>
      <div class="score-circle">
        <div class="score-num" id="finalPercent">0%</div>
        <div class="score-sub" id="finalFraction">0 / 0 問</div>
      </div>
      <p id="finalMessage" style="font-weight:700; color:#334155;"></p>

      <div class="breakdown">
        <div class="bd-card">
          <div class="bd-title">短文記述（理由・仕組み）</div>
          <div class="bd-val" id="bdEssay">-</div>
        </div>
        <div class="bd-card">
          <div class="bd-title">ひっかけ○×（用語対比）</div>
          <div class="bd-val" id="bdOx">-</div>
        </div>
      </div>

      <div class="result-actions">
        <button class="btn btn-primary" id="retryWrongBtn" onclick="retryWrong()">間違えた問題だけ復習する</button>
        <button class="btn btn-secondary" onclick="restartMode()">最初からやり直す</button>
      </div>
    </div>
  </div>

  <script>
    const ALL_QUESTIONS = [
      // ====== 【重要テーマ1】短文記述（理由・仕組み） ======
      {
        id: 1,
        type: "essay",
        unit: "魔王・シューベルト",
        coreTheme: "重要テーマ①",
        question: "シューベルトの代表分野である「リート」とはどのような特徴・仕組みをもつ楽曲ですか。また、『魔王』ではそれによって何がどのように表現されていますか。",
        modelAnswer: "ドイツ語による歌曲で、歌とピアノ伴奏が一体となって、詩の内容やイメージを巧みに表現している。",
        keywords: [
          { label: "ドイツ語（による歌曲）", match: ["ドイツ語", "歌曲"] },
          { label: "歌とピアノ伴奏が一体", match: ["一体", "歌とピアノ", "伴奏"] },
          { label: "詩の内容やイメージを表現", match: ["詩の内容", "イメージ", "詩"] }
        ],
        explanation: "プリントでは「リート（ドイツ語による歌曲）では歌とピアノ伴奏が一体となって、詩の内容やイメージが巧みに表現されています」と説明されています。単なる「歌の伴奏」ではなく、ピアノも物語を描く主役の一部になっている点が記述の核になります。",
        trap: "「イタリア語」や「ピアノだけの独奏曲」と書かないように注意！"
      },
      {
        id: 2,
        type: "essay",
        unit: "魔王・シューベルト",
        coreTheme: "重要テーマ①",
        question: "『魔王』のピアノ伴奏において、右手（上の段）の三連符と、左手（下の段）はそれぞれ何を表現していますか。左右の役割の違いがわかるように説明しなさい。",
        modelAnswer: "右手（上の段）の三連符は馬が激しく走っている様子を表現し、左手（下の段）は恐ろしさや嵐のような不気味さを表現している。",
        keywords: [
          { label: "右手：馬が激しく走っている", match: ["馬", "走"] },
          { label: "三連符", match: ["三連符", "3連符"] },
          { label: "左手：恐ろしさ・嵐のような", match: ["恐ろしさ", "嵐", "怖"] }
        ],
        explanation: "『魔王』の楽譜では、速く（♩=152）・ト短調の緊迫した雰囲気の中で、右手が連続する三連符で「馬が激しく走っている様子（馬の疾走）」を、左手の低い音型が「恐ろしさ・嵐のような様子」を表現しています。",
        trap: "右手（上の段）と左手（下の段）の表現を逆に書かないように注意！"
      },
      // ====== 【重要テーマ2】短文記述（理由・仕組み） ======
      {
        id: 3,
        type: "essay",
        unit: "リコーダー",
        coreTheme: "重要テーマ②",
        question: "アルトリコーダーで高い「レ」などを吹くとき、なぜ決まった3点で楽器を支えるのですか。また、それでも安定しない場合はどのように工夫すればよいですか。",
        modelAnswer: "唇・左手中指・右手親指の3点で楽器をバランスよく支えるため。それでも安定しない場合は、右手の小指を6と7のトーンホールの間に添えるとよい。",
        keywords: [
          { label: "唇・左手中指・右手親指の3点", match: ["唇", "左手中指", "右手親指"] },
          { label: "バランスよく支える", match: ["バランス", "支え"] },
          { label: "右手の小指を6と7のトーンホールの間に添える", match: ["小指", "6と7", "トーンホール"] }
        ],
        explanation: "高い「レ」などの運指では押さえる穴が少なく楽器が不安定になりやすいため、「唇・左手中指・右手親指」の3点でバランスよく支えます。さらに安定しないときは「右手の小指を6と7のトーンホールの間に添える」のが正しい工夫です。",
        trap: "「左手の親指」や「右手の中指」など、左右・指の名称の取り違えに注意！"
      },
      {
        id: 4,
        type: "essay",
        unit: "楽典・音符と休符",
        coreTheme: "重要テーマ②",
        question: "音符に「付点」がつくと、音の長さはどのような仕組みで変わりますか。具体例を1つ挙げて説明しなさい。",
        modelAnswer: "付点がつくと音の長さはもとの1.5倍になる。例えば、2分音符（2拍）に付点がついた付点2分音符は3拍になる（または4分音符1拍→付点4分音符1と1/2拍）。",
        keywords: [
          { label: "1.5倍になる", match: ["1.5倍"] },
          { label: "具体例（2分音符→3拍 など）", match: ["2分音符", "3拍", "4分音符", "1と1/2", "1.5拍", "8分音符", "3/4"] }
        ],
        explanation: "テスト対策プリントの重要ルール「※付点がつくと長さは1.5倍になる」をそのまま説明できれば満点です。もとの音符の長さ＋その半分の長さを足す仕組みなので、2分音符（2拍）→3拍、4分音符（1拍）→1と1/2拍、8分音符（1/2拍）→3/4拍になります。",

    let currentMode = "all";
    let activeQuestions = [...ALL_QUESTIONS];
    let currentIndex = 0;
    let score = 0;
    let results = []; // { id, type, correct }
    let answeredCurrent = false;

    const modeBtns = document.querySelectorAll(".mode-btn");
    modeBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        modeBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentMode = btn.dataset.mode;
        initQuiz();
      });
    });

    function initQuiz(customList = null) {
      if (customList) {
        activeQuestions = customList;
      } else if (currentMode === "essay") {
        activeQuestions = ALL_QUESTIONS.filter(q => q.type === "essay");
      } else if (currentMode === "ox") {
        activeQuestions = ALL_QUESTIONS.filter(q => q.type === "ox");
      } else {
        activeQuestions = [...ALL_QUESTIONS];
      }
      currentIndex = 0;
      score = 0;
      results = [];
      document.getElementById("quizCard").style.display = "block";
      document.getElementById("resultCard").classList.remove("show");
      renderQuestion();
    }

    function renderQuestion() {
      answeredCurrent = false;
      const q = activeQuestions[currentIndex];
      const total = activeQuestions.length;

      document.getElementById("progressLabel").textContent = `第 ${currentIndex + 1} 問 / ${total} 問`;
      document.getElementById("scoreLabel").textContent = `正解：${score} 問`;
      document.getElementById("progressFill").style.width = `${((currentIndex) / total) * 100}%`;

      // Tags
      const tagsEl = document.getElementById("qTags");
      tagsEl.innerHTML = "";
      const unitTag = document.createElement("span");
      unitTag.className = "tag tag-unit";
      unitTag.textContent = q.unit;
      tagsEl.appendChild(unitTag);

      const typeTag = document.createElement("span");
      typeTag.className = q.type === "essay" ? "tag tag-essay" : "tag tag-ox";
      typeTag.textContent = q.type === "essay" ? "短文記述（理由・仕組み）" : "ひっかけ○×問題";
      tagsEl.appendChild(typeTag);

      if (q.coreTheme) {
        const coreTag = document.createElement("span");
        coreTag.className = "tag tag-core";
        coreTag.textContent = q.coreTheme;
        tagsEl.appendChild(coreTag);
      }

      document.getElementById("qText").textContent = q.question;

      const pairHint = document.getElementById("pairHint");
      if (q.pair) {
        pairHint.style.display = "block";
        pairHint.textContent = `⚡ ${q.pair}`;
      } else {
        pairHint.style.display = "none";
      }

      // Reset feedback
      const fb = document.getElementById("feedbackBox");
      fb.className = "feedback";
      document.getElementById("modelAnswerBox").style.display = "none";
      document.getElementById("kwBox").style.display = "none";
      document.getElementById("trapBox").style.display = "none";
      document.getElementById("selfGradeBox").style.display = "none";

      if (q.type === "ox") {
        document.getElementById("oxArea").style.display = "grid";
        document.getElementById("essayArea").style.display = "none";
        const btnO = document.getElementById("btnO");
        const btnX = document.getElementById("btnX");
        btnO.disabled = false;
        btnX.disabled = false;
        btnO.className = "ox-btn";
        btnX.className = "ox-btn";
      } else {
        document.getElementById("oxArea").style.display = "none";
        document.getElementById("essayArea").style.display = "block";
        const ta = document.getElementById("essayInput");
        ta.value = "";
        ta.disabled = false;
        document.getElementById("checkEssayBtn").disabled = false;
        document.getElementById("skipEssayBtn").disabled = false;
      }

      document.getElementById("nextBtn").textContent =
        currentIndex === total - 1 ? "結果を見る →" : "次の問題へ →";
    }

    function answerOX(userChoice) {
      if (answeredCurrent) return;
      answeredCurrent = true;

      const q = activeQuestions[currentIndex];
      const isCorrect = userChoice === q.correct;
      if (isCorrect) score++;
      results.push({ id: q.id, type: q.type, correct: isCorrect });

      const btnO = document.getElementById("btnO");
      const btnX = document.getElementById("btnX");
      btnO.disabled = true;
      btnX.disabled = true;

      if (userChoice === true) {
        btnO.classList.add(isCorrect ? "selected-correct" : "selected-wrong");
        if (!isCorrect) btnX.classList.add("reveal-correct");
      } else {
        btnX.classList.add(isCorrect ? "selected-correct" : "selected-wrong");
        if (!isCorrect) btnO.classList.add("reveal-correct");
      }

      const fb = document.getElementById("feedbackBox");
      fb.className = `feedback show ${isCorrect ? "is-correct" : "is-wrong"}`;

      const header = document.getElementById("fbHeader");
      header.className = `fb-header ${isCorrect ? "correct-text" : "wrong-text"}`;
      header.textContent = isCorrect
        ? `⭕ 正解！（答え：${q.correct ? "○" : "×"}）`
        : `❌ 不正解…（正解は：${q.correct ? "○" : "×"}）`;

      document.getElementById("fbExplanation").textContent = q.explanation;
      if (q.trap) {
        const trapBox = document.getElementById("trapBox");
        trapBox.style.display = "block";
        trapBox.textContent = `⚠️ ${q.trap}`;
      }
      document.getElementById("scoreLabel").textContent = `正解：${score} 問`;
    }

    function checkEssay() {
      const text = document.getElementById("essayInput").value.trim();
      if (!text) {
        alert("まずは自分で答えを入力してみましょう！（わからない場合は「わからない（模範解答を見る）」を押してください）");
        return;
      }
      evaluateEssay(text, false);
    }

    function revealEssay() {
      const text = document.getElementById("essayInput").value.trim();
      evaluateEssay(text, true);
    }

    function evaluateEssay(userText, skipped) {
      if (answeredCurrent) return;
      answeredCurrent = true;

      const q = activeQuestions[currentIndex];
      document.getElementById("essayInput").disabled = true;
      document.getElementById("checkEssayBtn").disabled = true;
      document.getElementById("skipEssayBtn").disabled = true;

      const normalized = userText.replace(/\s+/g, "").toLowerCase();
      let hitCount = 0;

      const kwListEl = document.getElementById("kwList");
      kwListEl.innerHTML = "";

      q.keywords.forEach(kw => {
        const isHit = !skipped && kw.match.some(m => normalized.includes(m.toLowerCase()));
        if (isHit) hitCount++;
        const chip = document.createElement("span");
        chip.className = `kw-chip ${isHit ? "hit" : "miss"}`;
        chip.textContent = `${isHit ? "✓ " : "・"}${kw.label}`;
        kwListEl.appendChild(chip);
      });

      const totalKw = q.keywords.length;
      const isCorrect = !skipped && hitCount === totalKw;
      const isPartial = !skipped && hitCount > 0 && hitCount < totalKw;

      if (isCorrect) score++;
      results.push({ id: q.id, type: q.type, correct: isCorrect });

      const fb = document.getElementById("feedbackBox");
      fb.className = `feedback show ${isCorrect ? "is-correct" : isPartial ? "is-partial" : "is-wrong"}`;

      const header = document.getElementById("fbHeader");
      header.className = `fb-header ${isCorrect ? "correct-text" : isPartial ? "partial-text" : "wrong-text"}`;
      if (skipped) {
        header.textContent = "📖 模範解答と必須キーワードを確認しよう";
      } else if (isCorrect) {
        header.textContent = `⭕ 完璧！必須キーワードをすべて含んでいます（${hitCount}/${totalKw}）`;
      } else if (isPartial) {
        header.textContent = `△ 惜しい！キーワードが ${hitCount}/${totalKw} 個含まれています`;
      } else {
        header.textContent = `❌ 必須キーワードが抜けています（0/${totalKw}）`;
      }

      document.getElementById("modelAnswerBox").style.display = "block";
      document.getElementById("modelAnswerText").textContent = q.modelAnswer;
      document.getElementById("kwBox").style.display = "block";
      document.getElementById("fbExplanation").textContent = q.explanation;

      if (q.trap) {
        const trapBox = document.getElementById("trapBox");
        trapBox.style.display = "block";
        trapBox.textContent = `⚠️ ${q.trap}`;
      }

      // Self grade buttons
      document.getElementById("selfGradeBox").style.display = "flex";
      updateSelfGradeUI(isCorrect);
      document.getElementById("scoreLabel").textContent = `正解：${score} 問`;
    }

    function setSelfGrade(markCorrect) {
      const lastResult = results[results.length - 1];
      if (!lastResult || lastResult.correct === markCorrect) return;
      lastResult.correct = markCorrect;
      score += markCorrect ? 1 : -1;
      document.getElementById("scoreLabel").textContent = `正解：${score} 問`;
      updateSelfGradeUI(markCorrect);
    }

    function updateSelfGradeUI(isCorrect) {
      const okBtn = document.getElementById("sgOk");
      const ngBtn = document.getElementById("sgNg");
      okBtn.className = `sg-btn ${isCorrect ? "active-ok" : ""}`;
      ngBtn.className = `sg-btn ${!isCorrect ? "active-ng" : ""}`;
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < activeQuestions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById("quizCard").style.display = "none";
      const resultCard = document.getElementById("resultCard");
      resultCard.classList.add("show");

      const total = activeQuestions.length;
      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      document.getElementById("finalPercent").textContent = `${pct}%`;
      document.getElementById("finalFraction").textContent = `${score} / ${total} 問`;

      let msg = "テスト本番に向けて、間違えた問題と必須キーワードをもう一度確認しよう！";
      if (pct === 100) msg = "パーフェクト！記述のキーワードもひっかけ○×も完璧です！";
      else if (pct >= 80) msg = "素晴らしい！あと少しの復習で高得点が狙えます。";
      document.getElementById("finalMessage").textContent = msg;

      const essayRes = results.filter(r => r.type === "essay");
      const oxRes = results.filter(r => r.type === "ox");
      document.getElementById("bdEssay").textContent = essayRes.length
        ? `${essayRes.filter(r => r.correct).length} / ${essayRes.length} 問`
        : "出題なし";
      document.getElementById("bdOx").textContent = oxRes.length
        ? `${oxRes.filter(r => r.correct).length} / ${oxRes.length} 問`
        : "出題なし";

      const wrongIds = results.filter(r => !r.correct).map(r => r.id);
      const retryBtn = document.getElementById("retryWrongBtn");
      retryBtn.style.display = wrongIds.length > 0 ? "inline-block" : "none";
    }

    function retryWrong() {
      const wrongIds = results.filter(r => !r.correct).map(r => r.id);
      const wrongList = ALL_QUESTIONS.filter(q => wrongIds.includes(q.id));
      if (wrongList.length > 0) initQuiz(wrongList);
    }

    function restartMode() {
      initQuiz();
    }

    initQuiz();
  </script>
</body>
</html>
