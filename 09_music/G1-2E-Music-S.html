<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中1 2学期末テスト対策 音楽 4択クイズ</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #3b5bdb;
      --primary-light: #edf2ff;
      --primary-dark: #2b44a8;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --correct: #16a34a;
      --correct-bg: #dcfce7;
      --wrong: #dc2626;
      --wrong-bg: #fee2e2;
      --accent: #f59e0b;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
      padding: 20px 14px 48px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    .badge-title {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #0f172a;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .mode-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 18px;
    }

    .mode-btn {
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .mode-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 24px 22px;
      border: 1px solid var(--border);
    }

    .progress-wrap {
      margin-bottom: 18px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .category-tag {
      background: #f1f5f9;
      color: #334155;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
    }

    .progress-bar-bg {
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #5c7cfa);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: 1.12rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 16px;
    }

    .visual-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice-btn {
      width: 100%;
      text-align: left;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .choice-btn:disabled {
      cursor: default;
    }

    .choice-label {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f1f5f9;
      color: #334155;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .choice-btn.correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: #14532d;
    }

    .choice-btn.correct .choice-label {
      background: var(--correct);
      color: #fff;
    }

    .choice-btn.wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: #7f1d1d;
    }

    .choice-btn.wrong .choice-label {
      background: var(--wrong);
      color: #fff;
    }

    .choice-btn.dimmed {
      opacity: 0.55;
    }

    .feedback-box {
      margin-top: 18px;
      border-radius: 12px;
      padding: 16px;
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.is-correct {
      background: #f0fdf4;
      border: 1.5px solid #86efac;
    }

    .feedback-box.is-wrong {
      background: #fef2f2;
      border: 1.5px solid #fca5a5;
    }

    .feedback-status {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .feedback-box.is-correct .feedback-status {
      color: var(--correct);
    }

    .feedback-box.is-wrong .feedback-status {
      color: var(--wrong);
    }

    .explanation-text {
      font-size: 0.94rem;
      color: #1e293b;
      line-height: 1.7;
    }

    .next-wrap {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
    }

    .primary-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
      font-family: inherit;
    }

    .primary-btn:hover {
      background: var(--primary-dark);
    }

    .secondary-btn {
      background: #fff;
      color: var(--primary);
      border: 2px solid var(--primary);
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.94rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .secondary-btn:hover {
      background: var(--primary-light);
    }

    /* Result screen */
    .result-screen {
      display: none;
    }

    .result-screen.show {
      display: block;
    }

    .score-hero {
      text-align: center;
      padding: 12px 0 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .score-num {
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--primary);
      line-height: 1.1;
    }

    .score-sub {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .cat-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 22px;
    }

    .cat-stat-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    .cat-stat-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
    }

    .cat-stat-val {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0f172a;
      margin-top: 2px;
    }

    .review-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
      margin-bottom: 20px;
    }

    .review-item {
      background: #fff;
      border: 1px solid var(--border);
      border-left: 4px solid var(--wrong);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.9rem;
    }

    .review-q {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .review-a {
      color: var(--correct);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .card { padding: 18px 15px; }
      h1 { font-size: 1.25rem; }
      .question-text { font-size: 1.03rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge-title">中学1年生 2学期末テスト対策</div>
      <h1>音楽 1問1答 4択テスト</h1>
      <p class="subtitle">『魔王』・リコーダー・楽典（音名・音符・休符）の全範囲を網羅</p>
    </header>

    <div class="mode-bar" id="modeBar">
      <button class="mode-btn active" data-cat="all">全範囲（25問）</button>
      <button class="mode-btn" data-cat="maou">『魔王』・シューベルト</button>
      <button class="mode-btn" data-cat="recorder">リコーダー</button>
      <button class="mode-btn" data-cat="theory">楽典（音名・音符・休符）</button>
    </div>

    <div class="card" id="quizCard">
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="progressText">第 1 問 / 25 問</span>
          <span class="category-tag" id="categoryTag">『魔王』</span>
          <span id="scoreLive">正解: 0</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill" style="width: 4%;"></div>
        </div>
      </div>

      <div class="question-text" id="questionText"></div>
      <div class="visual-box" id="visualBox" style="display: none;"></div>
      <div class="choices" id="choicesContainer"></div>

      <div class="feedback-box" id="feedbackBox">
        <div class="feedback-status" id="feedbackStatus"></div>
        <div class="explanation-text" id="explanationText"></div>
        <div class="next-wrap">
          <button class="primary-btn" id="nextBtn">次の問題へ →</button>
        </div>
      </div>
    </div>

    <div class="card result-screen" id="resultScreen">
      <div class="score-hero">
        <div class="score-num" id="finalScore">0 / 25</div>
        <div class="score-sub" id="finalRate">正答率 0%</div>
      </div>
      <div class="cat-stats" id="catStats"></div>
      <div id="wrongSection">
        <h3 style="font-size: 1rem; margin-bottom: 6px;">間違えた問題の復習</h3>
        <div class="review-list" id="reviewList"></div>
      </div>
      <div class="result-actions">
        <button class="secondary-btn" id="retryWrongBtn" style="display:none;">間違えた問題だけやり直す</button>
        <button class="primary-btn" id="retryAllBtn">最初からやり直す</button>
      </div>
    </div>
  </div>

  <script>
    // SVG Generators for musical notation & recorder fingerings
    function svgStaffNote(stepFromBottomC, noteType = "quarter", label = "") {
      // stepFromBottomC: 0=下第1線ド, 1=下第1間レ, 2=第1線ミ, 3=第1間ファ, 4=第2線ソ, 5=第2間ラ, 6=第3線シ, 7=第3間ド, 8=第4線レ, 9=第4間ミ
      const lineYs = [40, 52, 64, 76, 88]; // top to bottom: F5, D5, B4, G4, E4
      // E4 (第1線ミ) is y=88, each step is 6px up
      const noteY = 100 - stepFromBottomC * 6;
      const isWhiteHead = noteType === "half" || noteType === "whole" || noteType === "dotted-half";
      const hasStem = noteType !== "whole";
      const hasFlag = noteType === "eighth" || noteType === "dotted-eighth";
      const hasDot = noteType.startsWith("dotted");
      const stemUp = stepFromBottomC < 6;

      let ledger = "";
      if (stepFromBottomC === 0) {
        ledger = `<line x1="114" y1="100" x2="146" y2="100" stroke="#1e293b" stroke-width="1.8"/>`;
      }

      let head = isWhiteHead
        ? `<ellipse cx="130" cy="${noteY}" rx="7.5" ry="5.5" fill="#ffffff" stroke="#1e293b" stroke-width="2.2" transform="rotate(-18 130 ${noteY})"/>`
        : `<ellipse cx="130" cy="${noteY}" rx="7.5" ry="5.5" fill="#1e293b" transform="rotate(-18 130 ${noteY})"/>`;

      let stem = "";
      if (hasStem) {
        if (stemUp) {
          stem = `<line x1="136.5" y1="${noteY}" x2="136.5" y2="${noteY - 34}" stroke="#1e293b" stroke-width="2"/>`;
          if (hasFlag) {
            stem += `<path d="M136.5 ${noteY - 34} Q149 ${noteY - 24} 145 ${noteY - 12}" fill="none" stroke="#1e293b" stroke-width="2.4" stroke-linecap="round"/>`;
          }
        } else {
          stem = `<line x1="123.5" y1="${noteY}" x2="123.5" y2="${noteY + 34}" stroke="#1e293b" stroke-width="2"/>`;
          if (hasFlag) {
            stem += `<path d="M123.5 ${noteY + 34} Q136 ${noteY + 24} 132 ${noteY + 12}" fill="none" stroke="#1e293b" stroke-width="2.4" stroke-linecap="round"/>`;
          }
        }
      }

      let dot = hasDot ? `<circle cx="144" cy="${noteY - (stepFromBottomC % 2 === 0 ? 3 : 0)}" r="2.6" fill="#1e293b"/>` : "";
      let arrow = label ? `<text x="130" y="122" text-anchor="middle" font-size="13" font-weight="800" fill="#3b5bdb">${label}</text>` : "";

      return `
        <svg width="240" height="130" viewBox="0 0 240 130" aria-label="五線譜">
          ${lineYs.map(y => `<line x1="20" y1="${y}" x2="220" y2="${y}" stroke="#334155" stroke-width="1.5"/>`).join("")}
          <text x="28" y="85" font-size="56" font-family="serif" fill="#1e293b">𝄞</text>
          ${ledger}
          ${head}
          ${stem}
          ${dot}
          ${arrow}
        </svg>
      `;
    }

    function svgRest(type) {
      if (type === "quarter") {
        return `
          <svg width="140" height="86" viewBox="0 0 140 86" aria-label="休符">
            <line x1="20" y1="22" x2="120" y2="22" stroke="#94a3b8" stroke-width="1.2"/>
            <line x1="20" y1="34" x2="120" y2="34" stroke="#94a3b8" stroke-width="1.2"/>
            <line x1="20" y1="46" x2="120" y2="46" stroke="#94a3b8" stroke-width="1.2"/>
            <line x1="20" y1="58" x2="120" y2="58" stroke="#94a3b8" stroke-width="1.2"/>
            <line x1="20" y1="70" x2="120" y2="70" stroke="#94a3b8" stroke-width="1.2"/>
            <path d="M66 24 L75 35 L65 45 L75 56 C67 56 64 63 72 68" fill="none" stroke="#0f172a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        `;
      }
      // eighth rest
      return `
        <svg width="140" height="86" viewBox="0 0 140 86" aria-label="休符">
          <line x1="20" y1="22" x2="120" y2="22" stroke="#94a3b8" stroke-width="1.2"/>
          <line x1="20" y1="34" x2="120" y2="34" stroke="#94a3b8" stroke-width="1.2"/>
          <line x1="20" y1="46" x2="120" y2="46" stroke="#94a3b8" stroke-width="1.2"/>
          <line x1="20" y1="58" x2="120" y2="58" stroke="#94a3b8" stroke-width="1.2"/>
          <line x1="20" y1="70" x2="120" y2="70" stroke="#94a3b8" stroke-width="1.2"/>
          <circle cx="64" cy="37" r="4" fill="#0f172a"/>
          <path d="M66 38 Q74 40 77 32 L68 64" fill="none" stroke="#0f172a" stroke-width="2.8" stroke-linecap="round"/>
        </svg>
      `;
    }

    function svgRecorder(holes) {
      // holes: {0: bool, 1: bool, 2: bool, 3: bool}
      const holeItem = (num, y, label) => {
        const filled = holes[num];
        return `
          <circle cx="70" cy="${y}" r="8" fill="${filled ? '#0f172a' : '#ffffff'}" stroke="#0f172a" stroke-width="2"/>
          <text x="92" y="${y + 4}" font-size="12" font-weight="700" fill="#475569">${label}</text>
        `;
      };
      return `
        <svg width="190" height="150" viewBox="0 0 190 150" aria-label="リコーダー運指図">
          <rect x="48" y="8" width="44" height="134" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
          <line x1="48" y1="36" x2="92" y2="36" stroke="#94a3b8" stroke-width="1.2"/>
          <circle cx="30" cy="24" r="7" fill="${holes[0] ? '#0f172a' : '#ffffff'}" stroke="#0f172a" stroke-width="2"/>
          <text x="10" y="28" font-size="11" font-weight="700" fill="#475569">0(親)</text>
          ${holeItem(1, 56, "1(人)")}
          ${holeItem(2, 82, "2(中)")}
          ${holeItem(3, 108, "3(薬)")}
          <text x="70" y="133" text-anchor="middle" font-size="11" fill="#64748b">● 押さえる / ○ 開ける</text>
        </svg>
      `;
    }

    const QUESTIONS = [
      // === 第1章：『魔王』・シューベルト（8問） ===
      {
        id: 1,
        cat: "maou",
        catName: "『魔王』・シューベルト",
        q: "『魔王』の作曲者シューベルトは、どこの国のウィーン郊外に生まれましたか？",
        choices: ["ドイツ", "オーストリア", "イタリア", "フランス"],
        answer: 1,
        exp: "シューベルトは「オーストリア」のウィーン郊外に生まれました。ワークシートの本文①でも「オーストリアのウィーン郊外に生まれました」と記載されています（ドイツ語圏の作曲家です）。"
      },
      {
        id: 2,
        cat: "maou",
        catName: "『魔王』・シューベルト",
        q: "シューベルトは何歳という若さで亡くなりましたか？",
        choices: ["25歳", "31歳", "35歳", "42歳"],
        answer: 1,
        exp: "シューベルトは「31歳」という若さで亡くなりましたが、管弦楽曲や室内楽曲、ピアノ曲、リート、宗教音楽など数多くの作品を残しています。"
      },
      {
        id: 3,
        cat: "maou",
        catName: "『魔王』・シューベルト",
        q: "歌曲『魔王』の作詞者はだれですか？",
        choices: ["シラー", "ゲーテ", "ハイネ", "モーツァルト"],
        answer: 1,
        exp: "『魔王』はドイツの文豪「ゲーテ」が作詞した詩に、シューベルトが作曲した歌曲です。"
      },
      {
        id: 4,
        cat: "maou",
        catName: "『魔王』・シューベルト",
        q: "「リート」とはどのような音楽のことですか？また、シューベルトはおよそ何曲のリートを残しましたか？",
        choices: [
          "イタリア語によるオペラ／およそ100曲",
          "ドイツ語による歌曲／およそ600曲",
          "ピアノ独奏のための小品／およそ300曲",
          "オーケストラのための交響曲／およそ9曲"
        ],
        answer: 1,
        exp: "「リート」はドイツ語による歌曲のことです。シューベルトはおよそ600曲ものリートを残し、「歌曲王」とも呼ばれます。"
      },
      {
        id: 5,
        cat: "maou",
        catName: "『魔王』・シューベルト",
        q: "シューベルトの「リート」の特徴として、ワークシートに書かれている正しい説明はどれですか？",
        choices: [
          "歌だけで演奏され、伴奏はつかない",
          "歌とピアノ伴奏が一体となって、詩の内容やイメージが巧みに表現されている",
          "ピアノ伴奏はリズムを刻むだけで、歌詞の内容とは関係がない",
          "必ず4人の合唱とオーケストラで演奏される"
        ],
        answer: 1,
        exp: "リートでは「歌とピアノ伴奏が一体となって、詩の内容やイメージが巧みに表現されている」のが大きな特徴です。"
      },
      {
        id: 6,
        cat: "maou",
        catName: "『魔王』・シューベルト",
        q: "『魔王』の楽譜に書かれている速度と原調の組み合わせとして正しいものはどれですか？",
        choices: [
          "ゆっくり（♩=60）／ハ長調",
          "速く（♩=152）／ト短調",
          "中くらいの速さで（♩=100）／ニ長調",
          "きわめて遅く（♩=48）／イ短調"
        ],
        answer: 1,
        exp: "『魔王』の楽譜冒頭には「速く（♩=152）〈原調：ト短調〉」と記載されています。緊迫感のある速いテンポと短調の響きが特徴です。"
      },
      {
        id: 7,
        cat: "maou",
        catName: "『魔王』・シューベルト",
        q: "『魔王』のピアノ伴奏の右手（上段）に繰り返し使われている音符の名前と、それが表現しているものは何ですか？",

        exp: "第1線「ミ」から上に数えると、第1間「ファ」→第2線「ソ」→第2間「ラ」→第3線「シ」→第3間「高いド」になります。練習問題のDと同じ位置です。"

    // State
    let currentCategory = "all";
    let activeQuestions = [...QUESTIONS];
    let currentIndex = 0;
    let score = 0;
    let answered = false;
    let userResults = []; // { qObj, chosenIndex, isCorrect }

    const modeBar = document.getElementById("modeBar");
    const quizCard = document.getElementById("quizCard");
    const resultScreen = document.getElementById("resultScreen");
    const progressText = document.getElementById("progressText");
    const categoryTag = document.getElementById("categoryTag");
    const scoreLive = document.getElementById("scoreLive");
    const progressFill = document.getElementById("progressFill");
    const questionText = document.getElementById("questionText");
    const visualBox = document.getElementById("visualBox");
    const choicesContainer = document.getElementById("choicesContainer");
    const feedbackBox = document.getElementById("feedbackBox");
    const feedbackStatus = document.getElementById("feedbackStatus");
    const explanationText = document.getElementById("explanationText");
    const nextBtn = document.getElementById("nextBtn");

    const finalScore = document.getElementById("finalScore");
    const finalRate = document.getElementById("finalRate");
    const catStats = document.getElementById("catStats");
    const wrongSection = document.getElementById("wrongSection");
    const reviewList = document.getElementById("reviewList");
    const retryWrongBtn = document.getElementById("retryWrongBtn");
    const retryAllBtn = document.getElementById("retryAllBtn");

    const LABELS = ["A", "B", "C", "D"];

    function startQuiz(questionsList) {
      activeQuestions = [...questionsList];
      currentIndex = 0;
      score = 0;
      userResults = [];
      quizCard.style.display = "block";
      resultScreen.classList.remove("show");
      renderQuestion();
    }

    function renderQuestion() {
      answered = false;
      const qObj = activeQuestions[currentIndex];
      const total = activeQuestions.length;

      progressText.textContent = `第 ${currentIndex + 1} 問 / ${total} 問`;
      categoryTag.textContent = qObj.catName;
      scoreLive.textContent = `正解: ${score}`;
      progressFill.style.width = `${((currentIndex + 1) / total) * 100}%`;

      questionText.textContent = qObj.q;

      if (qObj.visual) {
        visualBox.innerHTML = qObj.visual;
        visualBox.style.display = "flex";
      } else {
        visualBox.innerHTML = "";
        visualBox.style.display = "none";
      }

      choicesContainer.innerHTML = "";
      qObj.choices.forEach((choiceText, idx) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.innerHTML = `<span class="choice-label">${LABELS[idx]}</span><span>${choiceText}</span>`;
        btn.addEventListener("click", () => handleAnswer(idx));
        choicesContainer.appendChild(btn);
      });

      feedbackBox.className = "feedback-box";
      nextBtn.textContent = currentIndex === total - 1 ? "結果を見る →" : "次の問題へ →";
    }

    function handleAnswer(chosenIdx) {
      if (answered) return;
      answered = true;

      const qObj = activeQuestions[currentIndex];
      const isCorrect = chosenIdx === qObj.answer;
      if (isCorrect) score++;

      userResults.push({ qObj, chosenIndex: chosenIdx, isCorrect });
      scoreLive.textContent = `正解: ${score}`;

      const buttons = choicesContainer.querySelectorAll(".choice-btn");
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === qObj.answer) {
          btn.classList.add("correct");
        } else if (idx === chosenIdx && !isCorrect) {
          btn.classList.add("wrong");
        } else {
          btn.classList.add("dimmed");
        }
      });

      feedbackBox.className = `feedback-box show ${isCorrect ? "is-correct" : "is-wrong"}`;
      feedbackStatus.textContent = isCorrect
        ? "⭕ 正解！"
        : `❌ 不正解…（正解は ${LABELS[qObj.answer]}：${qObj.choices[qObj.answer]}）`;
      explanationText.textContent = qObj.exp;
    }

    nextBtn.addEventListener("click", () => {
      if (currentIndex < activeQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        showResults();
      }
    });

    function showResults() {
      quizCard.style.display = "none";
      resultScreen.classList.add("show");

      const total = activeQuestions.length;
      const pct = Math.round((score / total) * 100);
      finalScore.textContent = `${score} / ${total}`;
      finalRate.textContent = `正答率 ${pct}%`;

      // Category breakdown
      const catMap = {};
      userResults.forEach(r => {
        const name = r.qObj.catName;
        if (!catMap[name]) catMap[name] = { correct: 0, total: 0 };
        catMap[name].total++;
        if (r.isCorrect) catMap[name].correct++;
      });

      catStats.innerHTML = "";
      Object.entries(catMap).forEach(([name, st]) => {
        const div = document.createElement("div");
        div.className = "cat-stat-card";
        div.innerHTML = `
          <div class="cat-stat-name">${name}</div>
          <div class="cat-stat-val">${st.correct} / ${st.total} 問正解</div>
        `;
        catStats.appendChild(div);
      });

      const wrongs = userResults.filter(r => !r.isCorrect);
      if (wrongs.length === 0) {
        wrongSection.style.display = "none";
        retryWrongBtn.style.display = "none";
      } else {
        wrongSection.style.display = "block";
        retryWrongBtn.style.display = "inline-block";
        reviewList.innerHTML = "";
        wrongs.forEach(r => {
          const item = document.createElement("div");
          item.className = "review-item";
          item.innerHTML = `
            <div class="review-q">${r.qObj.q}</div>
            <div class="review-a">正解：${r.qObj.choices[r.qObj.answer]}</div>
            <div style="color:#475569;">${r.qObj.exp}</div>
          `;
          reviewList.appendChild(item);
        });
      }
    }

    modeBar.addEventListener("click", (e) => {
      const btn = e.target.closest(".mode-btn");
      if (!btn) return;
      modeBar.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCategory = btn.dataset.cat;
      const filtered = currentCategory === "all"
        ? QUESTIONS
        : QUESTIONS.filter(q => q.cat === currentCategory);
      startQuiz(filtered);
    });

    retryWrongBtn.addEventListener("click", () => {
      const wrongQs = userResults.filter(r => !r.isCorrect).map(r => r.qObj);
      startQuiz(wrongQs);
    });

    retryAllBtn.addEventListener("click", () => {
      const filtered = currentCategory === "all"
        ? QUESTIONS
        : QUESTIONS.filter(q => q.cat === currentCategory);
      startQuiz(filtered);
    });

    // Init
    startQuiz(QUESTIONS);
  </script>
